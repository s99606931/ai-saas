# 공공기관 SaaS 프레임워크 -- 운영 환경 values
# Design Ref: DESIGN-MTU-N04 | Plan SC: FR-N04.11
# CSAP D-07: 재해복구 (고가용성 구성)
# 사용법: helm install saas-prod ./helm/saas-platform -f helm/saas-platform/values-prod.yaml

global:
  nodeEnv: production
  logLevel: warn

# 운영: 외부 Secret (Sealed Secrets / Vault)
secrets:
  create: false
  existingSecretName: saas-secrets

# 운영: 최대 리소스
serviceDefaults:
  resources:
    limits:
      memory: 512Mi
      cpu: "1"
    requests:
      memory: 256Mi
      cpu: 200m

# 운영: 고가용성 레플리카
services:
  api-gateway:
    replicas: 3
    image:
      tag: latest
  auth-service:
    replicas: 2
    image:
      tag: latest
  user-service:
    replicas: 2
    image:
      tag: latest
  tenant-service:
    replicas: 2
    image:
      tag: latest
  audit-service:
    replicas: 3
    image:
      tag: latest
    pdb:
      enabled: true
      minAvailable: 2
  compliance-service:
    replicas: 2
    image:
      tag: latest
  security-monitor-service:
    replicas: 2
    image:
      tag: latest

# 운영: 포털 고가용성
portal:
  replicas: 2
  image:
    tag: latest
  resources:
    limits:
      memory: 1Gi

# 운영: PVC 사용 (영구 스토리지)
postgres:
  storage:
    type: pvc
    size: 50Gi

minio:
  storage:
    type: pvc
    size: 100Gi

# 운영: DB 백업 활성화
backup:
  enabled: true
  retentionDays: 365
  storage:
    size: 50Gi

# 운영: 모니터링 필수
monitoring:
  enabled: true
  alerts:
    cpuWarningThreshold: 70
    cpuCriticalThreshold: 90
    memoryWarningThreshold: 80
    memoryCriticalThreshold: 90
