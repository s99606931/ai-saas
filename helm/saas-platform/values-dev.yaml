# 공공기관 SaaS 프레임워크 -- 개발 환경 values
# Design Ref: DESIGN-MTU-N04 | Plan SC: FR-N04.11
# 사용법: helm install saas-dev ./helm/saas-platform -f helm/saas-platform/values-dev.yaml

global:
  nodeEnv: development
  logLevel: debug

# 개발 환경: Secret 직접 생성
secrets:
  create: true
  data:
    DATABASE_URL: "postgresql://saas:saas_dev_2026@postgres-svc:5432/saas_platform"
    DB_NAME: "saas_platform"
    DB_USER: "saas"
    DB_PASSWORD: "saas_dev_2026"
    JWT_SECRET: "dev-jwt-secret-change-in-production"
    REDIS_URL: "redis://default:redis_dev_2026@redis-svc:6379"
    REDIS_PASSWORD: "redis_dev_2026"
    MINIO_USER: "minio_admin"
    MINIO_PASSWORD: "minio_dev_2026"

# 개발: 최소 리소스, 단일 레플리카
serviceDefaults:
  resources:
    limits:
      memory: 256Mi
      cpu: 500m
    requests:
      memory: 64Mi
      cpu: 50m

services:
  audit-service:
    replicas: 1
    pdb:
      enabled: false

# 개발: DB 백업 불필요
backup:
  enabled: false

# 개발: 모니터링 선택적
monitoring:
  enabled: false
