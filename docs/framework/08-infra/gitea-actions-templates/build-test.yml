# Gitea Actions: 빌드 및 테스트 워크플로우
# MTU-I2 | FR-5.2 | CSAP-D12
#
# 트리거: push (모든 브랜치), pull_request (main)
# 단계: 의존성 설치 → 린트 → 단위 테스트 → 빌드 → 아티팩트 저장

name: Build and Test

on:
  push:
    branches: ['*']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  REGISTRY: harbor.internal.svc.cluster.local

jobs:
  lint:
    name: 코드 린트 검사
    runs-on: ubuntu-latest
    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 의존성 설치
        run: npm ci --prefer-offline

      - name: ESLint 실행
        run: npm run lint

      - name: TypeScript 타입 검사
        run: npx tsc --noEmit

  test:
    name: 단위 테스트
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 의존성 설치
        run: npm ci --prefer-offline

      - name: 단위 테스트 실행
        run: npm test -- --coverage --ci --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: ./reports
          JEST_JUNIT_OUTPUT_NAME: test-results.xml

      - name: 테스트 커버리지 확인 (80% 이상 필수)
        run: |
          COVERAGE=$(npx istanbul report --root coverage/ text-summary 2>/dev/null | grep "Statements" | awk '{print $3}' | tr -d '%')
          echo "Coverage: ${COVERAGE}%"
          if [ "$(echo "$COVERAGE < 80" | bc -l)" -eq 1 ]; then
            echo "[FAIL] 테스트 커버리지 ${COVERAGE}% < 80% (Q-GATE G4)"
            exit 1
          fi

      - name: 테스트 결과 아티팩트 저장
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: |
            reports/test-results.xml
            coverage/

  build:
    name: 컨테이너 이미지 빌드
    runs-on: ubuntu-latest
    needs: test
    if: gitea.ref == 'refs/heads/main'
    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Harbor 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: 이미지 빌드 및 Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/public-saas/app:${{ gitea.sha }}
            ${{ env.REGISTRY }}/public-saas/app:latest
          cache-from: type=registry,ref=${{ env.REGISTRY }}/public-saas/app:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/public-saas/app:buildcache,mode=max

      - name: 빌드 감사 로그 기록 (CSAP-D06-01)
        run: |
          cat >> /shared/audit.jsonl << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "actor": "${{ gitea.actor }}",
            "action": "BUILD",
            "target": "${{ gitea.repository }}@${{ gitea.sha }}",
            "pipelineRunId": "${{ gitea.run_id }}",
            "n2sfDomain": "N06",
            "csapControl": "D12-01",
            "result": "SUCCESS",
            "metadata": {
              "imageTag": "${{ gitea.sha }}"
            }
          }
          EOF
