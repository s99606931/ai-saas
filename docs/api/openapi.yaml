openapi: 3.0.3
info:
  title: 공공기관 SaaS 플랫폼 API
  description: |
    공공기관 SaaS 프레임워크 통합 API 명세.
    API 게이트웨이(`/api/v1/{service}/*`)를 통해 접근합니다.
    CSAP 중/상 등급 + N2SF 준수.
  version: 1.0.0
  contact:
    name: 공공기관 SaaS 프레임워크
  license:
    name: UNLICENSED

servers:
  - url: http://localhost:3000
    description: 로컬 개발 서버

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT 인증 토큰 (CSAP D-08-01)
  schemas:
    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    Pagination:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

tags:
  - name: auth
    description: 인증 서비스 (로그인/로그아웃/토큰 갱신/MFA)
  - name: users
    description: 사용자 관리 (CRUD, 역할, 비밀번호, CSAP D-08)
  - name: tenants
    description: 테넌트 관리 (격리, N2SF N-03)
  - name: menus
    description: 메뉴 관리 (역할별 필터링, CSAP D-08-05)
  - name: catalog
    description: 서비스 카탈로그 (Feature Flag 포함)
  - name: subscriptions
    description: 구독 관리 (플랜, 업/다운그레이드)
  - name: billing
    description: 빌링 서비스 (인보이스, 결제, 세금계산서)
  - name: crm
    description: CRM (고객사, 담당자, 계약, 파이프라인)
  - name: ai
    description: AI 서비스 (N2SF N-05 등급 검증, PII 마스킹)
  - name: notifications
    description: 알림 서비스 (이메일/인앱/SMS/웹훅)
  - name: files
    description: 파일 관리 (AES-256 암호화, MIME 검증)
  - name: audit
    description: 감사 로그 (CSAP D-06, append-only, SHA-256 체인)
  - name: compliance
    description: CSAP/N2SF 준수 현황 대시보드
  - name: security
    description: 보안 모니터링 (로그인 실패 탐지, IP 차단)
  - name: plugins
    description: 비즈니스 플러그인 (전자결재, 공공데이터)

paths:
  # ── 인증 서비스 ──
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, tenantSlug]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                tenantSlug: { type: string }
      responses:
        '200': { description: JWT 토큰 발급 }
        '401': { description: 인증 실패 }
        '423': { description: 계정 잠금 (CSAP D-08-06) }

  /api/v1/auth/logout:
    post:
      tags: [auth]
      summary: 로그아웃 (토큰 블랙리스트 등록)
      responses:
        '200': { description: 로그아웃 성공 }

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: 토큰 갱신
      security: []
      responses:
        '200': { description: 새 토큰 발급 }

  /api/v1/auth/verify:
    get:
      tags: [auth]
      summary: 토큰 검증
      responses:
        '200': { description: 토큰 유효 }

  /api/v1/auth/mfa/setup:
    post:
      tags: [auth]
      summary: MFA 설정 (TOTP)
      responses:
        '200': { description: MFA 설정 완료 }

  /api/v1/auth/mfa/verify:
    post:
      tags: [auth]
      summary: MFA 코드 검증
      responses:
        '200': { description: MFA 검증 성공 }

  # ── 사용자 서비스 ──
  /api/v1/users:
    get:
      tags: [users]
      summary: 사용자 목록 조회 (테넌트 격리)
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200': { description: 사용자 목록 }
    post:
      tags: [users]
      summary: 사용자 생성
      responses:
        '201': { description: 사용자 생성 완료 }

  /api/v1/users/{id}:
    get:
      tags: [users]
      summary: 사용자 상세 조회
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 사용자 정보 }
    put:
      tags: [users]
      summary: 사용자 수정
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 수정 완료 }
    delete:
      tags: [users]
      summary: 사용자 비활성화 (소프트 삭제)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 비활성화 완료 }

  /api/v1/users/{id}/password:
    put:
      tags: [users]
      summary: 비밀번호 변경
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 비밀번호 변경 완료 }

  /api/v1/users/{id}/role:
    put:
      tags: [users]
      summary: 역할 변경
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 역할 변경 완료 }

  # ── 테넌트 서비스 ──
  /api/v1/tenants:
    get:
      tags: [tenants]
      summary: 테넌트 목록 조회
      responses:
        '200': { description: 테넌트 목록 }
    post:
      tags: [tenants]
      summary: 테넌트 생성
      responses:
        '201': { description: 테넌트 생성 완료 }

  /api/v1/tenants/{id}:
    get:
      tags: [tenants]
      summary: 테넌트 상세 조회
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 테넌트 정보 }
    put:
      tags: [tenants]
      summary: 테넌트 수정
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 수정 완료 }

  /api/v1/tenants/{id}/status:
    put:
      tags: [tenants]
      summary: 테넌트 상태 변경 (ACTIVE/SUSPENDED/ARCHIVED)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 상태 변경 완료 }

  # ── AI 서비스 ──
  /api/v1/ai/models:
    get:
      tags: [ai]
      summary: AI 모델 목록
      responses:
        '200': { description: 모델 목록 }
    post:
      tags: [ai]
      summary: AI 모델 등록
      responses:
        '201': { description: 모델 등록 완료 }

  /api/v1/ai/chat:
    post:
      tags: [ai]
      summary: AI 채팅 (N2SF N-05 등급 검증)
      description: C/S등급 데이터 전송 절대 금지. O등급만 허용, PII 자동 마스킹.
      responses:
        '200': { description: AI 응답 }
        '403': { description: 등급 위반 차단 (N2SF N-05) }

  /api/v1/ai/usage:
    get:
      tags: [ai]
      summary: AI 사용량 조회 (테넌트별)
      responses:
        '200': { description: 사용량 데이터 }

  # ── 감사 로그 서비스 ──
  /api/v1/audit/logs:
    get:
      tags: [audit]
      summary: 감사 로그 조회 (필터, 커서 페이지네이션)
      responses:
        '200': { description: 감사 로그 목록 }
    post:
      tags: [audit]
      summary: 감사 로그 기록 (append-only)
      responses:
        '201': { description: 기록 완료 }

  /api/v1/audit/verify:
    post:
      tags: [audit]
      summary: SHA-256 체인 무결성 검증
      responses:
        '200': { description: 검증 결과 }

  /api/v1/audit/export:
    get:
      tags: [audit]
      summary: 감사 로그 내보내기 (CSV/JSON)
      responses:
        '200': { description: 로그 파일 }

  # ── 빌링 서비스 ──
  /api/v1/billing/invoices:
    get:
      tags: [billing]
      summary: 인보이스 목록 조회
      responses:
        '200': { description: 인보이스 목록 }

  /api/v1/billing/invoices/{id}/pay:
    post:
      tags: [billing]
      summary: 결제 처리
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 결제 완료 }

  # ── 구독 서비스 ──
  /api/v1/subscriptions/plans:
    get:
      tags: [subscriptions]
      summary: 플랜 목록 조회
      responses:
        '200': { description: 플랜 목록 }

  /api/v1/subscriptions/subscribe:
    post:
      tags: [subscriptions]
      summary: 구독 생성
      responses:
        '201': { description: 구독 생성 완료 }

  # ── CRM 서비스 ──
  /api/v1/crm/customers:
    get:
      tags: [crm]
      summary: 고객사 목록 조회 (테넌트 격리)
      responses:
        '200': { description: 고객사 목록 }
    post:
      tags: [crm]
      summary: 고객사 등록
      responses:
        '201': { description: 고객사 등록 완료 }

  /api/v1/crm/pipeline:
    get:
      tags: [crm]
      summary: 영업 파이프라인 조회
      responses:
        '200': { description: 파이프라인 데이터 }

  # ── 알림 서비스 ──
  /api/v1/notifications/send:
    post:
      tags: [notifications]
      summary: 알림 발송
      responses:
        '201': { description: 알림 발송 완료 }

  /api/v1/notifications/user/{userId}:
    get:
      tags: [notifications]
      summary: 사용자 알림 조회
      parameters:
        - name: userId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 알림 목록 }

  # ── 파일 서비스 ──
  /api/v1/files/upload:
    post:
      tags: [files]
      summary: 파일 업로드 (MIME 검증, 실행파일 차단)
      description: AES-256 암호화 저장. 허용 MIME 타입만 업로드 가능.
      responses:
        '201': { description: 업로드 완료 }

  /api/v1/files/{id}:
    get:
      tags: [files]
      summary: 파일 다운로드 (테넌트 격리)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 파일 데이터 }
    delete:
      tags: [files]
      summary: 파일 삭제
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 삭제 완료 }

  # ── 준수 현황 서비스 ──
  /api/v1/compliance/csap:
    get:
      tags: [compliance]
      summary: CSAP 79항목 준수율 조회
      responses:
        '200': { description: CSAP 준수 현황 }

  /api/v1/compliance/n2sf:
    get:
      tags: [compliance]
      summary: N2SF 6영역 현황 조회
      responses:
        '200': { description: N2SF 준수 현황 }

  /api/v1/compliance/readiness:
    get:
      tags: [compliance]
      summary: 감리 준비도 점수 계산
      responses:
        '200': { description: 감리 준비도 }

  # ── 보안 모니터링 서비스 ──
  /api/v1/security/login-failures:
    get:
      tags: [security]
      summary: 로그인 실패 패턴 탐지
      responses:
        '200': { description: 의심 IP 목록 }

  /api/v1/security/anomalies:
    get:
      tags: [security]
      summary: 이상 접근 패턴 탐지
      responses:
        '200': { description: 이상 탐지 결과 }

  /api/v1/security/ip-blocklist:
    get:
      tags: [security]
      summary: IP 차단 목록 조회
      responses:
        '200': { description: 차단 IP 목록 }
    post:
      tags: [security]
      summary: IP 차단 등록
      responses:
        '201': { description: 차단 등록 완료 }

  # ── 플러그인 ──
  /api/v1/plugins/{pluginId}/{path}:
    all:
      tags: [plugins]
      summary: 비즈니스 플러그인 프록시
      description: 동적 등록된 플러그인으로 요청 전달. 인증 + RBAC 검사 포함.
      parameters:
        - name: pluginId
          in: path
          required: true
          schema: { type: string }
        - name: path
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: 플러그인 응답 }
        '404': { description: 플러그인 미등록 }

  # ── 게이트웨이 ──
  /health:
    get:
      tags: [gateway]
      security: []
      summary: API 게이트웨이 헬스체크
      responses:
        '200': { description: 정상 }

  /health/services:
    get:
      tags: [gateway]
      security: []
      summary: 다운스트림 서비스 헬스 확인
      responses:
        '200': { description: 전체 정상 }
        '207': { description: 일부 서비스 비정상 }
