# SonarQube 프로젝트 설정
# Design Ref: DS-N105.4
# Plan SC: FR-N105.4

sonar.projectKey=ai-saas
sonar.projectName=공공기관 SaaS 프레임워크
sonar.projectVersion=2.0.0

# 소스 디렉토리
sonar.sources=src,packages
sonar.tests=tests

# 제외 패턴 (Dead Code 정책 예외 목록 연동)
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/build/**,\
  **/coverage/**,\
  **/generated/**,\
  **/vendor/**,\
  **/*.min.js,\
  **/*.d.ts,\
  **/migrations/**

# 테스트 제외
sonar.test.exclusions=\
  **/tests/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  **/fixtures/**,\
  **/mocks/**

# TypeScript/JavaScript 설정
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# 인코딩
sonar.sourceEncoding=UTF-8

# 신규 코드 기준 (이전 버전 대비)
sonar.newCode.referenceBranch=main

# 품질 프로파일
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
