# Production 리소스 제한 강화 패치
# CSAP D-08: 자원 접근 통제
apiVersion: v1
kind: LimitRange
metadata:
  name: production-limits
  namespace: saas-production
spec:
  limits:
    - default:
        cpu: "500m"
        memory: "512Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      max:
        cpu: "2"
        memory: "2Gi"
      type: Container
