# =============================================================================
# Production 환경 Kustomize Overlay
# Design Ref: MTU-N41 Design S3
# Plan SC: FR-N41.2
# N2SF 등급: S/C (비밀/기밀) -- 전체 보안 정책 enforce
# CSAP: 전 항목 적용
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: saas-production

resources:
  - ../../base

patches:
  - path: patches/namespace-override.yaml
  - path: patches/resource-limits.yaml

commonLabels:
  environment: production
  n2sf.security/grade: "S"

# Production 이미지 태그 (릴리스 태그만 사용)
images:
  - name: localhost:8080/public-saas/api-gateway
    newTag: v1.0.0
  - name: localhost:8080/public-saas/auth-service
    newTag: v1.0.0
  - name: localhost:8080/public-saas/user-service
    newTag: v1.0.0
  - name: localhost:8080/public-saas/tenant-service
    newTag: v1.0.0
