# =============================================================================
# Base Kustomization -- 모든 환경 공통 매니페스트
# Design Ref: MTU-N41 Design S3
# Plan SC: FR-N41.1
# =============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml

# 공통 레이블
commonLabels:
  app.kubernetes.io/part-of: saas-platform
  app.kubernetes.io/managed-by: flux

# 공통 어노테이션
commonAnnotations:
  csap.compliance/framework: "CSAP-D12"
  n2sf.security/managed: "true"
