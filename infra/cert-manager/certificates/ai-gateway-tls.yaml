# ai-gateway TLS Certificate
# Design Ref: MTU-N62.design.md §3
# Plan SC: FR-N62.4
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ai-gateway-tls
  namespace: saas
  labels:
    app.kubernetes.io/part-of: saas-platform
    app.kubernetes.io/component: ai-gateway
spec:
  secretName: ai-gateway-tls-secret
  duration: 2160h
  renewBefore: 720h
  commonName: ai-gateway.saas.svc.cluster.local
  dnsNames:
    - ai-gateway
    - ai-gateway.saas
    - ai-gateway.saas.svc
    - ai-gateway.saas.svc.cluster.local
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: saas-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
