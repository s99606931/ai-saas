# audit-service TLS Certificate
# Design Ref: MTU-N62.design.md §3
# Plan SC: FR-N62.4
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: audit-service-tls
  namespace: saas
  labels:
    app.kubernetes.io/part-of: saas-platform
    app.kubernetes.io/component: audit-service
spec:
  secretName: audit-service-tls-secret
  duration: 2160h
  renewBefore: 720h
  commonName: audit-service.saas.svc.cluster.local
  dnsNames:
    - audit-service
    - audit-service.saas
    - audit-service.saas.svc
    - audit-service.saas.svc.cluster.local
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: saas-ca-issuer
    kind: ClusterIssuer
    group: cert-manager.io
