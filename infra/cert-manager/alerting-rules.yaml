# cert-manager Prometheus 알림 규칙
# Design Ref: MTU-N62.design.md §4
# Plan SC: FR-N62.5
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cert-manager-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: saas-platform
spec:
  groups:
    - name: cert-manager.rules
      rules:
        # 인증서 만료 30일 이내 경고
        - alert: CertManagerCertExpiringSoon
          expr: |
            certmanager_certificate_expiration_timestamp_seconds - time() < 30 * 24 * 3600
            and
            certmanager_certificate_expiration_timestamp_seconds - time() > 0
          for: 1h
          labels:
            severity: warning
            team: infra
            csap: D-09
          annotations:
            summary: "인증서 만료 임박: {{ $labels.name }}"
            description: |
              인증서 {{ $labels.name }} (네임스페이스: {{ $labels.namespace }})이
              {{ $value | humanizeDuration }} 후 만료됩니다.
            runbook_url: "https://docs.saas.local/runbook/cert-expiry"

        # 인증서 만료 7일 이내 긴급
        - alert: CertManagerCertExpiringCritical
          expr: |
            certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 24 * 3600
            and
            certmanager_certificate_expiration_timestamp_seconds - time() > 0
          for: 10m
          labels:
            severity: critical
            team: infra
            csap: D-09
          annotations:
            summary: "인증서 긴급 만료: {{ $labels.name }}"
            description: |
              인증서 {{ $labels.name }}이 {{ $value | humanizeDuration }} 후 만료됩니다.
              즉시 갱신이 필요합니다.

        # Certificate Not Ready 5분 이상
        - alert: CertManagerCertNotReady
          expr: |
            certmanager_certificate_ready_status{condition="True"} == 0
          for: 5m
          labels:
            severity: critical
            team: infra
            csap: D-09
          annotations:
            summary: "인증서 준비 실패: {{ $labels.name }}"
            description: |
              인증서 {{ $labels.name }} ({{ $labels.namespace }})이
              5분 이상 Ready 상태가 아닙니다.

        # cert-manager 컨트롤러 다운
        - alert: CertManagerAbsent
          expr: |
            absent(certmanager_controller_sync_call_count)
          for: 10m
          labels:
            severity: critical
            team: infra
          annotations:
            summary: "cert-manager 컨트롤러 미응답"
            description: "cert-manager 메트릭이 10분 이상 수집되지 않습니다."
