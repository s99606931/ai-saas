# CA ClusterIssuer (서비스 인증서 서명용)
# Design Ref: MTU-N62.design.md §3
# Plan SC: FR-N62.3
#
# Root CA 시크릿을 참조하여 서비스 인증서를 서명합니다.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: saas-ca-issuer
  labels:
    app.kubernetes.io/part-of: saas-platform
    app.kubernetes.io/managed-by: cert-manager
spec:
  ca:
    secretName: saas-root-ca-secret
