# Self-Signed ClusterIssuer (Root CA 발급용)
# Design Ref: MTU-N62.design.md §3
# Plan SC: FR-N62.2
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-issuer
  labels:
    app.kubernetes.io/part-of: saas-platform
    app.kubernetes.io/managed-by: cert-manager
spec:
  selfSigned: {}
---
# Root CA Certificate
# 자체 서명 발급자로 Root CA 인증서 생성
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: saas-root-ca
  namespace: cert-manager
  labels:
    app.kubernetes.io/part-of: saas-platform
spec:
  isCA: true
  commonName: "SaaS Platform Root CA"
  subject:
    organizations:
      - "Public SaaS Framework"
    organizationalUnits:
      - "Infrastructure"
    countries:
      - "KR"
  # 10년 유효
  duration: 87600h  # 10 years
  renewBefore: 8760h  # 1 year before expiry
  secretName: saas-root-ca-secret
  privateKey:
    algorithm: ECDSA
    size: 256  # P-256
  issuerRef:
    name: selfsigned-issuer
    kind: ClusterIssuer
    group: cert-manager.io
