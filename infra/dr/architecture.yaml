# Design Ref: MTU-N87 §아키텍처
# Plan SC: FR-N87.1
# CSAP D-13: 재해복구 아키텍처 설정
apiVersion: v1
kind: ConfigMap
metadata:
  name: dr-architecture-config
  namespace: dr-system
  labels:
    app.kubernetes.io/name: dr-controller
    app.kubernetes.io/component: architecture
    csap.compliance/control: D-13
data:
  dr-config.yaml: |
    # 재해복구 아키텍처 설정
    version: "1.0"
    mode: "active-passive"

    # 목표
    targets:
      rto: "15m"  # Recovery Time Objective
      rpo: "5m"   # Recovery Point Objective
      mtpd: "4h"  # Maximum Tolerable Period of Disruption

    # Primary 클러스터 설정
    primary:
      name: "k3s-primary"
      endpoint: "https://k3s-primary.saas-platform.local:6443"
      health_check:
        url: "https://api-gateway.saas-platform.local/health"
        interval: "30s"
        timeout: "10s"
        failure_threshold: 3
        success_threshold: 1

    # Standby 클러스터 설정
    standby:
      name: "k3s-standby"
      endpoint: "https://k3s-standby.saas-platform.local:6443"
      mode: "warm-standby"  # 최소 서비스 실행
      services:
        always_running:
          - "cloudnative-pg-standby"
          - "velero"
          - "dr-controller"
        on_failover:
          - "api-gateway"
          - "auth-service"
          - "tenant-service"
          - "audit-service"
          - "ai-gateway"

    # 백업 설정 (Velero)
    backup:
      tool: "velero"
      schedule: "*/5 * * * *"  # 5분 주기
      storage:
        type: "s3"
        bucket: "saas-dr-backups"
        endpoint: "http://minio.minio-system.svc:9000"
        region: "us-east-1"
      retention:
        daily: 7
        weekly: 4
        monthly: 3
      encryption:
        enabled: true
        algorithm: "AES-256"
      resources:
        include:
          - "deployments"
          - "services"
          - "configmaps"
          - "secrets"
          - "persistentvolumeclaims"
        exclude:
          - "events"
          - "pods"

    # 데이터베이스 복제
    database:
      tool: "cloudnative-pg"
      mode: "streaming-replication"
      lag_threshold: "5m"  # RPO 기준
      promotion_timeout: "120s"

    # 페일오버 정책
    failover:
      auto_failover: true
      confirmation_required: false  # 자동 실행
      cooldown_period: "30m"        # 재발동 방지
      max_failovers_per_day: 3
      notification:
        channels: ["slack", "email", "sms"]
        escalation:
          - after: "5m"
            notify: "ops-team"
          - after: "15m"
            notify: "management"

    # 페일백 정책
    failback:
      auto_failback: false  # 수동 확인 필수
      verification_steps:
        - "primary_cluster_healthy"
        - "database_sync_complete"
        - "data_integrity_verified"
        - "load_test_passed"

    # DR 테스트
    testing:
      schedule: "0 2 * * 0"  # 매주 일요일 02:00
      type: "table-top"      # 실제 페일오버 아님
      full_test_schedule: "0 2 1 */3 *"  # 분기별 실제 테스트
