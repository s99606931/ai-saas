# Design Ref: MTU-N35 Design -- MinIO 인프라
# Plan SC: FR-N35.4
enabled: true
replicaCount: 1

image:
  repository: minio/minio
  pullPolicy: IfNotPresent
  tag: "latest"

nameOverride: ""
fullnameOverride: "minio"

serviceAccount:
  create: true
  annotations: {}
  name: ""

service:
  type: ClusterIP
  port: 9000

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 256Mi

healthCheck:
  enabled: false

env:
  MINIO_ROOT_USER: minioadmin
