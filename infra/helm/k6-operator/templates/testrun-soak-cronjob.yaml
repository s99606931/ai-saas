# k6 소크 테스트 야간 CronJob
# Design Ref: MTU-N171 §3.5
# Plan SC: FR-PERF.5
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-soak-nightly
  labels:
    app.kubernetes.io/name: k6-perf-regression
    test-type: soak
spec:
  schedule: {{ .Values.testRuns.soak.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: k6-soak
              image: "grafana/k6:latest"
              command:
                - k6
                - run
                - --out
                - experimental-prometheus-rw
                - --tag
                - testType=soak
                - /scripts/soak.js
              env:
                - name: BASE_URL
                  value: "http://api-gateway.default:8080"
                - name: K6_PROMETHEUS_RW_SERVER_URL
                  value: {{ .Values.prometheus.remoteWrite.url | quote }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: {{ .Release.Name }}-k6-scripts
            - name: tmp
              emptyDir:
                sizeLimit: 100Mi
          restartPolicy: OnFailure
