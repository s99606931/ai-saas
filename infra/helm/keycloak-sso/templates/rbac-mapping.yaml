# Keycloak 그룹 → Kubernetes RBAC 매핑
# Design Ref: MTU-N170 §3.5
# Plan SC: FR-SSO.5

---
# 클러스터 관리자 (kc-cluster-admins 그룹)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keycloak-cluster-admins
  labels:
    app.kubernetes.io/name: keycloak-sso
    app.kubernetes.io/managed-by: keycloak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: Group
    name: "kc-cluster-admins"
    apiGroup: rbac.authorization.k8s.io

---
# 운영자 (kc-operators 그룹) - 네임스페이스 수준 관리
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keycloak-operators
  labels:
    app.kubernetes.io/name: keycloak-sso
    app.kubernetes.io/managed-by: keycloak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: Group
    name: "kc-operators"
    apiGroup: rbac.authorization.k8s.io

---
# 개발자 (kc-developers 그룹) - 읽기 + 일부 쓰기
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keycloak-developers
  labels:
    app.kubernetes.io/name: keycloak-sso
    app.kubernetes.io/managed-by: keycloak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: Group
    name: "kc-developers"
    apiGroup: rbac.authorization.k8s.io

---
# 조회자 (kc-viewers 그룹) - 읽기 전용
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: keycloak-viewers
  labels:
    app.kubernetes.io/name: keycloak-sso
    app.kubernetes.io/managed-by: keycloak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - kind: Group
    name: "kc-viewers"
    apiGroup: rbac.authorization.k8s.io
