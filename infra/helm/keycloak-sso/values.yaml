# Keycloak SSO 설정
# Design Ref: MTU-N170 §3.1~3.8
# CSAP D-08: 접근 통제, D-09: 암호화

keycloak:
  enabled: true

  # 복제본 (HA)
  replicaCount: 2

  # 리소스 제한 (k3s 환경 최적화)
  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 500m
      memory: 512Mi

  # 인증 설정
  auth:
    adminUser: admin
    existingSecret: keycloak-admin-secret
    passwordSecretKey: admin-password

  # TLS 설정 (CSAP D-09)
  tls:
    enabled: true
    autoGenerated: false
    existingSecret: keycloak-tls-secret

  # PostgreSQL 연동 (CloudNativePG)
  postgresql:
    enabled: false  # 외부 CloudNativePG 사용
  externalDatabase:
    host: cloudnativepg-keycloak-rw.database.svc
    port: 5432
    database: keycloak
    user: keycloak
    existingSecret: keycloak-db-secret
    existingSecretPasswordKey: password

  # Keycloak 설정
  extraEnvVars:
    - name: KC_FEATURES
      value: "admin-fine-grained-authz,token-exchange"
    - name: KC_METRICS_ENABLED
      value: "true"
    - name: KC_HEALTH_ENABLED
      value: "true"
    - name: KC_LOG_LEVEL
      value: "INFO"
    - name: KC_PROXY
      value: "edge"

  # Pod Security (PSS Restricted)
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false  # Keycloak은 /tmp 쓰기 필요
    capabilities:
      drop:
        - ALL

# SSO Realm 설정
realm:
  name: "public-saas"
  displayName: "공공기관 SaaS 프레임워크"
  sslRequired: "all"
  registrationAllowed: false
  bruteForceProtected: true
  maxFailureWaitSeconds: 900
  failureFactor: 5

# LDAP Federation 설정
ldap:
  enabled: true
  vendor: "ad"
  connectionUrl: "ldaps://ldap.example.go.kr:636"
  bindDnSecret: keycloak-ldap-secret
  usersDn: "ou=users,dc=example,dc=go,dc=kr"
  usernameAttribute: "sAMAccountName"
  fullSyncPeriod: 3600
  changedSyncPeriod: 300

# OIDC Client 설정
clients:
  - clientId: "saas-web"
    name: "SaaS 웹 프론트엔드"
    publicClient: true
    standardFlowEnabled: true
    pkceCodeChallengeMethod: "S256"
    redirectUris:
      - "https://portal.example.go.kr/*"
    webOrigins:
      - "https://portal.example.go.kr"

  - clientId: "saas-api"
    name: "SaaS API 게이트웨이"
    publicClient: false
    serviceAccountsEnabled: true
    existingSecret: keycloak-saas-api-secret

  - clientId: "k8s-auth"
    name: "Kubernetes OIDC 인증"
    publicClient: false
    standardFlowEnabled: true
    existingSecret: keycloak-k8s-auth-secret

# 세션 관리 (CSAP D-08)
session:
  accessTokenLifespan: 900         # 15분
  refreshTokenLifespan: 604800     # 7일
  ssoSessionIdleTimeout: 1800      # 30분
  ssoSessionMaxLifespan: 28800     # 8시간
  maxConcurrentSessions: 3

# 비밀번호 정책 (CSAP D-08)
passwordPolicy: "length(12) and upperCase(1) and lowerCase(1) and digits(1) and specialChars(1) and notUsername and passwordHistory(5)"

# Prometheus 모니터링
serviceMonitor:
  enabled: true
  interval: 30s
  labels:
    release: prometheus

# 네트워크 정책 (CSAP D-08)
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          name: ingress
    - namespaceSelector:
        matchLabels:
          name: monitoring
  egressTo:
    - namespaceSelector:
        matchLabels:
          name: database
      ports:
        - port: 5432
