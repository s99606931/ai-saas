# OpenTelemetry DaemonSet Agent Collector
# Design Ref: MTU-N175 §3.3
# Plan SC: FR-OTEL.3
apiVersion: opentelemetry.io/v1beta1
kind: OpenTelemetryCollector
metadata:
  name: otel-agent
  namespace: {{ .Release.Namespace }}
spec:
  mode: {{ .Values.agent.mode }}
  resources:
    {{- toYaml .Values.agent.resources | nindent 4 }}
  securityContext:
    {{- toYaml .Values.podSecurityContext | nindent 4 }}
  config:
    receivers:
      {{- toYaml .Values.agent.config.receivers | nindent 6 }}
      # Kubernetes 이벤트 수집
      k8s_events:
        auth_type: serviceAccount
      # 호스트 메트릭 수집
      hostmetrics:
        collection_interval: 30s
        scrapers:
          cpu: {}
          memory: {}
          disk: {}
          network: {}

    processors:
      {{- toYaml .Values.agent.config.processors | nindent 6 }}
      # Kubernetes 메타데이터 추가
      k8sattributes:
        auth_type: serviceAccount
        extract:
          metadata:
            - k8s.namespace.name
            - k8s.deployment.name
            - k8s.pod.name
            - k8s.node.name
          labels:
            - tag_name: app
              key: app.kubernetes.io/name
          annotations:
            - tag_name: team
              key: team

    exporters:
      otlp/gateway:
        endpoint: "otel-gateway-collector.{{ .Release.Namespace }}:4317"
        tls:
          insecure: true  # 클러스터 내부 통신

    service:
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, attributes/pii-mask, batch]
          exporters: [otlp/gateway]
        metrics:
          receivers: [otlp, hostmetrics]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [otlp/gateway]
        logs:
          receivers: [otlp, k8s_events]
          processors: [memory_limiter, k8sattributes, attributes/pii-mask, batch]
          exporters: [otlp/gateway]
