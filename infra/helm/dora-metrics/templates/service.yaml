apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-dora-exporter
  labels:
    app.kubernetes.io/name: dora-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    {{- toYaml .Values.service.annotations | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: dora-exporter
    app.kubernetes.io/instance: {{ .Release.Name }}
