# DORA Metrics Exporter 설정
# Design Ref: MTU-N169

replicaCount: 2

image:
  repository: registry.local/ai-saas/dora-exporter
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 9170
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9170"
    prometheus.io/path: "/metrics"

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

# Prometheus ServiceMonitor
serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s
  labels:
    release: prometheus

# Grafana 대시보드 자동 프로비저닝
grafanaDashboard:
  enabled: true
  labels:
    grafana_dashboard: "1"

# 리포트 생성 CronJob
reportCronJob:
  enabled: true
  schedule: "0 9 * * 1"  # 매주 월요일 09:00
  image:
    repository: registry.local/ai-saas/dora-report-gen
    tag: "1.0.0"

# 네트워크 정책 (CSAP D-08)
networkPolicy:
  enabled: true
  ingressFrom:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    - namespaceSelector:
        matchLabels:
          name: gitea

# Pod Security (PSS Restricted)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  fsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
