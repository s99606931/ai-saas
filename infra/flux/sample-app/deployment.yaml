# GitOps 데모 Deployment
# Design Ref: MTU-N24 §5
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-demo
  namespace: gitops-demo
  labels:
    app: nginx-demo
    app.kubernetes.io/managed-by: flux
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-demo
  template:
    metadata:
      labels:
        app: nginx-demo
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
