# Botkube Helm Values — ChatOps 통합
# Design Ref: DS-N116.1
# Plan SC: FR-N116.1
# CSAP: D-06 침해사고 관리, D-08 접근통제
---
# 통신 플랫폼 설정 (환경별 웹훅 URL은 ESO로 관리)
communications:
  default-group:
    # Slack 연동
    slack:
      enabled: true
      channels:
        # 인시던트 채널 — critical/firing만
        incidents:
          name: "saas-incidents"
          notification:
            disabled: false
          bindings:
            sources:
              - k8s-critical-events
              - alertmanager-critical
            executors:
              - kubectl-readonly
        # 운영 채널 — warning + 배포 이벤트
        operations:
          name: "saas-operations"
          notification:
            disabled: false
          bindings:
            sources:
              - k8s-warning-events
              - deployment-events
            executors:
              - kubectl-readonly
              - kubectl-sre
        # 감사 채널 — 보안 이벤트
        audit:
          name: "saas-audit"
          notification:
            disabled: false
          bindings:
            sources:
              - falco-alerts
              - security-events
      # 웹훅 URL은 ESO SecretStore에서 주입 (CSAP D-08)
      token:
        valueFrom:
          secretKeyRef:
            name: botkube-slack-token
            key: token

    # Teams 연동 (대체 채널)
    teams:
      enabled: false
      # 필요 시 활성화

    # 웹훅 연동 (범용)
    webhook:
      enabled: true
      url:
        valueFrom:
          secretKeyRef:
            name: botkube-webhook-url
            key: url

# 소스 정의 — 이벤트 수집
sources:
  k8s-critical-events:
    botkube/kubernetes:
      enabled: true
      namespaces:
        include:
          - saas-system
          - monitoring
      event:
        types:
          - error
      resources:
        - type: pod
          namespaces:
            include: ["saas-system"]
          event:
            types: ["error"]
        - type: deployment
          namespaces:
            include: ["saas-system"]
          event:
            types: ["error"]
        - type: node
          event:
            types: ["error"]

  k8s-warning-events:
    botkube/kubernetes:
      enabled: true
      namespaces:
        include:
          - saas-system
      event:
        types:
          - warning
      resources:
        - type: pod
          event:
            types: ["warning"]
        - type: deployment
          event:
            types: ["create", "update", "delete"]

  deployment-events:
    botkube/kubernetes:
      enabled: true
      namespaces:
        include:
          - saas-system
      resources:
        - type: deployment
          event:
            types: ["create", "update"]

  alertmanager-critical:
    botkube/alertmanager:
      enabled: true
      url: http://alertmanager-operated.monitoring:9093
      severity:
        - critical
        - firing

  falco-alerts:
    botkube/kubernetes:
      enabled: true
      namespaces:
        include:
          - falco-system
      resources:
        - type: event
          event:
            types: ["warning", "error"]

  security-events:
    botkube/kubernetes:
      enabled: true
      namespaces:
        include:
          - saas-system
      resources:
        - type: event
          event:
            reason:
              include:
                - "FailedAuth"
                - "Forbidden"
                - "PolicyViolation"

# 실행기 정의 — RBAC 기반 명령 제한
executors:
  # 읽기 전용 (모든 운영자)
  kubectl-readonly:
    botkube/kubectl:
      enabled: true
      commands:
        verbs:
          - get
          - describe
          - logs
          - top
        resources:
          - pods
          - deployments
          - services
          - events
          - nodes
          - ingresses
      defaultNamespace: saas-system
      restrictAccess: true

  # SRE팀 전용 (확장 권한)
  kubectl-sre:
    botkube/kubectl:
      enabled: true
      commands:
        verbs:
          - get
          - describe
          - logs
          - top
          - scale
          - rollout
        resources:
          - pods
          - deployments
          - services
          - replicasets
          - statefulsets
      defaultNamespace: saas-system
      restrictAccess: true

  # 관리자 전용 (비상 시만) — 기본 비활성화
  # kubectl-admin:
  #   botkube/kubectl:
  #     enabled: false  # 비상 시에만 수동 활성화

# 보안 설정
settings:
  clusterName: "saas-k3s"
  configWatcher: true
  # ChatOps 명령 감사 로그 (FR-N116.5)
  audit:
    enabled: true
    logLevel: info

# 리소스 제한
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

# 보안 컨텍스트
securityContext:
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
