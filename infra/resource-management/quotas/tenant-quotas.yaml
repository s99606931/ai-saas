# 테넌트별 ResourceQuota 템플릿
# Design Ref: MTU-N76 §1
# Plan SC: FR-N76.1
# CSAP 매핑: D-08

---
# Small 등급 (소규모 테넌트)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota-small
  labels:
    app.kubernetes.io/component: resource-management
    csap.compliance/control: D-08
    tenant-tier: small
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "20"
    services: "10"
    persistentvolumeclaims: "5"
    configmaps: "20"
    secrets: "15"
    services.loadbalancers: "0"
    services.nodeports: "0"

---
# Medium 등급 (중규모 테넌트)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota-medium
  labels:
    app.kubernetes.io/component: resource-management
    csap.compliance/control: D-08
    tenant-tier: medium
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "40"
    services: "20"
    persistentvolumeclaims: "10"
    configmaps: "40"
    secrets: "30"
    services.loadbalancers: "1"
    services.nodeports: "0"

---
# Large 등급 (대규모 테넌트)
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota-large
  labels:
    app.kubernetes.io/component: resource-management
    csap.compliance/control: D-08
    tenant-tier: large
spec:
  hard:
    requests.cpu: "8"
    requests.memory: 16Gi
    limits.cpu: "16"
    limits.memory: 32Gi
    pods: "80"
    services: "40"
    persistentvolumeclaims: "20"
    configmaps: "80"
    secrets: "60"
    services.loadbalancers: "2"
    services.nodeports: "0"
