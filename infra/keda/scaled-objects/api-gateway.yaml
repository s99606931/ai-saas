# ScaledObject: api-gateway (RPS 기반)
# Design Ref: MTU-N56 Section 3.2
# Plan SC: FR-N56.3, FR-N56.4
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: api-gateway-scaler
  namespace: saas
  labels:
    app: api-gateway
    scaling-strategy: rps-based
spec:
  scaleTargetRef:
    name: api-gateway
  pollingInterval: 10
  cooldownPeriod: 120
  minReplicaCount: 2                # 게이트웨이는 최소 2개 (HA)
  maxReplicaCount: 10
  fallback:
    failureThreshold: 3
    replicas: 3
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
        metricName: api_gateway_rps
        query: sum(rate(http_requests_total{service="api-gateway"}[1m]))
        threshold: "200"
        activationThreshold: "10"
    - type: cpu
      metricType: Utilization
      metadata:
        value: "60"
