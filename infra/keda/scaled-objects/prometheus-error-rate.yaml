# KEDA Prometheus ScaledObject - 에러율 기반 스케일링
# Design Ref: DS-N113.2
# Plan SC: FR-N113.2
# CSAP: D-10 부하 분산, D-06 모니터링
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: auth-service-error-rate
  namespace: saas-system
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/managed-by: keda
    keda.sh/scaler-type: prometheus
    csap.compliance/control: D-10
spec:
  scaleTargetRef:
    name: auth-service
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 2
  maxReplicaCount: 10
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 25
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 30
          policies:
            - type: Percent
              value: 100
              periodSeconds: 30
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring:9090
        query: |
          sum(rate(http_requests_total{service="auth-service",code=~"5.."}[5m]))
          /
          sum(rate(http_requests_total{service="auth-service"}[5m])) * 100
        threshold: "5"
        activationThreshold: "2"
      authenticationRef:
        name: prometheus-trigger-auth
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: tenant-service-latency
  namespace: saas-system
  labels:
    app.kubernetes.io/name: tenant-service
    app.kubernetes.io/managed-by: keda
    keda.sh/scaler-type: prometheus
    csap.compliance/control: D-10
spec:
  scaleTargetRef:
    name: tenant-service
  pollingInterval: 15
  cooldownPeriod: 300
  minReplicaCount: 1
  maxReplicaCount: 5
  advanced:
    restoreToOriginalReplicaCount: true
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 25
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 60
          policies:
            - type: Percent
              value: 50
              periodSeconds: 30
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus-operated.monitoring:9090
        query: |
          histogram_quantile(0.95,
            sum(rate(http_request_duration_seconds_bucket{service="tenant-service"}[5m])) by (le)
          )
        threshold: "2"
        activationThreshold: "1"
      authenticationRef:
        name: prometheus-trigger-auth
