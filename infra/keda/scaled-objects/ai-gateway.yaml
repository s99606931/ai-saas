# ScaledObject: ai-gateway (scale-to-zero 이벤트 기반)
# Design Ref: MTU-N56 Section 3.2
# Plan SC: FR-N56.5
# CSAP: N2SF AI 연동 (비용 최적화)
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ai-gateway-scaler
  namespace: saas
  labels:
    app: ai-gateway
    scaling-strategy: event-driven-zero
spec:
  scaleTargetRef:
    name: ai-gateway
  pollingInterval: 15
  cooldownPeriod: 300               # 5분 대기 후 0으로 축소
  idleReplicaCount: 0               # scale-to-zero 활성화
  minReplicaCount: 0                # 최소 0개 (유휴 시 비용 0)
  maxReplicaCount: 3
  fallback:
    failureThreshold: 5
    replicas: 1
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://kube-prometheus-stack-prometheus.monitoring:9090
        metricName: ai_gateway_rps
        query: sum(rate(http_requests_total{service="ai-gateway"}[5m]))
        threshold: "1"
        activationThreshold: "0.1"  # 0.1 RPS 이상이면 활성화
  advanced:
    restoreToOriginalReplicaCount: false
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
            - type: Percent
              value: 50
              periodSeconds: 60
        scaleUp:
          stabilizationWindowSeconds: 0
          policies:
            - type: Pods
              value: 1
              periodSeconds: 15
