# KEDA HTTPScaledObject - AI Gateway
# Design Ref: DS-N113.1
# Plan SC: FR-N113.1
# CSAP: D-10 부하 분산, N2SF O등급 AI 트래픽
---
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: ai-gateway-http
  namespace: saas-system
  labels:
    app.kubernetes.io/name: ai-gateway
    app.kubernetes.io/part-of: saas-platform
    app.kubernetes.io/managed-by: keda-http-addon
    csap.compliance/control: D-10
    n2sf.data-grade: O
spec:
  hosts:
    - "ai.saas.local"
  targetPendingRequests: 50
  scaleTargetRef:
    name: ai-gateway
    kind: Deployment
    apiVersion: apps/v1
  replicas:
    min: 1
    max: 8
  scalingMetric:
    requestRate:
      targetValue: 20
      granularity: 1s
      window: 1m
  # AI 추론 요청은 긴 처리 시간 → 더 짧은 쿨다운
  scaledownPeriod: 120
