# Design Ref: MTU-N79 §시크릿 관리
# Plan SC: FR-N79.6
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: renovate-gitea-token
  namespace: renovate-system
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/component: secret
    app.kubernetes.io/part-of: saas-platform
    csap.compliance/control: D-09
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-backend
    kind: ClusterSecretStore
  target:
    name: renovate-gitea-token
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: renovate
          app.kubernetes.io/component: secret
  data:
    - secretKey: token
      remoteRef:
        key: gitea-credentials
        property: renovate-api-token
