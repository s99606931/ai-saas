# Design Ref: MTU-N79 §CronJob 매니페스트 설계
# Plan SC: FR-N79.1, FR-N79.6
apiVersion: batch/v1
kind: CronJob
metadata:
  name: renovate-bot
  namespace: renovate-system
  labels:
    app.kubernetes.io/name: renovate
    app.kubernetes.io/component: dependency-updater
    app.kubernetes.io/part-of: saas-platform
    csap.compliance/control: D-12
spec:
  schedule: "0 2 * * *"  # 매일 02:00 UTC (한국 시간 11:00)
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      activeDeadlineSeconds: 3600  # 최대 1시간
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: renovate
            app.kubernetes.io/component: dependency-updater
        spec:
          serviceAccountName: renovate-bot
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: renovate
              image: renovate/renovate:38
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              env:
                - name: RENOVATE_PLATFORM
                  value: "gitea"
                - name: RENOVATE_ENDPOINT
                  valueFrom:
                    configMapKeyRef:
                      name: renovate-config
                      key: gitea-endpoint
                - name: RENOVATE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: renovate-gitea-token
                      key: token
                - name: RENOVATE_GIT_AUTHOR
                  value: "Renovate Bot <renovate@saas-platform.local>"
                - name: RENOVATE_AUTODISCOVER
                  value: "true"
                - name: RENOVATE_AUTODISCOVER_FILTER
                  value: "saas-org/*"
                - name: LOG_LEVEL
                  value: "info"
                - name: RENOVATE_CONFIG_FILE
                  value: "/config/renovate.json5"
              volumeMounts:
                - name: config
                  mountPath: /config
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
                - name: cache
                  mountPath: /home/ubuntu/.cache
              resources:
                requests:
                  cpu: 200m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
          volumes:
            - name: config
              configMap:
                name: renovate-config
            - name: tmp
              emptyDir:
                sizeLimit: 1Gi
            - name: cache
              emptyDir:
                sizeLimit: 2Gi
