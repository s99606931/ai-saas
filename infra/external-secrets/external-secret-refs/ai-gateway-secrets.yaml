# ai-gateway ExternalSecret
# Design Ref: MTU-N66.design.md §1
# Plan SC: FR-N66.3
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ai-gateway-secrets
  namespace: saas
  labels:
    app.kubernetes.io/part-of: saas-platform
    app.kubernetes.io/component: ai-gateway
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-backend
    kind: SecretStore
  target:
    name: ai-gateway-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: LM_STUDIO_URL
      remoteRef:
        key: ai-gateway-master
        property: LM_STUDIO_URL
    - secretKey: AI_API_KEY
      remoteRef:
        key: ai-gateway-master
        property: AI_API_KEY
