# tenant-service ExternalSecret
# Design Ref: MTU-N66.design.md §1
# Plan SC: FR-N66.3
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: tenant-service-secrets
  namespace: saas
  labels:
    app.kubernetes.io/part-of: saas-platform
    app.kubernetes.io/component: tenant-service
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: kubernetes-backend
    kind: SecretStore
  target:
    name: tenant-service-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: tenant-service-master
        property: DATABASE_URL
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: tenant-service-master
        property: ENCRYPTION_KEY
