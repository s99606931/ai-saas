# SealedSecret 템플릿: JWT 시크릿
# Design Ref: MTU-N39 Design S3.3 | Plan SC: FR-N39.3
# CSAP: D-08 (접근 통제 -- 세션 관리), D-09 (암호화)
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: jwt-secret
  namespace: saas-platform
  annotations:
    sealedsecrets.bitnami.com/managed: "true"
    sealedsecrets.bitnami.com/cluster-wide: "false"
spec:
  encryptedData:
    JWT_SECRET: "AgBy3i4OJSWK..."          # 예시
    JWT_REFRESH_SECRET: "AgBy3i4OJSWK..."  # 예시
  template:
    metadata:
      name: jwt-secret
      namespace: saas-platform
      labels:
        app.kubernetes.io/part-of: saas-platform
        app.kubernetes.io/component: auth
    type: Opaque
