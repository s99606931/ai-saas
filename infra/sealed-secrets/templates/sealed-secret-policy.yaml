# =============================================================================
# Kyverno 정책: SealedSecret strict scope 강제
# Design Ref: MTU-N39 Design S3.5
# Plan SC: FR-N39.6
# CSAP: D-09 (암호화), CVE-2026-22728 대응
#
# 모든 SealedSecret은 namespace-scoped(strict)이어야 함
# cluster-wide SealedSecret 생성 차단
# =============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: sealed-secret-strict-scope
  labels:
    app.kubernetes.io/part-of: saas-platform
    app.kubernetes.io/component: security
  annotations:
    # Design Ref: MTU-N39 Design S3.5
    # Plan SC: FR-N39.6
    policies.kyverno.io/title: "SealedSecret Strict Scope 강제"
    policies.kyverno.io/category: "Security"
    policies.kyverno.io/severity: "high"
    policies.kyverno.io/description: >-
      CVE-2026-22728 대응: SealedSecret의 cluster-wide 어노테이션을 차단합니다.
      모든 SealedSecret은 strict scope(namespace 고정)으로만 생성 가능합니다.
spec:
  validationFailureAction: Enforce
  background: true
  rules:
    # 규칙 1: cluster-wide 어노테이션 차단
    - name: deny-cluster-wide-sealed-secret
      match:
        any:
          - resources:
              kinds:
                - SealedSecret
      validate:
        message: >-
          SealedSecret은 strict scope만 허용됩니다 (CVE-2026-22728 대응).
          cluster-wide 어노테이션은 차단됩니다.
          kubeseal --scope strict 를 사용하세요.
        deny:
          conditions:
            any:
              - key: "{{ request.object.metadata.annotations.\"sealedsecrets.bitnami.com/cluster-wide\" || 'false' }}"
                operator: Equals
                value: "true"

    # 규칙 2: namespace 명시 강제
    - name: require-namespace
      match:
        any:
          - resources:
              kinds:
                - SealedSecret
      validate:
        message: "SealedSecret에는 반드시 namespace가 명시되어야 합니다."
        pattern:
          metadata:
            namespace: "?*"
