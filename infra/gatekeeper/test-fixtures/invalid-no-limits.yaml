# 테스트 Fixture: 리소스 제한 누락 (차단 대상)
# Design Ref: MTU-N53 TC-03
apiVersion: v1
kind: Pod
metadata:
  name: test-no-limits-pod
  namespace: default
spec:
  containers:
    - name: no-limits
      image: harbor.local/library/nginx:1.25.4
      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
