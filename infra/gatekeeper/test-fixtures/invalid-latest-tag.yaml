# 테스트 Fixture: latest 태그 (차단 대상)
# Design Ref: MTU-N53 TC-06
apiVersion: v1
kind: Pod
metadata:
  name: test-latest-tag-pod
  namespace: default
spec:
  containers:
    - name: latest-tag
      image: harbor.local/library/nginx:latest
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
