# 테스트 Fixture: 미승인 레지스트리 (차단 대상)
# Design Ref: MTU-N53 TC-04
apiVersion: v1
kind: Pod
metadata:
  name: test-bad-registry-pod
  namespace: default
spec:
  containers:
    - name: bad-registry
      image: evil-registry.io/malicious:v1.0
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi
      securityContext:
        runAsNonRoot: true
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
