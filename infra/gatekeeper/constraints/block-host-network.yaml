# Constraint: hostNetwork/hostPID/hostIPC 차단 (Enforce)
# Design Ref: MTU-N53 Section 3.2.6
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sBlockHostNetwork
metadata:
  name: block-host-network
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet"]
    excludedNamespaces:
      - kube-system
      - gatekeeper-system
      - monitoring     # node-exporter는 hostNetwork 필요
      - falco
