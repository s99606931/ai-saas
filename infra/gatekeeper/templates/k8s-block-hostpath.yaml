# ConstraintTemplate: hostPath 볼륨 마운트 차단
# Design Ref: MTU-N53 Section 3.2.4
# Plan SC: FR-N53.7
# CSAP: D-08 접근 통제
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8sblockhostpath
  annotations:
    description: "hostPath 볼륨 마운트를 차단합니다 (CSAP D-08)"
    csap.compliance/control: "D-08"
spec:
  crd:
    spec:
      names:
        kind: K8sBlockHostPath
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sblockhostpath

        violation[{"msg": msg}] {
          volume := input.review.object.spec.volumes[_]
          volume.hostPath
          msg := sprintf("[CSAP D-08] hostPath 볼륨 마운트 금지: %v (경로: %v)", [volume.name, volume.hostPath.path])
        }
