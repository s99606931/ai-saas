# ConstraintTemplate: 읽기 전용 루트 파일시스템 강제
# Design Ref: MTU-N53 Section 3.2.8
# Plan SC: FR-N53.4 (보안 강화 확장)
# CSAP: D-08 접근 통제
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: k8srequirereadonlyrootfs
  annotations:
    description: "읽기 전용 루트 파일시스템을 강제합니다 (CSAP D-08)"
    csap.compliance/control: "D-08"
spec:
  crd:
    spec:
      names:
        kind: K8sRequireReadOnlyRootFS
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8srequirereadonlyrootfs

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not has_field(container, "securityContext")
          msg := sprintf("[CSAP D-08] securityContext 미설정: %v (readOnlyRootFilesystem 필수)", [container.name])
        }

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          has_field(container, "securityContext")
          not container.securityContext.readOnlyRootFilesystem
          msg := sprintf("[CSAP D-08] readOnlyRootFilesystem=true 필수: %v", [container.name])
        }

        has_field(obj, field) {
          obj[field]
        }
