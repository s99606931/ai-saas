# Design Ref: MTU-N166 Section 1
# Plan SC: FR-N166.1
# CSAP: D-08 접근 통제

apiVersion: v1
kind: ConfigMap
metadata:
  name: tenant-quota-policy
  namespace: public-saas
  labels:
    app.kubernetes.io/part-of: saas-platform
data:
  quota-policy.yaml: |
    version: "1.0"
    description: "테넌트 자원 할당량 자동 조정 정책"

    # 테넌트 등급별 기본 할당량
    tierDefaults:
      basic:
        cpu: "2"
        memory: "4Gi"
        pods: "20"
        services: "10"
        persistentvolumeclaims: "5"
      standard:
        cpu: "8"
        memory: "16Gi"
        pods: "50"
        services: "20"
        persistentvolumeclaims: "10"
      premium:
        cpu: "32"
        memory: "64Gi"
        pods: "100"
        services: "50"
        persistentvolumeclaims: "20"

    # 자동 조정 설정
    autoTune:
      enabled: true
      mode: "recommend"  # recommend | auto
      analysisWindow: "7d"
      percentile: 95
      safetyMargin:
        requests: 1.3
        limits: 2.0
      minQuota:
        cpu: "0.5"
        memory: "512Mi"
      maxQuota:
        cpu: "64"
        memory: "128Gi"

    # Noisy neighbor 탐지
    noisyNeighbor:
      warningThreshold: 0.80    # 할당량 80% 사용
      criticalThreshold: 0.95   # 할당량 95% 사용
      throttleAction: "alert"   # alert | throttle
      evaluationWindow: "5m"
