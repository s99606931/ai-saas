# vCluster TTL 자동 만료 CronJob
# Design Ref: MTU-N73 §3
# Plan SC: FR-N73.4

apiVersion: batch/v1
kind: CronJob
metadata:
  name: vcluster-ttl-cleanup
  namespace: kube-system
  labels:
    app.kubernetes.io/component: pr-preview
    app.kubernetes.io/part-of: saas-framework
spec:
  schedule: "0 */6 * * *"  # 6시간마다 실행
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/component: vcluster-cleanup
        spec:
          serviceAccountName: vcluster-cleanup
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: bitnami/kubectl:1.30
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              command:
                - /bin/sh
                - -c
                - |
                  #!/bin/sh
                  # TTL: 3일 (259200초)
                  TTL_SECONDS=259200
                  NOW=$(date +%s)
                  
                  echo "=== vCluster TTL Cleanup ==="
                  echo "현재 시각: $(date -u)"
                  echo "TTL: ${TTL_SECONDS}초 (3일)"
                  
                  # preview- 접두사 네임스페이스 검색
                  NAMESPACES=$(kubectl get ns -l saas.preview/pr-number -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.metadata.labels.saas\.preview/created-at}{"\n"}{end}')
                  
                  if [ -z "$NAMESPACES" ]; then
                    echo "정리 대상 없음"
                    exit 0
                  fi
                  
                  echo "$NAMESPACES" | while IFS=$'\t' read -r NS CREATED; do
                    if [ -n "$CREATED" ]; then
                      CREATED_TS=$(date -d "$CREATED" +%s 2>/dev/null || echo 0)
                      AGE=$((NOW - CREATED_TS))
                      
                      if [ "$AGE" -gt "$TTL_SECONDS" ]; then
                        echo "삭제: ${NS} (생성: ${CREATED}, 경과: $((AGE/3600))시간)"
                        kubectl delete ns "${NS}" --timeout=60s || true
                      else
                        echo "유지: ${NS} (경과: $((AGE/3600))시간)"
                      fi
                    fi
                  done
                  
                  echo "=== 정리 완료 ==="
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 50m
                  memory: 64Mi

---
# CleanUp용 ServiceAccount + RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vcluster-cleanup
  namespace: kube-system

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vcluster-cleanup
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vcluster-cleanup
subjects:
  - kind: ServiceAccount
    name: vcluster-cleanup
    namespace: kube-system
roleRef:
  kind: ClusterRole
  name: vcluster-cleanup
  apiGroup: rbac.authorization.k8s.io
