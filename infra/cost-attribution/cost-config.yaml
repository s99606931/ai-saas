# Design Ref: MTU-N160 Section 2.1
# Plan SC: FR-N160.6
# CSAP: D-06 침해사고관리 (비용 변동 추적)
#
# 비용 단가 설정 ConfigMap
# 테넌트별 리소스 비용 산정을 위한 기준 단가

apiVersion: v1
kind: ConfigMap
metadata:
  name: cost-attribution-config
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: saas-platform
    app.kubernetes.io/component: finops
data:
  cost-config.yaml: |
    # 비용 귀속 설정 v1.0
    # Design Ref: MTU-N160 Section 2.1

    version: "1.0"
    currency: "KRW"
    description: "테넌트별 인프라 비용 귀속 단가 설정"

    # 리소스별 단가 (시간당)
    pricing:
      cpu:
        unit: "vCore/h"
        pricePerUnit: 50
        description: "CPU 코어 시간당 비용"
      memory:
        unit: "GB/h"
        pricePerUnit: 10
        description: "메모리 GB 시간당 비용"
      storage:
        unit: "GB/month"
        pricePerUnit: 100
        description: "영구 스토리지 월간 비용"
      network:
        unit: "GB"
        pricePerUnit: 50
        description: "크로스존 네트워크 전송 비용"

    # 비용 귀속 규칙
    attribution:
      # 전용 리소스: 100% 해당 테넌트
      dedicated:
        method: "direct"
        ratio: 1.0
      # 공유 플랫폼 서비스
      shared:
        method: "proportional"
        basis: "api_call_count"
        services:
          - "api-gateway"
          - "auth-service"
          - "audit-service"
      # 인프라 오버헤드
      overhead:
        method: "equal_split"
        services:
          - "monitoring"
          - "logging"
          - "linkerd"

    # 비용 임계값 알림
    alertThresholds:
      # 일간 비용 임계값 (KRW)
      daily:
        warning: 50000
        critical: 100000
      # 월간 비용 임계값 (KRW)
      monthly:
        warning: 1000000
        critical: 2000000
      # 전월 대비 증가율 임계값
      growthRate:
        warning: 0.3
        critical: 0.5

    # 보고서 설정
    reporting:
      schedule: "monthly"
      format: "markdown"
      recipients:
        - "finops@saas-platform"
        - "admin@saas-platform"
