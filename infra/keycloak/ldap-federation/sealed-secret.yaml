# Design Ref: MTU-N235 SS4
# Plan SC: FR-LDAP.2 (보안)
# LDAP 서비스 계정 시크릿 템플릿
# 실제 배포 시 kubeseal로 암호화하여 사용
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: keycloak-ldap-credentials
  namespace: keycloak
spec:
  encryptedData:
    LDAP_HOST: "<SEALED_VALUE>"
    LDAP_BIND_DN: "<SEALED_VALUE>"
    LDAP_BIND_PASSWORD: "<SEALED_VALUE>"
    LDAP_USERS_DN: "<SEALED_VALUE>"
    LDAP_GROUPS_DN: "<SEALED_VALUE>"
  template:
    metadata:
      name: keycloak-ldap-credentials
      namespace: keycloak
      labels:
        app.kubernetes.io/name: keycloak
        app.kubernetes.io/component: ldap-federation
