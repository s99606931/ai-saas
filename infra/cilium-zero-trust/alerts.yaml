# Cilium Zero Trust 알림 규칙
# Design Ref: §2.6 | Plan SC: FR-N152.7
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cilium-zero-trust-alerts
  namespace: monitoring
  labels:
    csap.compliance/domain: D-10
spec:
  groups:
    - name: cilium-zero-trust
      interval: 30s
      rules:
        # 정책 위반 트래픽 급증
        - alert: CiliumPolicyDropSpike
          expr: rate(hubble_drop_total[5m]) > 10
          for: 2m
          labels:
            severity: warning
            csap_domain: D-10
          annotations:
            summary: "Cilium 정책 위반 트래픽 급증: {{ $value | humanize }}/s"
            description: "지난 5분간 초당 10건 이상의 트래픽이 정책에 의해 차단되었습니다."

        # L7 인증 실패 빈발
        - alert: CiliumL7AuthFailure
          expr: rate(hubble_http_responses_total{code=~"401|403"}[5m]) > 5
          for: 2m
          labels:
            severity: warning
            csap_domain: D-08
          annotations:
            summary: "L7 인증/권한 거부 빈발: {{ $value | humanize }}/s"

        # DNS 정책 위반
        - alert: CiliumDNSPolicyDrop
          expr: rate(hubble_dns_queries_total{rcode="REFUSED"}[5m]) > 1
          for: 1m
          labels:
            severity: critical
            csap_domain: D-10
          annotations:
            summary: "DNS 정책 위반 감지: {{ $labels.query }}"
            description: "FQDN 이그레스 정책에 의해 DNS 쿼리가 거부되었습니다."

        # Cilium 에이전트 비정상
        - alert: CiliumAgentDown
          expr: up{job="cilium-agent"} == 0
          for: 5m
          labels:
            severity: critical
            csap_domain: D-10
          annotations:
            summary: "Cilium 에이전트 다운: {{ $labels.pod }}"
            description: "Zero Trust 네트워크 정책 적용이 중단될 수 있습니다."

        # 비인가 외부 접근 시도
        - alert: UnauthorizedExternalAccess
          expr: rate(hubble_drop_total{reason="POLICY_DENIED",direction="egress"}[5m]) > 0
          for: 0m
          labels:
            severity: critical
            csap_domain: D-10
            n2sf_domain: N-01
          annotations:
            summary: "비인가 외부 접근 시도 감지"
            description: "이그레스 정책에 의해 외부 접근이 차단되었습니다."
