# Cilium L7 Zero Trust Kustomization
# Design Ref: §2 | Plan SC: FR-N152.1~FR-N152.7
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - default-deny.yaml
  - l7-http-policy.yaml
  - l7-grpc-policy.yaml
  - identity-aware-policy.yaml
  - fqdn-egress.yaml
  - hubble-config.yaml
  - alerts.yaml

commonLabels:
  app.kubernetes.io/part-of: cilium-zero-trust
  csap.compliance/domain: D-10
  n2sf.security/level: zero-trust
