# Design Ref: MTU-N159 Section 3.2
# Plan SC: FR-N159.1
# CSAP: D-08 네트워크 접근 통제
#
# Topology Aware Routing (TAR) 서비스 패치
# 모든 SaaS 플랫폼 서비스에 topology-mode: Auto 어노테이션 적용

---
# === 인증/인가 서비스 ===
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: public-saas
  annotations:
    service.kubernetes.io/topology-mode: Auto
    meta.helm.sh/release-name: saas-platform
  labels:
    app.kubernetes.io/component: auth
    topology-routing.saas.io/enabled: "true"
spec:
  selector:
    app: auth-service
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP

