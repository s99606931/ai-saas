# Pod Security Standards — Restricted 호환 securityContext 템플릿
# Design Ref: MTU-N71 §3
# Plan SC: FR-N71.3
# CSAP 매핑: D-12-03, D-08-01

# ============================================================
# Deployment/StatefulSet 표준 securityContext
# 모든 앱 워크로드는 이 템플릿을 따라야 합니다
# ============================================================

# Pod-level securityContext
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 3000
  fsGroup: 2000
  seccompProfile:
    type: RuntimeDefault

# Container-level securityContext
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# ============================================================
# Helm values.yaml 통합 예시
# ============================================================
# 각 서비스의 values.yaml에 다음을 추가합니다:
#
# podSecurityContext:
#   runAsNonRoot: true
#   runAsUser: 1000
#   runAsGroup: 3000
#   fsGroup: 2000
#   seccompProfile:
#     type: RuntimeDefault
#
# securityContext:
#   allowPrivilegeEscalation: false
#   readOnlyRootFilesystem: true
#   runAsNonRoot: true
#   runAsUser: 1000
#   capabilities:
#     drop:
#       - ALL
#   seccompProfile:
#     type: RuntimeDefault

# ============================================================
# 임시 디렉토리가 필요한 경우 (readOnlyRootFilesystem 호환)
# ============================================================
# volumes:
#   - name: tmp-dir
#     emptyDir: {}
# volumeMounts:
#   - name: tmp-dir
#     mountPath: /tmp
#   - name: tmp-dir
#     mountPath: /app/logs

