# Design Ref: MTU-N81 §SLA 정책
# Plan SC: FR-N81.4
# CSAP D-06: 침해사고 관리
apiVersion: v1
kind: ConfigMap
metadata:
  name: vuln-patch-escalation
  namespace: security-system
  labels:
    app.kubernetes.io/name: vuln-patch
    app.kubernetes.io/component: escalation
    csap.compliance/control: D-06
data:
  escalation-policy.yaml: |
    # CVE 에스컬레이션 정책
    # CSAP D-06 침해사고 관리 준수

    version: "1.0"
    description: "CVE 심각도별 에스컬레이션 정책"

    # 심각도별 SLA 및 에스컬레이션
    severity_levels:
      critical:
        cvss_range: "9.0 - 10.0"
        mttr_target: "4h"
        auto_rebuild: true
        auto_merge: false
        escalation:
          - after: "15m"
            action: "notify_team_lead"
            channel: ["slack", "email", "sms"]
          - after: "1h"
            action: "notify_security_manager"
            channel: ["slack", "email", "sms", "phone"]
          - after: "2h"
            action: "notify_ciso"
            channel: ["email", "phone"]
          - after: "4h"
            action: "incident_declaration"
            severity: "P1"
        response:
          - "즉시 영향 범위 파악"
          - "임시 완화 조치 적용 (WAF 규칙, 네트워크 격리)"
          - "패치 이미지 긴급 빌드"
          - "스테이징 검증 후 프로덕션 배포"

      high:
        cvss_range: "7.0 - 8.9"
        mttr_target: "24h"
        auto_rebuild: true
        auto_merge: false
        escalation:
          - after: "4h"
            action: "notify_team_lead"
            channel: ["slack", "email"]
          - after: "12h"
            action: "notify_security_manager"
            channel: ["slack", "email"]
          - after: "24h"
            action: "escalate_to_management"
        response:
          - "영향 범위 분석"
          - "패치 PR 자동 생성"
          - "24시간 내 리뷰 및 배포"

      medium:
        cvss_range: "4.0 - 6.9"
        mttr_target: "7d"
        auto_rebuild: false
        auto_merge: false
        escalation:
          - after: "3d"
            action: "reminder_notification"
            channel: ["slack"]
          - after: "7d"
            action: "notify_team_lead"
            channel: ["slack", "email"]
        response:
          - "주간 패치 PR에 포함"
          - "1주일 내 리뷰 및 배포"

      low:
        cvss_range: "0.1 - 3.9"
        mttr_target: "30d"
        auto_rebuild: false
        auto_merge: false
        escalation:
          - after: "14d"
            action: "reminder_notification"
            channel: ["slack"]
          - after: "30d"
            action: "notify_team_lead"
        response:
          - "월간 정리 시 처리"
          - "위험 수용 검토 가능"

    # 특수 상황 정책
    special_cases:
      zero_day:
        description: "제로데이 취약점 (공개 익스플로잇 존재)"
        override_sla: true
        mttr_target: "2h"
        actions:
          - "즉시 WAF 규칙 적용"
          - "영향 서비스 네트워크 격리 검토"
          - "긴급 패치 또는 완화 조치"
          - "CSAP 감사 보고"

      supply_chain_attack:
        description: "공급망 공격 (의존성 변조)"
        override_sla: true
        mttr_target: "1h"
        actions:
          - "영향 이미지 즉시 롤백"
          - "오염된 의존성 차단"
          - "전체 재빌드 트리거"
          - "침해 사고 신고 (CSAP D-06)"

    # 감사 추적
    audit:
      log_all_escalations: true
      log_sla_breaches: true
      retention_days: 365
      report_frequency: "weekly"
