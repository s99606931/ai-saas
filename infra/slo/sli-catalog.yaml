  governance:
    reviewCycle: "quarterly"
    changeProcess:
      - "SRE 팀 변경 제안서 작성"
      - "서비스 오너 합의"
      - "PM 승인"
      - "README.md + CRD 동시 업데이트"
      - "변경 이력 기록"
    errorBudgetExhaustion:
      critical: "신규 배포 동결 + 안정성 작업 전환"
      high: "모니터링 강화 + 원인 분석"
      standard: "알림 발송 + 추이 관찰"
