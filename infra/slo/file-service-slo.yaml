# =============================================================================
# File Service SLO 정의 (Sloth CRD 형식)
# Design Ref: MTU-N142 Design SS3.1
# Plan SC: FR-N142.2
#
# 티어: Standard — 가용성 99.5%, 지연 P95 < 2000ms (대용량 파일 포함)
# 적용: kubectl apply -f infra/slo/file-service-slo.yaml
# =============================================================================
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: file-service-slo
  namespace: production
  labels:
    app.kubernetes.io/name: file-service
    app.kubernetes.io/part-of: saas-platform
    team: platform
    tier: standard
spec:
  service: "file-service"
  labels:
    owner: "platform-team"
    tier: "standard"

  slos:
    # =========================================================================
    # SLO 1: 가용성 — 99.5% 성공률
    # =========================================================================
    - name: "availability"
      objective: 99.5
      description: "파일 서비스 HTTP 요청 성공률"
      sli:
        events:
          errorQuery: |
            sum(rate(http_requests_total{job="file-service",code=~"5.."}[{{.window}}]))
          totalQuery: |
            sum(rate(http_requests_total{job="file-service"}[{{.window}}]))
      alerting:
        name: FileServiceAvailabilitySLOBreach
        labels:
          category: "availability"
          severity: "warning"
        annotations:
          summary: "File Service 가용성 SLO 위반"
          description: >
            파일 서비스 가용성이 99.5% SLO 미달입니다.
            파일 업로드/다운로드 기능에 장애가 발생할 수 있습니다.
          runbook: "docs/operations/slo-guide.md"
        pageAlert:
          labels:
            severity: "critical"
        ticketAlert:
          labels:
            severity: "warning"

    # =========================================================================
    # SLO 2: 지연시간 — P95 < 2000ms (대용량 파일 포함)
    # =========================================================================
    - name: "latency"
      objective: 99.0
      description: "파일 서비스 P95 응답시간 2000ms 미만"
      sli:
        events:
          errorQuery: |
            sum(rate(http_request_duration_seconds_bucket{job="file-service",le="2.0"}[{{.window}}]))
            -
            sum(rate(http_request_duration_seconds_count{job="file-service"}[{{.window}}]))
          totalQuery: |
            sum(rate(http_request_duration_seconds_count{job="file-service"}[{{.window}}]))
      alerting:
        name: FileServiceLatencySLOBreach
        labels:
          category: "latency"
          severity: "warning"
        annotations:
          summary: "File Service 지연시간 SLO 위반"
          description: >
            파일 서비스 P95 응답시간이 2000ms를 초과하는 비율이
            SLO 목표(99%)를 미달하고 있습니다.
          runbook: "docs/operations/slo-guide.md"
        pageAlert:
          labels:
            severity: "critical"
        ticketAlert:
          labels:
            severity: "warning"
