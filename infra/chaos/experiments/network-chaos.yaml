# =============================================================================
# 카오스 실험 3+4: Network Chaos (Latency + Loss)
# Design Ref: MTU-N50 Design §카오스 실험 시나리오 #3, #4
# Plan SC: FR-N50.3
#
# 목적: 네트워크 장애 시 서비스 복원력 검증
# =============================================================================

# --- 실험 3: Network Latency 300ms ---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosExperiment
metadata:
  name: network-latency-tenant
  namespace: staging
  labels:
    app.kubernetes.io/part-of: chaos-engineering
    experiment-type: network
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["create", "delete", "get", "list", "patch", "update"]
      - apiGroups: [""]
        resources: ["events"]
        verbs: ["create", "get", "list", "patch", "update"]
    image: "litmuschaos/go-runner:3.0.0"
    imagePullPolicy: Always
    args:
      - -c
      - ./experiments -name pod-network-latency
    command:
      - /bin/bash
    env:
      - name: APP_NAMESPACE
        value: "staging"
      - name: APP_LABEL
        value: "app.kubernetes.io/name=tenant-service"
      - name: TOTAL_CHAOS_DURATION
        value: "60"
      # 300ms 지연
      - name: NETWORK_LATENCY
        value: "300"
      - name: JITTER
        value: "50"
      # 대상 인터페이스
      - name: NETWORK_INTERFACE
        value: "eth0"
    labels:
      name: network-latency-tenant
---
# --- 실험 4: Network Loss 50% ---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosExperiment
metadata:
  name: network-loss-audit
  namespace: staging
  labels:
    app.kubernetes.io/part-of: chaos-engineering
    experiment-type: network
spec:
  definition:
    scope: Namespaced
    permissions:
      - apiGroups: [""]
        resources: ["pods"]
        verbs: ["create", "delete", "get", "list", "patch", "update"]
      - apiGroups: [""]
        resources: ["events"]
        verbs: ["create", "get", "list", "patch", "update"]
    image: "litmuschaos/go-runner:3.0.0"
    imagePullPolicy: Always
    args:
      - -c
      - ./experiments -name pod-network-loss
    command:
      - /bin/bash
    env:
      - name: APP_NAMESPACE
        value: "staging"
      - name: APP_LABEL
        value: "app.kubernetes.io/name=audit-service"
      - name: TOTAL_CHAOS_DURATION
        value: "60"
      # 50% 패킷 손실
      - name: NETWORK_PACKET_LOSS_PERCENTAGE
        value: "50"
      - name: NETWORK_INTERFACE
        value: "eth0"
    labels:
      name: network-loss-audit
---
# --- ChaosEngine: Network Latency ---
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: network-latency-engine
  namespace: staging
spec:
  engineState: "active"
  appinfo:
    appns: "staging"
    applabel: "app.kubernetes.io/name=tenant-service"
    appkind: "deployment"
  chaosServiceAccount: litmus-admin
  experiments:
    - name: network-latency-tenant
      spec:
        probe:
          - name: "tenant-service-timeout"
            type: "httpProbe"
            httpProbe/inputs:
              url: "http://tenant-service.staging.svc.cluster.local/health"
              method:
                get:
                  criteria: "=="
                  responseCode: "200"
            mode: "Continuous"
            runProperties:
              probeTimeout: 15
              interval: 10
              retry: 5
