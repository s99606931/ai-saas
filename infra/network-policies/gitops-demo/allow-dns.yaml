# NetworkPolicy: DNS 접근 허용 (gitops-demo)
# Design Ref: MTU-N28 Design
# Plan SC: FR-N28.3
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: gitops-demo
  labels:
    policy-type: baseline
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
