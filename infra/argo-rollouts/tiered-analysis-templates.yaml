---
# =============================================================================
# 3. Standard 티어 AnalysisTemplate (관대)
#    대상: menu, catalog, billing, crm, notification, file 서비스
#    에러율 > 2.0%, P95 > 3x 기준, 가용성 < 99.0% → 60초 후 롤백
# =============================================================================
