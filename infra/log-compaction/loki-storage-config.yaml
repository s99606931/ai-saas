# Design Ref: MTU-N163 Section 2
# Plan SC: FR-N163.2
# CSAP: D-06 침해사고관리
#
# Loki 스토리지 계층화 설정

apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-storage-config
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: saas-platform
data:
  loki-storage.yaml: |
    # Loki 스토리지 계층화 설정
    # Design Ref: MTU-N163

    auth_enabled: true

    limits_config:
      enforce_metric_name: false
      reject_old_samples: true
      reject_old_samples_max_age: 168h  # 7일
      max_entries_limit_per_query: 5000
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20

    # 스토리지 스키마
    schema_config:
      configs:
        - from: "2026-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

    # 스토리지 설정
    storage_config:
      filesystem:
        directory: /loki/chunks
      tsdb_shipper:
        active_index_directory: /loki/tsdb-index
        cache_location: /loki/tsdb-cache
        cache_ttl: 24h

    # 압축기 설정
    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      delete_request_store: filesystem

    # 보존 정책 (등급별)
    limits_config:
      retention_period: 30d  # 기본 보존 30일

      # 스트림별 보존 기간 (per-tenant)
      per_tenant_override_config: /etc/loki/overrides.yaml

    # 청크 설정
    chunk_store_config:
      max_look_back_period: 0s

    # 테이블 관리자
    table_manager:
      retention_deletes_enabled: true
      retention_period: 720h  # 30일

  # 테넌트별 보존 기간 오버라이드
  overrides.yaml: |
    overrides:
      # 감사 로그 전용 테넌트
      audit-logs:
        retention_period: 8760h  # 365일
        max_streams_per_user: 10000

      # 보안 로그 전용 테넌트
      security-logs:
        retention_period: 4320h  # 180일
        max_streams_per_user: 5000

      # 운영 로그
      operation-logs:
        retention_period: 720h  # 30일

      # 디버그 로그
      debug-logs:
        retention_period: 168h  # 7일
        max_streams_per_user: 1000
