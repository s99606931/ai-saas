# Design Ref: MTU-N82 §아키텍처
# Plan SC: FR-N82.3
# Grafana Pyroscope 데이터소스 설정
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-pyroscope-datasource
  namespace: monitoring
  labels:
    app.kubernetes.io/name: pyroscope
    app.kubernetes.io/component: grafana-datasource
    app.kubernetes.io/part-of: saas-platform
    grafana_datasource: "1"
data:
  pyroscope-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Pyroscope
        type: grafana-pyroscope-datasource
        uid: pyroscope
        url: http://pyroscope.pyroscope-system.svc.cluster.local:4040
        access: proxy
        isDefault: false
        editable: true
        jsonData:
          # 기본 프로파일 유형
          defaultProfileType: "process_cpu:cpu:nanoseconds:cpu:nanoseconds"
          # 최대 쿼리 기간
          maxQueryLength: "24h"
        version: 1
