---
# LimitRange (기본값 + 최소/최대)
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-limit-range
  namespace: "tenant-TENANT_ID-cicd"
  labels:
    saas.go.kr/tenant-id: "TENANT_ID"
spec:
  limits:
    - type: Container
      default:
        cpu: 200m
        memory: 256Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 4Gi
      min:
        cpu: 50m
        memory: 64Mi
    - type: PersistentVolumeClaim
      max:
        storage: 10Gi
      min:
        storage: 100Mi
