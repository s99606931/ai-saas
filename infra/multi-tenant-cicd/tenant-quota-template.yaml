# 테넌트 CI/CD ResourceQuota 템플릿
# Design Ref: DS-N108.3
# Plan SC: FR-N108.3

# --- Basic 티어 ---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: tenant-quota-basic
  namespace: "tenant-TENANT_ID-cicd"
  labels:
    saas.go.kr/tenant-id: "TENANT_ID"
    saas.go.kr/tier: "basic"
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "10"
    services: "5"
    configmaps: "20"
    secrets: "10"
    persistentvolumeclaims: "3"
    requests.storage: 5Gi
---
