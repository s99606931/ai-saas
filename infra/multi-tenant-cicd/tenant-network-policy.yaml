# 테넌트 CI/CD NetworkPolicy 격리
# Design Ref: DS-N108.4
# Plan SC: FR-N108.4
# CSAP: D-08 접근 통제, N2SF 네트워크 격리

# 기본 정책: 모든 인그레스/이그레스 거부
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-default-deny
  namespace: "tenant-TENANT_ID-cicd"
  labels:
    saas.go.kr/tenant-id: "TENANT_ID"
    saas.go.kr/policy-type: default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# 같은 테넌트 네임스페이스 내 통신 허용
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-allow-same-namespace
  namespace: "tenant-TENANT_ID-cicd"
  labels:
    saas.go.kr/tenant-id: "TENANT_ID"
    saas.go.kr/policy-type: allow-same-ns
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}  # 같은 네임스페이스 내
  egress:
    - to:
        - podSelector: {}  # 같은 네임스페이스 내
---
# DNS 조회 허용 (kube-dns)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-allow-dns
  namespace: "tenant-TENANT_ID-cicd"
  labels:
    saas.go.kr/tenant-id: "TENANT_ID"
    saas.go.kr/policy-type: allow-dns
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Harbor 레지스트리 접근 허용 (이미지 빌드/푸시)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-allow-harbor
  namespace: "tenant-TENANT_ID-cicd"
  labels:
    saas.go.kr/tenant-id: "TENANT_ID"
    saas.go.kr/policy-type: allow-harbor
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: harbor
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
---
# Gitea 접근 허용 (소스코드 체크아웃)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-allow-gitea
  namespace: "tenant-TENANT_ID-cicd"
  labels:
    saas.go.kr/tenant-id: "TENANT_ID"
    saas.go.kr/policy-type: allow-gitea
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: gitea
      ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 22
---
# 모니터링 메트릭 수집 허용 (Prometheus scrape)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-allow-monitoring
  namespace: "tenant-TENANT_ID-cicd"
  labels:
    saas.go.kr/tenant-id: "TENANT_ID"
    saas.go.kr/policy-type: allow-monitoring
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 8080
