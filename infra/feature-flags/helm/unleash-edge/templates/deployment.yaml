# Design Ref: MTU-N234 SS3
# Plan SC: FR-FF.2
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-unleash-edge
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: unleash-edge
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: unleash-edge
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: unleash-edge
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.securityContext.runAsNonRoot }}
        runAsUser: {{ .Values.securityContext.runAsUser }}
        seccompProfile:
          type: {{ .Values.securityContext.seccompProfile.type }}
      containers:
        - name: unleash-edge
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "edge"
            - "--upstream-url={{ .Values.upstream.url }}"
            - "--port={{ .Values.edge.port }}"
          ports:
            - name: http
              containerPort: {{ .Values.edge.port }}
              protocol: TCP
          env:
            - name: TOKENS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.edge.tokenSecret }}
                  key: tokens
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
