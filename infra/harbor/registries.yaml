# k3s 레지스트리 설정 -- Harbor k3s NodePort 연동
# Design Ref: MTU-N28 | Plan SC: FR-N28.10
# CSAP: D-11 (가상화 보안)
#
# 설치 경로: /etc/rancher/k3s/registries.yaml
# 설치 후 k3s 재시작 필요: sudo systemctl restart k3s
#
# Harbor는 cicd 네임스페이스에서 NodePort 30080으로 서비스
# [주의] auth 섹션의 비밀번호는 실제 Harbor 비밀번호로 변경하십시오.

mirrors:
  "localhost:30080":
    endpoint:
      - "http://localhost:30080"
  "harbor.local:30080":
    endpoint:
      - "http://localhost:30080"

configs:
  "localhost:30080":
    auth:
      username: admin
      password: CHANGE_ME_harbor_admin_password
    tls:
      insecure_skip_verify: true
  "harbor.local:30080":
    auth:
      username: admin
      password: CHANGE_ME_harbor_admin_password
    tls:
      insecure_skip_verify: true
