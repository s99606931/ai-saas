# BBR 혼잡 제어 + sysctl 최적화
# Design Ref: MTU-N98 Design §BBR
# Plan SC: FR-N98.2
#
# BBR (Bottleneck Bandwidth and Round-trip propagation time)
# Google 개발, 기존 CUBIC 대비 2700x 높은 처리량, 25x 낮은 지연
#
# 적용: kubectl apply -f bbr-tuning.yaml

apiVersion: v1
kind: ConfigMap
metadata:
  name: cilium-bbr-sysctl
  namespace: kube-system
  labels:
    app.kubernetes.io/part-of: bandwidth-management
    app.kubernetes.io/component: tuning
data:
  # BBR 혼잡 제어 활성화
  sysctl.conf: |
    # TCP BBR 혼잡 제어
    net.core.default_qdisc = fq
    net.ipv4.tcp_congestion_control = bbr

    # 네트워크 버퍼 최적화
    net.core.rmem_max = 16777216
    net.core.wmem_max = 16777216
    net.ipv4.tcp_rmem = 4096 87380 16777216
    net.ipv4.tcp_wmem = 4096 65536 16777216

    # 연결 최적화
    net.core.somaxconn = 32768
    net.core.netdev_max_backlog = 16384
    net.ipv4.tcp_max_syn_backlog = 8096
    net.ipv4.tcp_slow_start_after_idle = 0

    # keepalive 최적화
    net.ipv4.tcp_keepalive_time = 600
    net.ipv4.tcp_keepalive_intvl = 30
    net.ipv4.tcp_keepalive_probes = 10

    # TIME_WAIT 재활용
    net.ipv4.tcp_tw_reuse = 1
    net.ipv4.tcp_fin_timeout = 15

    # 파일 디스크립터 제한
    fs.file-max = 2097152
    fs.inotify.max_user_instances = 8192
    fs.inotify.max_user_watches = 524288

---
# DaemonSet으로 sysctl 적용
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: sysctl-tuner
  namespace: kube-system
  labels:
    app.kubernetes.io/name: sysctl-tuner
    app.kubernetes.io/part-of: bandwidth-management
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sysctl-tuner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sysctl-tuner
    spec:
      hostPID: true
      hostNetwork: true
      initContainers:
        - name: sysctl-apply
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              sysctl -w net.core.default_qdisc=fq
              sysctl -w net.ipv4.tcp_congestion_control=bbr
              sysctl -w net.core.rmem_max=16777216
              sysctl -w net.core.wmem_max=16777216
              sysctl -w net.core.somaxconn=32768
              sysctl -w net.ipv4.tcp_slow_start_after_idle=0
              sysctl -w net.ipv4.tcp_tw_reuse=1
              echo "BBR + sysctl 최적화 적용 완료"
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.9
          resources:
            requests:
              cpu: 1m
              memory: 4Mi
            limits:
              cpu: 10m
              memory: 16Mi
      tolerations:
        - operator: Exists
