---
apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: audit-service
  namespace: saas-production
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: audit-service
  provider: traefik
  progressDeadlineSeconds: 600
  service:
    port: 3003
    targetPort: http
  analysis:
    interval: 30s
    threshold: 3
    maxWeight: 60
    stepWeight: 20
    metrics:
      - name: request-success-rate
        thresholdRange:
