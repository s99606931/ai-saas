# =============================================================================
# Flagger Canary 리소스 — 핵심 서비스 Progressive Delivery
# Design Ref: MTU-N245 S3.3, MTU-N40 S3.2
# Plan SC: FR-N245.3
# CSAP: D-12 (시스템 개발 보안 — 안전한 배포)
#
# 적용 서비스: auth-service, tenant-service, audit-service
# api-gateway는 별도 canary-api-gateway.yaml에 정의됨
#
# 롤백 기준: 성공률 <99% 또는 p99 지연 >500ms
# 진행: 10% → 30% → 60% → 100%
# =============================================================================

apiVersion: flagger.app/v1beta1
kind: Canary
metadata:
  name: auth-service
  namespace: saas-production
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  # Traefik IngressRoute 연동 (k3s 기본)
  provider: traefik
  progressDeadlineSeconds: 600
  service:
    port: 3001
    targetPort: http
    # Traefik TraefikService 자동 생성
    trafficPolicy:
      tls:
        mode: DISABLE  # 내부 통신은 mTLS (Linkerd/Cilium)
  analysis:
    # Progressive: 10% → 30% → 60% → 100%
    interval: 30s
    threshold: 3
    maxWeight: 60
    stepWeight: 20
    # 메트릭 기반 롤백 판단
    metrics:
      - name: request-success-rate
        thresholdRange:
          min: 99
        interval: 30s
      - name: request-duration
        thresholdRange:
          max: 500
        interval: 30s
    # 웹훅 (선택사항)
    alerts:
      - name: "auth-service-canary"
        severity: error
        providerRef:
          name: slack
          namespace: flagger-system
---
