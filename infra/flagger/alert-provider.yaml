apiVersion: flagger.app/v1beta1
kind: AlertProvider
metadata:
  name: prometheus-alert
  namespace: saas-platform
  labels:
    app.kubernetes.io/part-of: saas-platform
spec:
  type: prometheus
  # Prometheus Alertmanager 주소
  address: http://prometheus-kube-prometheus-alertmanager.monitoring:9093
