# =============================================================================
# 이상 감지 알림 규칙 강화 — Z-score 기반
# Design Ref: MTU-N247 S3.3
# Plan SC: FR-N247.4
# CSAP: D-06 (침해사고 관리 — 이상 감지)
#
# Z-score 기반: (현재값 - 7일 평균) / 7일 표준편차 > 3 → 알림
# =============================================================================

groups:
  - name: anomaly-detection-enhanced
    interval: 1m
    rules:
      # --- CPU 사용량 이상 감지 ---
      - alert: AnomalyCpuUsageHigh
        expr: |
          (
            avg_over_time(container_cpu_usage_seconds_total{namespace=~"saas-.*"}[5m])
            - avg_over_time(container_cpu_usage_seconds_total{namespace=~"saas-.*"}[7d])
          ) / stddev_over_time(container_cpu_usage_seconds_total{namespace=~"saas-.*"}[7d])
          > 3
        for: 5m
        labels:
          severity: warning
          category: anomaly
          csap_ref: D-06
        annotations:
          summary: "CPU 사용량 이상 감지: {{ $labels.pod }}"
          description: |
            Pod {{ $labels.pod }}의 CPU 사용량이 7일 평균 대비 3 표준편차 이상 증가했습니다.
            현재 Z-score: {{ $value | printf "%.2f" }}
            네임스페이스: {{ $labels.namespace }}
          runbook_url: "docs/framework/08-infra/sre-runbooks.md#cpu-anomaly"

      # --- 메모리 사용량 이상 감지 ---
      - alert: AnomalyMemoryUsageHigh
        expr: |
          (
            avg_over_time(container_memory_working_set_bytes{namespace=~"saas-.*"}[5m])
            - avg_over_time(container_memory_working_set_bytes{namespace=~"saas-.*"}[7d])
          ) / stddev_over_time(container_memory_working_set_bytes{namespace=~"saas-.*"}[7d])
          > 3
        for: 5m
        labels:
          severity: warning
          category: anomaly
          csap_ref: D-06
        annotations:
          summary: "메모리 사용량 이상 감지: {{ $labels.pod }}"
          description: |
            Pod {{ $labels.pod }}의 메모리 사용량이 7일 평균 대비 3 표준편차 이상 증가했습니다.
            Z-score: {{ $value | printf "%.2f" }}

      # --- 응답 시간 이상 감지 (P99) ---
      - alert: AnomalyLatencyHigh
        expr: |
          (
            histogram_quantile(0.99, sum by (le, service) (rate(http_server_requests_seconds_bucket{namespace=~"saas-.*"}[5m])))
            - avg_over_time(histogram_quantile(0.99, sum by (le, service) (rate(http_server_requests_seconds_bucket{namespace=~"saas-.*"}[5m])))[7d:1h])
          ) / stddev_over_time(histogram_quantile(0.99, sum by (le, service) (rate(http_server_requests_seconds_bucket{namespace=~"saas-.*"}[5m])))[7d:1h])
          > 3
        for: 5m
        labels:
          severity: warning
          category: anomaly
          csap_ref: D-06
        annotations:
          summary: "응답 시간 이상 감지: {{ $labels.service }}"
          description: |
            서비스 {{ $labels.service }}의 P99 응답 시간이 7일 평균 대비 비정상적으로 증가했습니다.
            Z-score: {{ $value | printf "%.2f" }}

      # --- 에러율 급증 감지 ---
      - alert: AnomalyErrorRateSpike
        expr: |
          (
            sum by (service) (rate(http_server_requests_seconds_count{status=~"5..", namespace=~"saas-.*"}[5m]))
            / sum by (service) (rate(http_server_requests_seconds_count{namespace=~"saas-.*"}[5m]))
          ) > 0.05
        for: 2m
        labels:
          severity: critical
          category: anomaly
          csap_ref: D-06
        annotations:
          summary: "에러율 급증: {{ $labels.service }} ({{ $value | printf \"%.2f\" }}%)"
          description: |
            서비스 {{ $labels.service }}의 에러율이 5%를 초과했습니다.
            즉시 조치가 필요합니다.

      # --- 트래픽 이상 감지 (DDoS 의심) ---
      - alert: AnomalyTrafficSpike
        expr: |
          (
            sum by (service) (rate(http_server_requests_seconds_count{namespace=~"saas-.*"}[5m]))
            - avg_over_time(sum by (service) (rate(http_server_requests_seconds_count{namespace=~"saas-.*"}[5m]))[7d:1h])
          ) / stddev_over_time(sum by (service) (rate(http_server_requests_seconds_count{namespace=~"saas-.*"}[5m]))[7d:1h])
          > 5
        for: 3m
        labels:
          severity: critical
          category: anomaly
          csap_ref: "D-06,D-08"
        annotations:
          summary: "트래픽 이상 급증: {{ $labels.service }} (Z-score: {{ $value | printf \"%.1f\" }})"
          description: |
            서비스 {{ $labels.service }}의 트래픽이 7일 평균 대비 5 표준편차 이상 증가했습니다.
            DDoS 공격 가능성을 확인하세요.
            CSAP D-08 접근 통제 확인 필요.
