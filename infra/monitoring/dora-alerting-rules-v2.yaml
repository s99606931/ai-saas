# =============================================================================
# DORA Four Keys 알림 규칙 v2
# Design Ref: MTU-N251 Design §3.5
# Plan SC: FR-N251.6
# CSAP: D-06(침해사고 관리)
#
# 적용: kubectl apply -f infra/monitoring/dora-alerting-rules-v2.yaml
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: dora-alerting-rules-v2
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: observability-stack
    app.kubernetes.io/component: dora-four-keys
  annotations:
    csap.ref/d06: "침해사고관리 -- DORA 등급 기반 선제적 경고"
    design.ref: "MTU-N251 Design §3.5"
spec:
  groups:
    # =================================================================
    # 등급 하락 알림
    # =================================================================
    - name: dora:v2:alerts:grade
      rules:
        # 종합 등급 Low(4) 전환
        - alert: DORAOverallGradeLow
          expr: dora:grade:overall >= 4
          for: 1h
          labels:
            severity: critical
            category: devops
            csap_ref: D-06
          annotations:
            summary: "DORA 종합 등급 Low -- DevOps 성숙도 심각"
            description: |
              DORA 종합 등급이 Low(4)입니다.
              배포 빈도, 리드타임, CFR, MTTR 모두 개선 필요합니다.
              대시보드: /d/dora-four-keys
            runbook_url: "https://gitea.local/ai-saas/docs/sre/runbooks/dora-improvement.md"

        # 종합 등급 Medium(3) 전환 경고
        - alert: DORAOverallGradeMedium
          expr: dora:grade:overall == 3
          for: 24h
          labels:
            severity: warning
            category: devops
            csap_ref: D-06
          annotations:
            summary: "DORA 종합 등급 Medium -- 개선 권고"
            description: |
              DORA 종합 등급이 24시간 이상 Medium(3)입니다.
              개선 조치를 검토하십시오.

    # =================================================================
    # 개별 메트릭 알림
    # =================================================================
    - name: dora:v2:alerts:metrics
      rules:
        # 배포 빈도 저하
        - alert: DORADeploymentFrequencyLow
          expr: dora:deployment_frequency:weekly < 1
          for: 24h
          labels:
            severity: warning
            category: devops
          annotations:
            summary: "DORA: 주간 배포 횟수 {{ $value }}회 -- Low 등급"
            description: |
              주간 배포 빈도가 1회 미만입니다.
              CI/CD 파이프라인 상태를 확인하십시오.

        # 변경 실패율 위험 (배포 차단 임계값)
        - alert: DORAChangeFailureRateCritical
          expr: dora:change_failure_rate:ratio > 30
          for: 30m
          labels:
            severity: critical
            category: devops
            csap_ref: D-06
          annotations:
            summary: "DORA: 변경 실패율 {{ $value }}% -- 배포 차단 임계값 초과"
            description: |
              변경 실패율이 30%를 초과했습니다.
              DORA 게이트에 의해 자동 배포가 차단됩니다.
              긴급 롤백 또는 핫픽스 후 재시도하십시오.

        # 변경 실패율 경고
        - alert: DORAChangeFailureRateWarning
          expr: dora:change_failure_rate:ratio > 15 and dora:change_failure_rate:ratio <= 30
          for: 1h
          labels:
            severity: warning
            category: devops
          annotations:
            summary: "DORA: 변경 실패율 {{ $value }}% -- Medium 등급"
            description: |
              변경 실패율이 15~30% 구간입니다.
              테스트 커버리지 및 코드 리뷰 강화를 권고합니다.

        # MTTR 장기화
        - alert: DORAMTTRCritical
          expr: dora:mttr:p1_avg_minutes > 1440
          for: 30m
          labels:
            severity: critical
            category: sre
            csap_ref: D-06
          annotations:
            summary: "DORA: P1 MTTR {{ $value }}분 -- 24시간 초과"
            description: |
              P1 인시던트 평균 복구 시간이 24시간을 초과했습니다.
              인시던트 대응 프로세스를 즉시 개선하십시오.

        # MTTR 경고
        - alert: DORAMTTRWarning
          expr: dora:mttr:avg_minutes > 480
          for: 1h
          labels:
            severity: warning
            category: sre
          annotations:
            summary: "DORA: 평균 MTTR {{ $value }}분 -- 8시간 초과"
            description: |
              평균 인시던트 복구 시간이 8시간을 초과했습니다.
              런북 자동화 및 에스컬레이션 검토를 권고합니다.

        # 리드타임 장기화
        - alert: DORALeadTimeHigh
          expr: dora:lead_time:p90 > 604800
          for: 24h
          labels:
            severity: warning
            category: devops
          annotations:
            summary: "DORA: P90 리드타임 {{ $value }}초 -- 7일 초과"
            description: |
              P90 변경 리드타임이 7일을 초과했습니다.
              파이프라인 병목 및 코드 리뷰 대기 시간을 분석하십시오.

    # =================================================================
    # 데이터 가용성 알림
    # =================================================================
    - name: dora:v2:alerts:data
      rules:
        # DORA 메트릭 수집 중단
        - alert: DORAMetricsCollectionDown
          expr: absent(dora_deployment_total) == 1
          for: 6h
          labels:
            severity: warning
            category: monitoring
          annotations:
            summary: "DORA 메트릭 수집 중단 -- 6시간 이상 데이터 없음"
            description: |
              dora_deployment_total 메트릭이 6시간 이상 수집되지 않았습니다.
              CI/CD 파이프라인의 DORA 이벤트 Push를 확인하십시오.
