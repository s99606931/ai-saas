# =============================================================================
# Prometheus 자체 성능 — Alert Rules
# Design Ref: MTU-N231 §1.3, §1.4, §1.6
# Plan SC: FR-N231.3, FR-N231.4, FR-N231.6
# CSAP: D-06(모니터링 시스템 장애 탐지 — 전체 알림 체계 보호)
# =============================================================================
groups:
  # =========================================================================
  # 스크랩 성능 알림
  # Design Ref: §1.1
  # =========================================================================
  - name: prometheus-self-scrape-alerts
    rules:
      # 스크랩 성공률 < 95%
      # Plan SC: FR-N231.1
      - alert: PrometheusScrapeLowSuccessRate
        expr: |
          prometheus:scrape:success_ratio < 0.95
        for: 5m
        labels:
          severity: warning
          team: devops
          component: prometheus
        annotations:
          summary: "Prometheus 스크랩 성공률 {{ $value | printf \"%.1f%%\" }}"
          description: "스크랩 성공률이 95% 미만입니다. 대상 서비스 상태 확인 필요."
          csap_ref: "D-06-01"
          runbook: "docs/operations/prometheus-self-runbook.md"

      # 다수 대상 다운 (5개 이상)
      - alert: PrometheusTargetsDown
        expr: |
          prometheus:target:down_count > 5
        for: 5m
        labels:
          severity: warning
          team: devops
          component: prometheus
        annotations:
          summary: "Prometheus 스크랩 대상 {{ $value }}개 다운"
          description: "5개 이상의 스크랩 대상이 응답하지 않습니다."
          csap_ref: "D-06-01"

  # =========================================================================
  # TSDB 성능 알림
  # Design Ref: §1.2
  # =========================================================================
  - name: prometheus-self-tsdb-alerts
    rules:
      # 헤드 시리즈 과다 (카디널리티 폭발 징후)
      # Plan SC: FR-N231.2
      - alert: PrometheusHighCardinality
        expr: |
          prometheus:tsdb:head_series > 500000
        for: 10m
        labels:
          severity: warning
          team: devops
          component: prometheus
        annotations:
          summary: "Prometheus 헤드 시리즈 {{ $value }}개 — 카디널리티 경고"
          description: "헤드 시리즈가 500,000개를 초과. 카디널리티 폭발 가능성. relabel 최적화 필요."
          csap_ref: "D-06-04"

      # WAL 크기 > 500MB
      - alert: PrometheusWALLarge
        expr: |
          prometheus:tsdb:wal_size_mb > 500
        for: 10m
        labels:
          severity: warning
          team: devops
          component: prometheus
        annotations:
          summary: "Prometheus WAL {{ $value | printf \"%.0f\" }}MB — 과대"
          description: "WAL 크기가 500MB를 초과. 디스크 I/O 부하 증가 및 복구 시간 지연 가능."
          csap_ref: "D-06-04"

      # TSDB 압축 지연 > 30초
      - alert: PrometheusTSDBCompactionSlow
        expr: |
          prometheus:tsdb:compaction_duration_avg > 30
        for: 10m
        labels:
          severity: warning
          team: devops
          component: prometheus
        annotations:
          summary: "Prometheus TSDB 압축 {{ $value | printf \"%.1f\" }}초"
          description: "TSDB 블록 압축이 30초를 초과. 디스크 성능 또는 데이터 볼륨 확인."
          csap_ref: "D-06-04"

  # =========================================================================
  # 규칙 평가 성능 알림
  # Design Ref: §1.3
  # =========================================================================
  - name: prometheus-self-rule-alerts
    rules:
      # 규칙 평가 지연 > 10초
      # Plan SC: FR-N231.3
      - alert: PrometheusRuleEvaluationSlow
        expr: |
          prometheus:rule:evaluation_duration_p99 > 10
        for: 5m
        labels:
          severity: warning
          team: devops
          component: prometheus
        annotations:
          summary: "Prometheus 규칙 평가 지연 {{ $value | printf \"%.1f\" }}초"
          description: "규칙 평가 p99 지연이 10초를 초과. 규칙 수 또는 쿼리 복잡도 최적화 필요."
          csap_ref: "D-06-04"

      # 규칙 평가 실패 발생
      - alert: PrometheusRuleFailures
        expr: |
          prometheus:rule:evaluation_failures_rate > 0
        for: 5m
        labels:
          severity: critical
          team: devops
          component: prometheus
        annotations:
          summary: "Prometheus 규칙 평가 실패 발생"
          description: "규칙 평가 실패가 발생하고 있습니다. 알림 규칙이 정상 작동하지 않을 수 있습니다."
          csap_ref: "D-06-01"

  # =========================================================================
  # 리소스 사용량 알림
  # Design Ref: §1.4
  # =========================================================================
  - name: prometheus-self-resource-alerts
    rules:
      # 메모리 > 2GB
      # Plan SC: FR-N231.4
      - alert: PrometheusMemoryHigh
        expr: |
          sum(container_memory_working_set_bytes{container="prometheus"}) / 1024 / 1024 > 2048
        for: 10m
        labels:
          severity: warning
          team: devops
          component: prometheus
        annotations:
          summary: "Prometheus 메모리 {{ $value | printf \"%.0f\" }}MB"
          description: "Prometheus 메모리가 2GB를 초과. OOM 위험. 스크랩 대상 또는 시리즈 수 최적화."
          csap_ref: "D-06-04"

      # Prometheus 서버 미실행
      - alert: PrometheusNotRunning
        expr: |
          absent(up{job="prometheus"} == 1)
        for: 2m
        labels:
          severity: critical
          team: devops
          component: prometheus
        annotations:
          summary: "Prometheus 서버 미실행 — 전체 모니터링 중단"
          description: "Prometheus 서버가 실행되지 않고 있습니다. 전체 메트릭 수집 및 알림이 중단됩니다."
          csap_ref: "D-06-01"

      # 높은 CPU 사용량
      - alert: PrometheusCPUHigh
        expr: |
          sum(rate(container_cpu_usage_seconds_total{container="prometheus"}[5m])) > 1.5
        for: 10m
        labels:
          severity: warning
          team: devops
          component: prometheus
        annotations:
          summary: "Prometheus CPU {{ $value | printf \"%.2f\" }} cores"
          description: "Prometheus CPU 사용량이 1.5 코어를 초과. 스크랩 간격/규칙 최적화 필요."
          csap_ref: "D-06-04"
