# Webhook 호출 성능 알림 규칙
# Design Ref: MTU-N195.design.md §2
# Plan SC: FR-N195.2, FR-N195.4, FR-N195.5
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: webhook-performance-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: saas-platform
    app.kubernetes.io/component: webhook-monitoring
    mtu: N195
spec:
  groups:
    - name: webhook.performance.alerts
      rules:
        # FR-N195.2: Webhook 레이턴시 p99 > 500ms (경고)
        - alert: WebhookLatencyHigh
          expr: |
            webhook_perf:latency_p99 > 0.5
          for: 5m
          labels:
            severity: warning
            team: infra
            csap: D-10
            mtu: N195
          annotations:
            summary: "Webhook 레이턴시 경고: {{ $labels.name }}"
            description: |
              Webhook {{ $labels.name }} ({{ $labels.type }})의
              p99 레이턴시가 {{ $value | printf "%.3f" }}초입니다.
              500ms SLO를 초과했습니다.
            runbook_url: "https://docs.saas.local/runbook/webhook-latency"

        # FR-N195.2: Webhook 레이턴시 p99 > 1s (긴급)
        - alert: WebhookLatencyCritical
          expr: |
            webhook_perf:latency_p99 > 1.0
          for: 5m
          labels:
            severity: critical
            team: infra
            csap: D-10
            mtu: N195
          annotations:
            summary: "Webhook 레이턴시 긴급: {{ $labels.name }}"
            description: |
              Webhook {{ $labels.name }} ({{ $labels.type }})의
              p99 레이턴시가 {{ $value | printf "%.3f" }}초입니다.
              API 서버 응답 지연을 유발할 수 있습니다. 즉시 확인하십시오.
            runbook_url: "https://docs.saas.local/runbook/webhook-latency-critical"

        # FR-N195.4: Webhook 거부율 > 10% (경고)
        - alert: WebhookRejectionRateHigh
          expr: |
            webhook_perf:rejection_rate_5m > 10
          for: 5m
          labels:
            severity: warning
            team: security
            csap: D-08
            mtu: N195
          annotations:
            summary: "Webhook 거부율 경고: {{ $labels.name }}"
            description: |
              Webhook {{ $labels.name }}의 거부율이 {{ $value | printf "%.1f" }}%입니다.
              정상적인 보안 정책 시행인지 또는 오탐인지 확인하십시오.
            runbook_url: "https://docs.saas.local/runbook/webhook-rejection"

        # FR-N195.4: Webhook 거부율 > 30% (긴급 - 보안 정책 오동작 의심)
        - alert: WebhookRejectionSpike
          expr: |
            webhook_perf:rejection_rate_5m > 30
          for: 3m
          labels:
            severity: critical
            team: security
            csap: D-08
            mtu: N195
          annotations:
            summary: "Webhook 거부율 급등: {{ $labels.name }}"
            description: |
              Webhook {{ $labels.name }}의 거부율이 {{ $value | printf "%.1f" }}%로 급등했습니다.
              대규모 배포 차단 또는 보안 정책 오동작 가능성이 있습니다.
            runbook_url: "https://docs.saas.local/runbook/webhook-rejection-spike"

        # FR-N195.5: Webhook 에러율 > 5% (Fail Open 감지)
        - alert: WebhookErrorsDetected
          expr: |
            webhook_perf:error_rate_5m > 5
          for: 5m
          labels:
            severity: critical
            team: infra
            csap: D-10
            mtu: N195
          annotations:
            summary: "Webhook 에러 감지: {{ $labels.name }}"
            description: |
              Webhook {{ $labels.name }}의 에러율이 {{ $value | printf "%.1f" }}%입니다.
              failurePolicy=Ignore 설정 시 보안 정책이 우회될 수 있습니다.
            runbook_url: "https://docs.saas.local/runbook/webhook-errors"

        # 전체 Webhook 평균 레이턴시 상승
        - alert: WebhookOverallLatencyHigh
          expr: |
            avg(webhook_perf:avg_latency) > 0.3
          for: 10m
          labels:
            severity: warning
            team: infra
            mtu: N195
          annotations:
            summary: "전체 Webhook 평균 레이턴시 상승: {{ $value | printf \"%.3f\" }}초"
            description: |
              전체 Admission Webhook 평균 레이턴시가 300ms를 초과했습니다.
              API 서버 전반적인 응답 저하가 발생할 수 있습니다.
