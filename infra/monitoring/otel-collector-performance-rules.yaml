# =============================================================================
# OTel Collector 성능 — Recording Rules
# Design Ref: MTU-N234 §1.1, §1.2, §1.3
# Plan SC: FR-N234.1, FR-N234.2, FR-N234.3
# CSAP: D-06(텔레메트리 파이프라인 무결성)
# =============================================================================
groups:
  - name: otel-collector-receiver
    interval: 15s
    rules:
      # 수신 허용 데이터 포인트/초 (전체)
      # Plan SC: FR-N234.1
      - record: otelcol:receiver:accepted_rate
        expr: |
          sum(rate(otelcol_receiver_accepted_spans_total[5m]))
          + sum(rate(otelcol_receiver_accepted_metric_points_total[5m]))

      # 수신 거부 데이터 포인트/초
      - record: otelcol:receiver:refused_rate
        expr: |
          sum(rate(otelcol_receiver_refused_spans_total[5m]))
          + sum(rate(otelcol_receiver_refused_metric_points_total[5m]))

      # 수신 거부 비율
      - record: otelcol:receiver:refused_ratio
        expr: |
          (
            sum(rate(otelcol_receiver_refused_spans_total[5m])) + sum(rate(otelcol_receiver_refused_metric_points_total[5m]))
          ) / clamp_min(
            sum(rate(otelcol_receiver_accepted_spans_total[5m])) + sum(rate(otelcol_receiver_accepted_metric_points_total[5m]))
            + sum(rate(otelcol_receiver_refused_spans_total[5m])) + sum(rate(otelcol_receiver_refused_metric_points_total[5m])),
            1
          )

  - name: otel-collector-processor
    interval: 15s
    rules:
      # 프로세서 드롭 비율
      # Plan SC: FR-N234.2
      - record: otelcol:processor:dropped_rate
        expr: |
          sum(rate(otelcol_processor_dropped_spans_total[5m]))

      # 배치 전송 크기 평균
      - record: otelcol:processor:batch_send_size_avg
        expr: |
          avg(rate(otelcol_processor_batch_batch_send_size_sum[5m]))
          / clamp_min(avg(rate(otelcol_processor_batch_batch_send_size_count[5m])), 0.001)

  - name: otel-collector-exporter
    interval: 15s
    rules:
      # 내보내기 성공률
      # Plan SC: FR-N234.3
      - record: otelcol:exporter:sent_rate
        expr: |
          sum(rate(otelcol_exporter_sent_spans_total[5m]))
          + sum(rate(otelcol_exporter_sent_metric_points_total[5m]))

      # 내보내기 실패율
      - record: otelcol:exporter:failed_rate
        expr: |
          sum(rate(otelcol_exporter_send_failed_spans_total[5m]))
          + sum(rate(otelcol_exporter_send_failed_metric_points_total[5m]))

      # 내보내기 실패 비율
      - record: otelcol:exporter:failure_ratio
        expr: |
          (
            sum(rate(otelcol_exporter_send_failed_spans_total[5m])) + sum(rate(otelcol_exporter_send_failed_metric_points_total[5m]))
          ) / clamp_min(
            sum(rate(otelcol_exporter_sent_spans_total[5m])) + sum(rate(otelcol_exporter_sent_metric_points_total[5m]))
            + sum(rate(otelcol_exporter_send_failed_spans_total[5m])) + sum(rate(otelcol_exporter_send_failed_metric_points_total[5m])),
            1
          )

      # 큐 크기
      - record: otelcol:exporter:queue_size
        expr: |
          sum(otelcol_exporter_queue_size)
