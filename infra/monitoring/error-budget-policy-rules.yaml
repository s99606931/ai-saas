# =============================================================================
# 에러 버짓 자동 정책 엔진 — Recording Rules + 알림
# Design Ref: MTU-N145 Design SS1~SS3
# Plan SC: FR-N145.2, FR-N145.3
# CSAP: D-06(침해사고 관리 -- 에러 버짓 기반 자동 정책)
#       D-10(부하분산 -- 배포 동결 자동화)
#
# 적용: kubectl apply -f infra/monitoring/error-budget-policy-rules.yaml
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: error-budget-policy-rules
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: observability-stack
  annotations:
    csap.ref/d06: "침해사고관리 -- 에러 버짓 기반 자동 정책"
    csap.ref/d10: "부하분산 -- 배포 동결 자동화"
    design.ref: "MTU-N145 Design SS1~SS3"
spec:
  groups:
    # =========================================================================
    # 그룹 1: 에러 버짓 잔여율 계산
    # =========================================================================
    - name: error_budget:policy:recording
      interval: 1m
      rules:
        # -----------------------------------------------------------------
        # 에러 버짓 잔여율 (0~1, 0=소진, 1=미사용)
        # SLO 에러 비율 대비 실제 에러 비율로 잔여율 계산
        # -----------------------------------------------------------------
        - record: error_budget:remaining:ratio
          expr: |
            clamp_min(
              slo:error_budget:remaining_ratio
              or
              (1 - (
                slo:sli_error:ratio_rate30d
                /
                clamp_min(1 - (slo:objective:ratio or vector(0.999)), 0.0001)
              )),
              0
            )

        # -----------------------------------------------------------------
        # 에러 버짓 정책 단계 (0=GREEN, 1=YELLOW, 2=ORANGE, 3=RED)
        # -----------------------------------------------------------------
        - record: error_budget:policy:level
          expr: |
            (error_budget:remaining:ratio > 0.5) * 0
            +
            (error_budget:remaining:ratio <= 0.5 and error_budget:remaining:ratio > 0.25) * 1
            +
            (error_budget:remaining:ratio <= 0.25 and error_budget:remaining:ratio > 0.1) * 2
            +
            (error_budget:remaining:ratio <= 0.1) * 3
            or vector(0)

        # -----------------------------------------------------------------
        # 에러 버짓 소진 속도 (시간당 소진율)
        # -----------------------------------------------------------------
        - record: error_budget:burn:rate_1h
          expr: |
            deriv(error_budget:remaining:ratio[1h]) * -1
            or vector(0)

        # -----------------------------------------------------------------
        # 에러 버짓 소진 예측 (현재 속도로 완전 소진까지 남은 시간)
        # -----------------------------------------------------------------
        - record: error_budget:exhaustion:hours
          expr: |
            clamp_max(
              error_budget:remaining:ratio
              /
              clamp_min(error_budget:burn:rate_1h, 0.0001),
              720
            )
            or vector(720)

    # =========================================================================
    # 그룹 2: 정책 단계 전환 알림
    # =========================================================================
    - name: error_budget:policy:alerts
      rules:
        # -----------------------------------------------------------------
        # YELLOW 단계 진입 — 에러 버짓 50% 소진
        # -----------------------------------------------------------------
        - alert: ErrorBudgetPolicyYellow
          expr: |
            error_budget:policy:level == 1
          for: 5m
          labels:
            severity: info
            team: sre
            category: error_budget
            policy_level: "YELLOW"
          annotations:
            summary: "에러 버짓 주의 단계 -- {{ $labels.sloth_service }}/{{ $labels.sloth_slo }}"
            description: >
              서비스 {{ $labels.sloth_service }}의 에러 버짓 잔여율이
              50% 미만입니다. 에러 추이를 면밀히 모니터링하십시오.
              예상 소진 시간: {{ $value }}시간.
            policy: "배포 리뷰 강화"
            runbook: "infra/argo-rollouts/rollback-policy.md"

        # -----------------------------------------------------------------
        # ORANGE 단계 진입 — 에러 버짓 75% 소진
        # -----------------------------------------------------------------
        - alert: ErrorBudgetPolicyOrange
          expr: |
            error_budget:policy:level == 2
          for: 5m
          labels:
            severity: warning
            team: sre
            category: error_budget
            policy_level: "ORANGE"
          annotations:
            summary: "에러 버짓 경고 단계 -- {{ $labels.sloth_service }}/{{ $labels.sloth_slo }}"
            description: >
              서비스 {{ $labels.sloth_service }}의 에러 버짓 잔여율이
              25% 미만입니다. 배포 전 승인 절차를 강화하십시오.
              원인 분석을 즉시 시작하십시오.
            policy: "배포 승인 필요"

        # -----------------------------------------------------------------
        # RED 단계 진입 — 에러 버짓 90%+ 소진 (배포 동결)
        # -----------------------------------------------------------------
        - alert: ErrorBudgetPolicyRed
          expr: |
            error_budget:policy:level == 3
          for: 2m
          labels:
            severity: critical
            team: sre
            category: error_budget
            policy_level: "RED"
            csap_domain: "D-06"
          annotations:
            summary: "에러 버짓 동결 단계 -- {{ $labels.sloth_service }}/{{ $labels.sloth_slo }}"
            description: >
              서비스 {{ $labels.sloth_service }}의 에러 버짓이 거의 소진되었습니다.
              Critical 서비스는 신규 배포를 즉시 중단하십시오.
              안정성 복구 작업에 집중하십시오.
              포스트모템을 시작하십시오.
            policy: "Critical 서비스 배포 동결"

        # -----------------------------------------------------------------
        # 에러 버짓 빠른 소진 경고 (4시간 이내 소진 예측)
        # -----------------------------------------------------------------
        - alert: ErrorBudgetRapidExhaustion
          expr: |
            error_budget:exhaustion:hours < 4
            and
            error_budget:remaining:ratio > 0
          for: 5m
          labels:
            severity: critical
            team: sre
            category: error_budget
          annotations:
            summary: "에러 버짓 급속 소진 -- {{ $labels.sloth_service }}"
            description: >
              현재 에러율 추세로 {{ $labels.sloth_service }} 서비스의
              에러 버짓이 약 {{ $value | printf "%.1f" }}시간 내에 소진될 것으로
              예측됩니다. 즉시 원인 파악 및 조치가 필요합니다.

        # -----------------------------------------------------------------
        # 배포 동결 해제 알림 (RED → YELLOW 이하 복귀)
        # -----------------------------------------------------------------
        - alert: ErrorBudgetPolicyRecovered
          expr: |
            error_budget:policy:level <= 1
            and
            (error_budget:policy:level offset 30m) >= 3
          for: 5m
          labels:
            severity: info
            team: sre
            category: error_budget
            policy_level: "RECOVERED"
          annotations:
            summary: "에러 버짓 동결 해제 -- {{ $labels.sloth_service }}"
            description: >
              서비스 {{ $labels.sloth_service }}의 에러 버짓이 회복되어
              배포 동결이 해제되었습니다. 정상 배포를 재개할 수 있습니다.
            policy: "배포 동결 해제"
