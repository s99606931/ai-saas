# =============================================================================
# 관측성 성숙도 자동 평가 Recording Rules + 알림
# Design Ref: MTU-N146 Design SS1~SS2
# Plan SC: FR-N146.1, FR-N146.2, FR-N146.4
# CSAP: D-06(침해사고 관리 -- 관측 체계 완성도 평가)
#
# 적용: kubectl apply -f infra/monitoring/observability-maturity-rules.yaml
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: observability-maturity-rules
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: observability-stack
  annotations:
    csap.ref/d06: "침해사고관리 -- 관측성 성숙도 자동 평가"
    design.ref: "MTU-N146 Design SS1~SS2"
spec:
  groups:
    # =========================================================================
    # 그룹 1: 5대 관측성 축 점수 계산
    # =========================================================================
    - name: observability:maturity:scores
      interval: 5m
      rules:
        # -----------------------------------------------------------------
        # 메트릭 축 점수 (Recording Rules 커버리지 + SLO 커버리지)
        # -----------------------------------------------------------------
        - record: observability:maturity:metrics_score
          expr: |
            clamp_max(
              (
                clamp_max(
                  count(ALERTS{alertname!=""}) or vector(0),
                  50
                ) / 50 * 0.4
                +
                clamp_max(
                  count(up{job=~".*-service|api-gateway|ai-gateway"} == 1) or vector(0),
                  13
                ) / 13 * 0.3
                +
                clamp_max(
                  count(slo:sli_error:ratio_rate5m) or vector(0),
                  13
                ) / 13 * 0.3
              ),
              1
            ) or vector(0.5)
          labels:
            axis: "metrics"
            axis_name: "메트릭"

        # -----------------------------------------------------------------
        # 로깅 축 점수 (Loki 수집 상태)
        # -----------------------------------------------------------------
        - record: observability:maturity:logging_score
          expr: |
            clamp_max(
              (
                (loki_ingester_chunks_stored_total > bool 0) * 0.5
                + clamp_max(
                    sum(rate(loki_distributor_lines_received_total[5m])) or vector(0),
                    1000
                  ) / 1000 * 0.5
              ) or vector(0.5),
              1
            )
          labels:
            axis: "logging"
            axis_name: "로깅"

        # -----------------------------------------------------------------
        # 트레이싱 축 점수 (OTel/Tempo 상태)
        # -----------------------------------------------------------------
        - record: observability:maturity:tracing_score
          expr: |
            clamp_max(
              (
                (up{job=~".*otel.*|.*tempo.*"} > bool 0) * 0.5
                + clamp_max(
                    sum(rate(tempo_distributor_spans_received_total[5m])) or vector(0),
                    100
                  ) / 100 * 0.5
              ) or vector(0.3),
              1
            )
          labels:
            axis: "tracing"
            axis_name: "트레이싱"

        # -----------------------------------------------------------------
        # 알림 축 점수 (알림 규칙 수 + 노이즈 제어)
        # -----------------------------------------------------------------
        - record: observability:maturity:alerting_score
          expr: |
            clamp_max(
              (
                clamp_max(
                  count(ALERTS) or vector(0),
                  100
                ) / 100 * 0.5
                +
                (1 - clamp_max(
                  sum(ALERTS{alertstate="suppressed"}) or vector(0),
                  1
                ) / clamp_min(
                  count(ALERTS) or vector(1),
                  1
                )) * 0.5
              ) or vector(0.5),
              1
            )
          labels:
            axis: "alerting"
            axis_name: "알림"

        # -----------------------------------------------------------------
        # 대시보드 축 점수 (정적 설정 기반)
        # 현재 대시보드 수: 34개 / 목표 30개 = 1.0 이상
        # -----------------------------------------------------------------
        - record: observability:maturity:dashboard_score
          expr: vector(0.9)
          labels:
            axis: "dashboard"
            axis_name: "대시보드"

    # =========================================================================
    # 그룹 2: 종합 성숙도 레벨
    # =========================================================================
    - name: observability:maturity:aggregate
      interval: 5m
      rules:
        # 종합 점수 (5축 평균)
        - record: observability:maturity:total_score
          expr: |
            (
              observability:maturity:metrics_score
              + observability:maturity:logging_score
              + observability:maturity:tracing_score
              + observability:maturity:alerting_score
              + observability:maturity:dashboard_score
            ) / 5
            or vector(0.5)

        # 성숙도 레벨 (1~5)
        - record: observability:maturity:level
          expr: |
            (observability:maturity:total_score <= 0.2) * 1
            + (observability:maturity:total_score > 0.2 and observability:maturity:total_score <= 0.4) * 2
            + (observability:maturity:total_score > 0.4 and observability:maturity:total_score <= 0.6) * 3
            + (observability:maturity:total_score > 0.6 and observability:maturity:total_score <= 0.8) * 4
            + (observability:maturity:total_score > 0.8) * 5
            or vector(3)

    # =========================================================================
    # 그룹 3: 성숙도 하락 알림
    # =========================================================================
    - name: observability:maturity:alerts
      rules:
        # 관측성 성숙도 L3 미만 하락
        - alert: ObservabilityMaturityDegraded
          expr: observability:maturity:level < 3
          for: 30m
          labels:
            severity: warning
            team: sre
            category: observability
          annotations:
            summary: "관측성 성숙도 L3 미만 하락"
            description: >
              관측성 성숙도가 L{{ $value }} 수준으로 하락했습니다.
              관측 체계의 일부 구성요소가 비활성화되었거나
              메트릭 수집에 장애가 있을 수 있습니다.

        # 개별 축 점수 50% 미만
        - alert: ObservabilityAxisBelow50
          expr: |
            observability:maturity:metrics_score < 0.5
            or observability:maturity:logging_score < 0.5
            or observability:maturity:tracing_score < 0.5
            or observability:maturity:alerting_score < 0.5
          for: 15m
          labels:
            severity: warning
            team: sre
            category: observability
          annotations:
            summary: "관측성 축 {{ $labels.axis_name }} 점수 50% 미만"
            description: >
              관측성 {{ $labels.axis_name }} 축의 점수가 50% 미만입니다.
              해당 영역의 구성요소를 점검하십시오.
