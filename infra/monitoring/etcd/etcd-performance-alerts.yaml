# etcd 성능 상세 알림 규칙
# Design Ref: MTU-N201.design.md §2
# Plan SC: FR-N201.3, FR-N201.4
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: etcd-performance-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: saas-platform
    app.kubernetes.io/component: etcd-performance
    mtu: N201
spec:
  groups:
    - name: etcd.performance.alerts
      rules:
        # FR-N201.3: WAL fsync p99 > 100ms
        - alert: EtcdWALFsyncSlow
          expr: |
            etcd_perf:wal_fsync_p99 > 0.1
          for: 5m
          labels:
            severity: warning
            team: infra
            csap: D-10
            mtu: N201
          annotations:
            summary: "etcd WAL fsync 지연: {{ $value | printf \"%.3f\" }}초"
            description: |
              etcd WAL fsync p99 레이턴시가 {{ $value | printf "%.3f" }}초입니다.
              100ms SLO를 초과했습니다. 디스크 I/O 성능을 확인하십시오.
            runbook_url: "https://docs.saas.local/runbook/etcd-wal-fsync"

        # FR-N201.3: Backend commit p99 > 250ms
        - alert: EtcdBackendCommitSlow
          expr: |
            etcd_perf:backend_commit_p99 > 0.25
          for: 5m
          labels:
            severity: critical
            team: infra
            csap: D-10
            mtu: N201
          annotations:
            summary: "etcd Backend commit 지연: {{ $value | printf \"%.3f\" }}초"
            description: |
              etcd Backend commit p99 레이턴시가 {{ $value | printf "%.3f" }}초입니다.
              250ms를 초과하면 클러스터 쓰기 성능에 심각한 영향이 있습니다.
            runbook_url: "https://docs.saas.local/runbook/etcd-backend-commit"

        # FR-N201.4: DB 크기 > 6GB
        - alert: EtcdDBSizeLarge
          expr: |
            etcd_perf:db_size_bytes > 6442450944
          for: 15m
          labels:
            severity: warning
            team: infra
            csap: D-09
            mtu: N201
          annotations:
            summary: "etcd DB 크기 경고: {{ $value | humanize1024 }}B"
            description: |
              etcd DB 크기가 {{ $value | humanize1024 }}B입니다.
              6GB를 초과하면 성능 저하 및 스냅샷 지연이 발생합니다.
              Compaction 및 Defrag를 검토하십시오.
            runbook_url: "https://docs.saas.local/runbook/etcd-db-size"

        # FR-N201.4: DB 크기 급증
        - alert: EtcdDBSizeGrowing
          expr: |
            etcd_perf:db_size_growth_rate_1h > 104857600
          for: 30m
          labels:
            severity: warning
            team: infra
            csap: D-09
            mtu: N201
          annotations:
            summary: "etcd DB 크기 급증: {{ $value | humanize1024 }}B/h"
            description: |
              etcd DB가 시간당 {{ $value | humanize1024 }}B 증가 중입니다.
              비정상적인 키 생성 또는 Compaction 미동작을 확인하십시오.

        # DB 단편화율 > 50%
        - alert: EtcdDBFragmentationHigh
          expr: |
            etcd_perf:db_fragmentation_percent > 50
          for: 30m
          labels:
            severity: warning
            team: infra
            mtu: N201
          annotations:
            summary: "etcd DB 단편화율 경고: {{ $value | printf \"%.1f\" }}%"
            description: |
              etcd DB 단편화율이 {{ $value | printf "%.1f" }}%입니다.
              Defrag 실행을 권장합니다.

        # WAL fsync p99 > 500ms (긴급)
        - alert: EtcdWALFsyncCritical
          expr: |
            etcd_perf:wal_fsync_p99 > 0.5
          for: 3m
          labels:
            severity: critical
            team: infra
            csap: D-10
            mtu: N201
          annotations:
            summary: "etcd WAL fsync 긴급: {{ $value | printf \"%.3f\" }}초"
            description: |
              etcd WAL fsync p99가 500ms를 초과했습니다.
              디스크 장애 가능성이 있습니다. 즉시 조치하십시오.
