# =============================================================================
# VictoriaMetrics Single — 공공기관 SaaS 플랫폼 장기 메트릭 저장소
# Design Ref: MTU-N89 Design §2.1
# Plan SC: FR-N89.1, FR-N89.3, FR-N89.6
# CSAP: D-06(1년 메트릭 보존), D-08(접근통제)
#
# Helm 차트: victoria-metrics-single (vm/victoria-metrics-single)
# 설치:
#   helm repo add vm https://victoriametrics.github.io/helm-charts/
#   helm repo update
#   helm install victoria-metrics vm/victoria-metrics-single \
#     -n monitoring --create-namespace \
#     -f infra/monitoring/victoriametrics/values.yaml
# =============================================================================

# ---------------------------------------------------------------------------
# VictoriaMetrics Server 설정
# ---------------------------------------------------------------------------
server:
  # 이미지 태그 (LTS 안정 버전)
  image:
    repository: victoriametrics/victoria-metrics
    tag: "v1.106.1"
    pullPolicy: IfNotPresent

  # 영구 저장소 구성
  # Design Ref: MTU-N89 Design §2.1
  persistentVolume:
    enabled: true
    size: 50Gi
    storageClass: local-path      # k3s 기본 StorageClass
    accessModes:
      - ReadWriteOnce

  # 리소스 제한 (WSL2 환경 최적화)
  # Design Ref: MTU-N89 Design §2.6
  # Plan SC: FR-N89.6
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

  # 데이터 보존 정책 (12개월 = 365일)
  # Design Ref: MTU-N89 Design §2.3
  # Plan SC: FR-N89.3
  # CSAP D-06: 감사 로그/메트릭 최소 1년 보존
  retentionPeriod: "12"

  # 성능 튜닝 파라미터
  extraArgs:
    # 중복 제거 (Prometheus remote_write 재전송 대비)
    dedup.minScrapeInterval: "15s"
    # 쿼리 제한 (리소스 보호)
    search.maxUniqueTimeseries: "300000"
    search.maxSamplesPerSeries: "30000000"
    search.maxSamplesPerQuery: "1000000000"
    # 레이블 수 제한
    maxLabelsPerTimeseries: "40"
    # 쿼리 캐시 (5분 오프셋)
    search.cacheTimestampOffset: "5m"
    # HTTP 압축 (네트워크 트래픽 절감)
    http.disableResponseCompression: "false"
    # 메모리 제한 (OOM 방지)
    memory.allowedPercent: "80"

  # 서비스 설정
  service:
    type: ClusterIP
    servicePort: 8428

  # Pod 보안 컨텍스트
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

  # 컨테이너 보안 컨텍스트
  containerSecurityContext:
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

  # Liveness/Readiness 프로브
  probe:
    liveness:
      httpGet:
        path: /health
        port: 8428
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      httpGet:
        path: /health
        port: 8428
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3

  # Pod 어노테이션 (Prometheus 자체 메트릭 스크랩)
  podAnnotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8428"
    prometheus.io/path: "/metrics"

  # Node 선택자 (WSL2 단일 노드)
  tolerations: []
  nodeSelector: {}

# ---------------------------------------------------------------------------
# ServiceMonitor (kube-prometheus-stack 연동)
# ---------------------------------------------------------------------------
serviceMonitor:
  enabled: true
  namespace: monitoring
  additionalLabels:
    release: kube-prometheus-stack
  interval: 30s
