# =============================================================================
# Grafana 데이터소스 — VictoriaMetrics (장기 메트릭 저장소)
# Design Ref: MTU-N89 Design §2.4
# Plan SC: FR-N89.4
#
# 이 ConfigMap은 Grafana sidecar가 자동 감지하여 데이터소스를 추가합니다.
# Label: grafana_datasource: "true" 필수
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-victoriametrics-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "true"
    app.kubernetes.io/part-of: observability-stack
  annotations:
    csap.ref/d06: "침해사고관리 — 장기 메트릭 조회를 위한 VictoriaMetrics 데이터소스"
data:
  victoriametrics.yaml: |
    apiVersion: 1
    datasources:
      - name: VictoriaMetrics (장기 저장)
        type: prometheus
        access: proxy
        url: http://victoria-metrics-server.monitoring.svc:8428
        isDefault: false
        jsonData:
          # 쿼리 간격 (recording rules 간격과 동기화)
          timeInterval: "15s"
          # POST 방식 쿼리 (긴 쿼리 URL 방지)
          httpMethod: POST
          # 쿼리 타임아웃
          queryTimeout: "60"
          # Prometheus 유형으로 호환
          prometheusType: VictoriaMetrics
          prometheusVersion: "1.106.1"
        editable: false
