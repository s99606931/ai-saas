# KEDA Autoscaler 성능 알림 규칙
# Design Ref: MTU-N239 §3.5
# Plan SC: FR-N239.6
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: keda-performance-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: kube-prometheus-stack
    monitoring.bkit.io/component: keda
    monitoring.bkit.io/category: alerting
spec:
  groups:
    - name: keda.alerts
      rules:
        # ── 알림 1: ScaledObject 오류 상태 ──
        - alert: KedaScaledObjectError
          expr: |
            keda:scaledobject:error_count > 0
          for: 5m
          labels:
            severity: critical
            team: sre
            component: keda
            category: autoscaling
          annotations:
            summary: "KEDA ScaledObject 오류 상태 감지"
            description: |
              {{ $value | printf "%.0f" }}개의 ScaledObject가 오류 상태입니다.
              자동 스케일링이 정상 작동하지 않아 서비스 부하 대응에 실패할 수 있습니다.
            runbook: "https://docs.bkit.io/runbooks/keda-scaledobject-error"
            impact: "자동 스케일링 실패, 서비스 응답 저하 위험"
            action: |
              1. kubectl get scaledobjects -A 로 오류 상태 확인
              2. kubectl describe scaledobject <name> 으로 원인 분석
              3. 트리거 소스 (메시지 큐, Prometheus 등) 접근성 확인
              4. ScaledObject 설정 검증

        # ── 알림 2: 트리거 지연 경고 ──
        - alert: KedaTriggerLatencyHigh
          expr: |
            keda:trigger:latency:p95 > 10
          for: 5m
          labels:
            severity: warning
            team: sre
            component: keda
            category: autoscaling
          annotations:
            summary: "KEDA 트리거 메트릭 수집 지연 10초 초과"
            description: |
              KEDA 내부 스케일 루프 p95 지연이 {{ $value | printf "%.1f" }}초로
              10초 임계값을 초과하고 있습니다.
              스케일링 반응 속도가 저하되고 있습니다.
            runbook: "https://docs.bkit.io/runbooks/keda-trigger-latency"
            impact: "스케일링 반응 지연, 부하 대응 지연"
            action: |
              1. 트리거 소스 응답 시간 확인
              2. KEDA Operator 리소스 사용량 확인
              3. ScaledObject 수 적정성 검토
              4. pollingInterval 설정 검토

        # ── 알림 3: Operator 재조정 지연 ──
        - alert: KedaOperatorReconcileSlow
          expr: |
            keda:operator:reconcile:duration:p95 > 30
          for: 5m
          labels:
            severity: warning
            team: sre
            component: keda
            category: autoscaling
          annotations:
            summary: "KEDA Operator 재조정 p95 30초 초과"
            description: |
              KEDA Operator 재조정 p95 소요시간이 {{ $value | printf "%.1f" }}초로
              30초 임계값을 초과하고 있습니다.
            runbook: "https://docs.bkit.io/runbooks/keda-reconcile-slow"
            impact: "스케일링 상태 반영 지연"
            action: |
              1. KEDA Operator 로그 확인
              2. 리소스 부족 여부 확인 (CPU/메모리)
              3. 동시 관리 ScaledObject 수 검토

        # ── 알림 4: 비정상 스케일링 빈도 ──
        - alert: KedaScalingEventRateHigh
          expr: |
            keda:scaling:events_per_minute > 20
          for: 10m
          labels:
            severity: warning
            team: sre
            component: keda
            category: autoscaling
          annotations:
            summary: "KEDA 스케일링 이벤트 분당 20회 초과"
            description: |
              KEDA 스케일링 이벤트가 분당 {{ $value | printf "%.0f" }}회로
              비정상적으로 높습니다. 스케일링 진동(thrashing) 가능성이 있습니다.
            runbook: "https://docs.bkit.io/runbooks/keda-scaling-thrashing"
            impact: "스케일링 진동, 리소스 낭비, 서비스 불안정"
            action: |
              1. ScaledObject의 cooldownPeriod 설정 검토
              2. 트리거 메트릭 변동 패턴 분석
              3. minReplicaCount/maxReplicaCount 적정성 검토
              4. stabilizationWindowSeconds 증가 검토

        # ── 알림 5: KEDA Operator 다운 ──
        - alert: KedaOperatorDown
          expr: |
            keda:operator:pods_running < 1
          for: 3m
          labels:
            severity: critical
            team: sre
            component: keda
            category: autoscaling
          annotations:
            summary: "KEDA Operator 파드 비활성"
            description: |
              KEDA Operator 파드가 실행 중이지 않습니다.
              모든 이벤트 기반 자동 스케일링이 중단됩니다.
            runbook: "https://docs.bkit.io/runbooks/keda-operator-down"
            impact: "전체 이벤트 기반 스케일링 중단"
            action: |
              1. kubectl get pods -n keda 로 파드 상태 확인
              2. KEDA Deployment 상태 확인
              3. 노드 리소스 부족 여부 확인
              4. KEDA Helm 릴리스 상태 확인
