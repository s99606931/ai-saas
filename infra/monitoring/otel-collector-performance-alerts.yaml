# =============================================================================
# OTel Collector 성능 — Alert Rules
# Design Ref: MTU-N234 §1.3, §1.4
# Plan SC: FR-N234.3, FR-N234.4, FR-N234.6
# CSAP: D-06(텔레메트리 파이프라인 장애 탐지)
# =============================================================================
groups:
  - name: otel-collector-availability-alerts
    rules:
      # OTel Collector 파드 미실행
      # Plan SC: FR-N234.4
      - alert: OtelCollectorNotRunning
        expr: |
          absent(up{job=~".*otel.*collector.*"} == 1)
        for: 2m
        labels:
          severity: critical
          team: devops
          component: otel-collector
        annotations:
          summary: "OTel Collector 미실행 — 텔레메트리 수집 중단"
          description: "OTel Collector가 실행되지 않고 있습니다. 트레이스/메트릭 수집이 중단됩니다."
          csap_ref: "D-06-01"

      # 내보내기 실패율 > 1%
      # Plan SC: FR-N234.3
      - alert: OtelCollectorExporterFailing
        expr: |
          otelcol:exporter:failure_ratio > 0.01
        for: 5m
        labels:
          severity: critical
          team: devops
          component: otel-collector
        annotations:
          summary: "OTel Collector 내보내기 실패율 {{ $value | printf \"%.1f%%\" }}"
          description: "내보내기 실패율이 1%를 초과. Tempo/Prometheus 연결 상태 확인."
          csap_ref: "D-06-03"

      # 수신 거부율 > 5%
      - alert: OtelCollectorReceiverRefusingHigh
        expr: |
          otelcol:receiver:refused_ratio > 0.05
        for: 5m
        labels:
          severity: warning
          team: devops
          component: otel-collector
        annotations:
          summary: "OTel Collector 수신 거부율 {{ $value | printf \"%.1f%%\" }}"
          description: "수신 거부율이 5%를 초과. 리소스 부족 또는 구성 오류 확인."
          csap_ref: "D-06-03"

      # 프로세서 드롭 발생
      - alert: OtelCollectorDropping
        expr: |
          otelcol:processor:dropped_rate > 0
        for: 5m
        labels:
          severity: warning
          team: devops
          component: otel-collector
        annotations:
          summary: "OTel Collector 프로세서 드롭 {{ $value | printf \"%.1f\" }}/초"
          description: "프로세서에서 스팬이 드롭되고 있습니다. 배치/메모리 설정 확인."
          csap_ref: "D-06-03"

      # 내보내기 큐 포화 (capacity 75%)
      - alert: OtelCollectorQueueNearFull
        expr: |
          otelcol:exporter:queue_size > 750
        for: 5m
        labels:
          severity: warning
          team: devops
          component: otel-collector
        annotations:
          summary: "OTel Collector 큐 {{ $value }}개 — 포화 근접"
          description: "내보내기 큐가 포화 근접. 백엔드 처리 속도 확인."
          csap_ref: "D-06-04"

      # 메모리 > 512MB
      - alert: OtelCollectorMemoryHigh
        expr: |
          sum(container_memory_working_set_bytes{container=~"otel.*collector.*"}) / 1024 / 1024 > 512
        for: 10m
        labels:
          severity: warning
          team: devops
          component: otel-collector
        annotations:
          summary: "OTel Collector 메모리 {{ $value | printf \"%.0f\" }}MB"
          description: "OTel Collector 메모리가 512MB를 초과."
          csap_ref: "D-06-04"
