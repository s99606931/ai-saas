# =============================================================================
# Loki 로그 수집 파이프라인 — Alert Rules
# Design Ref: MTU-N229 §1.2, §1.4, §1.6
# Plan SC: FR-N229.2, FR-N229.4, FR-N229.6
# CSAP: D-06(침해사고 관리 — 로그 파이프라인 장애 탐지)
# =============================================================================
groups:
  # =========================================================================
  # Promtail 수집 에이전트 알림
  # Design Ref: §1.2
  # =========================================================================
  - name: loki-pipeline-promtail-alerts
    rules:
      # Promtail 수집 대상 감소 — 파드 로그 미수집 가능성
      # Plan SC: FR-N229.2
      - alert: PromtailTargetsDown
        expr: |
          sum(promtail_targets_active_total) < 5
        for: 5m
        labels:
          severity: warning
          team: devops
          component: promtail
        annotations:
          summary: "Promtail 수집 대상 감소"
          description: "활성 수집 대상이 5개 미만입니다. 현재 {{ $value }}개. 파드 로그 누락 가능성."
          csap_ref: "D-06-03"
          runbook: "docs/operations/loki-pipeline-runbook.md"

      # Promtail → Loki 전송 지연 p99 > 5초
      - alert: PromtailRequestLatencyHigh
        expr: |
          loki:promtail:request_latency_p99 > 5
        for: 5m
        labels:
          severity: warning
          team: devops
          component: promtail
        annotations:
          summary: "Promtail → Loki 전송 지연 발생"
          description: "Promtail→Loki 전송 p99 지연이 {{ $value | printf \"%.1f\" }}초. 임계값 5초 초과."
          csap_ref: "D-06-03"

      # Promtail 전송 실패율 > 1%
      # Plan SC: FR-N229.2
      - alert: PromtailRequestErrors
        expr: |
          sum(rate(promtail_request_duration_seconds_count{status_code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(promtail_request_duration_seconds_count[5m])), 0.001)
          > 0.01
        for: 5m
        labels:
          severity: critical
          team: devops
          component: promtail
        annotations:
          summary: "Promtail → Loki 전송 실패율 {{ $value | printf \"%.1f%%\" }}"
          description: "Loki 전송 실패율이 1%를 초과했습니다. 로그 누락이 발생 중일 수 있습니다."
          csap_ref: "D-06-03"

      # Promtail 파드 미실행
      - alert: PromtailNotRunning
        expr: |
          absent(up{job=~".*promtail.*"} == 1)
        for: 2m
        labels:
          severity: critical
          team: devops
          component: promtail
        annotations:
          summary: "Promtail 파드 미실행 — 로그 수집 중단"
          description: "Promtail 파드가 실행되지 않고 있습니다. 전체 로그 수집이 중단되었습니다."
          csap_ref: "D-06-01"

  # =========================================================================
  # Loki 수집 파이프라인 알림
  # Design Ref: §1.1, §1.6
  # =========================================================================
  - name: loki-pipeline-ingestion-alerts
    rules:
      # 로그 드롭률 > 0.1%
      # Plan SC: FR-N229.1
      - alert: LokiLogDropRateHigh
        expr: |
          loki:pipeline:drop_ratio > 0.001
        for: 5m
        labels:
          severity: warning
          team: devops
          component: loki
        annotations:
          summary: "Loki 로그 드롭률 {{ $value | printf \"%.2f%%\" }} 초과"
          description: "로그 드롭률이 0.1%를 초과했습니다. 수집 파이프라인 병목 확인 필요."
          csap_ref: "D-06-03"

      # Loki 수집 완전 중단
      - alert: LokiIngestionStopped
        expr: |
          sum(rate(loki_distributor_lines_received_total[5m])) == 0
        for: 5m
        labels:
          severity: critical
          team: devops
          component: loki
        annotations:
          summary: "Loki 로그 수집 완전 중단"
          description: "Loki가 5분간 로그를 수신하지 않고 있습니다. 파이프라인 장애 확인 필요."
          csap_ref: "D-06-01"

      # Loki 파드 미실행
      - alert: LokiNotRunning
        expr: |
          absent(up{job=~".*loki.*"} == 1)
        for: 2m
        labels:
          severity: critical
          team: devops
          component: loki
        annotations:
          summary: "Loki 파드 미실행 — 로그 저장 중단"
          description: "Loki 파드가 실행되지 않고 있습니다. 로그 저장이 중단됩니다."
          csap_ref: "D-06-01"

  # =========================================================================
  # Loki 쿼리 성능 알림
  # Design Ref: §1.4
  # =========================================================================
  - name: loki-pipeline-query-alerts
    rules:
      # 쿼리 p99 지연 > 10초
      # Plan SC: FR-N229.4
      - alert: LokiQuerySlowP99
        expr: |
          loki:query:duration_p99 > 10
        for: 5m
        labels:
          severity: warning
          team: devops
          component: loki
        annotations:
          summary: "Loki 쿼리 지연 p99 {{ $value | printf \"%.1f\" }}초"
          description: "Loki 쿼리 p99 지연이 10초를 초과했습니다. 쿼리 최적화 또는 리소스 확인 필요."
          csap_ref: "D-06-04"

      # 쿼리 재시도 급증 (타임아웃 징후)
      - alert: LokiQueryRetriesHigh
        expr: |
          sum(rate(loki_query_frontend_retries_total[5m])) > 1
        for: 5m
        labels:
          severity: warning
          team: devops
          component: loki
        annotations:
          summary: "Loki 쿼리 재시도 급증"
          description: "Loki 쿼리 재시도가 초당 {{ $value | printf \"%.1f\" }}회 발생. 쿼리 프론트엔드 과부하 가능성."
          csap_ref: "D-06-04"

  # =========================================================================
  # Loki 스토리지 알림
  # Design Ref: §1.3
  # =========================================================================
  - name: loki-pipeline-storage-alerts
    rules:
      # 메모리 내 청크 과다 (메모리 압박 징후)
      # Plan SC: FR-N229.3
      - alert: LokiHighMemoryChunks
        expr: |
          loki:storage:active_chunks > 50000
        for: 10m
        labels:
          severity: warning
          team: devops
          component: loki
        annotations:
          summary: "Loki 메모리 내 청크 {{ $value }}개 — 과다"
          description: "활성 청크가 50,000개를 초과했습니다. 메모리 부족 위험. 플러시 주기 조정 검토."
          csap_ref: "D-06-04"
