# API 서버 요청 레이턴시 알림 규칙
# Design Ref: MTU-N200.design.md §2
# Plan SC: FR-N200.3, FR-N200.4
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: apiserver-latency-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: saas-platform
    app.kubernetes.io/component: apiserver-monitoring
    mtu: N200
spec:
  groups:
    - name: apiserver.latency.alerts
      rules:
        # FR-N200.3: API 서버 레이턴시 p99 > 1s (경고)
        - alert: APIServerLatencyHigh
          expr: |
            apiserver_latency:p99_by_verb{verb!~"WATCH|CONNECT"} > 1.0
          for: 10m
          labels:
            severity: warning
            team: infra
            csap: D-10
            mtu: N200
          annotations:
            summary: "API 서버 레이턴시 경고: {{ $labels.verb }}"
            description: |
              API 서버 {{ $labels.verb }} 요청의 p99 레이턴시가
              {{ $value | printf "%.3f" }}초입니다. 1초 SLO를 초과했습니다.
            runbook_url: "https://docs.saas.local/runbook/apiserver-latency"

        # FR-N200.3: API 서버 레이턴시 p99 > 5s (긴급)
        - alert: APIServerLatencyCritical
          expr: |
            apiserver_latency:p99_by_verb{verb!~"WATCH|CONNECT"} > 5.0
          for: 5m
          labels:
            severity: critical
            team: infra
            csap: D-10
            mtu: N200
          annotations:
            summary: "API 서버 레이턴시 긴급: {{ $labels.verb }}"
            description: |
              API 서버 {{ $labels.verb }} 요청의 p99 레이턴시가
              {{ $value | printf "%.3f" }}초입니다. 클러스터 제어 평면 성능 저하가
              심각합니다. 즉시 확인하십시오.
            runbook_url: "https://docs.saas.local/runbook/apiserver-latency-critical"

        # FR-N200.4: API 서버 에러율 > 5%
        - alert: APIServerErrorRateHigh
          expr: |
            apiserver_latency:error_rate > 5
          for: 5m
          labels:
            severity: critical
            team: infra
            csap: D-10
            mtu: N200
          annotations:
            summary: "API 서버 에러율 경고: {{ $value | printf \"%.1f\" }}%"
            description: |
              API 서버 에러율이 {{ $value | printf "%.1f" }}%입니다.
              5%를 초과하여 클러스터 운영에 영향이 있습니다.
            runbook_url: "https://docs.saas.local/runbook/apiserver-errors"

        # API 서버 요청률 급등 (평균 대비 3배)
        - alert: APIServerRequestRateSpike
          expr: |
            apiserver_latency:request_rate
            >
            3 * avg_over_time(apiserver_latency:request_rate[1h])
          for: 5m
          labels:
            severity: warning
            team: infra
            csap: D-10
            mtu: N200
          annotations:
            summary: "API 서버 요청률 급등: {{ $value | printf \"%.1f\" }} req/s"
            description: |
              API 서버 요청률이 {{ $value | printf "%.1f" }} req/s로
              1시간 평균 대비 3배를 초과했습니다.
              DDoS 또는 잘못된 컨트롤러 루프 가능성이 있습니다.

        # 특정 리소스 레이턴시 이상
        - alert: APIServerResourceLatencyAnomaly
          expr: |
            apiserver_latency:p99_by_resource > 2.0
          for: 10m
          labels:
            severity: warning
            team: infra
            mtu: N200
          annotations:
            summary: "리소스별 레이턴시 이상: {{ $labels.resource }}"
            description: |
              리소스 {{ $labels.resource }}의 p99 레이턴시가
              {{ $value | printf "%.3f" }}초입니다.
              해당 리소스 관련 컨트롤러/Webhook을 점검하십시오.
