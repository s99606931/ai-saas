# Round 22 통합 알림 라우팅 설정
# Design Ref: MTU-N218 S2.3
# Plan SC: FR-N218.3
# CSAP: D-06 감사 모니터링
---
# Alertmanager 라우팅 — Round 22 영역별 분류
route:
  group_by:
    - alertname
    - round22_category
    - severity
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # 컨트롤플레인 (API서버, etcd, CoreDNS) — 최고 우선순위
    - match:
        round22_category: controlplane
      receiver: ops-critical
      group_wait: 10s
      repeat_interval: 1h
      routes:
        - match:
            severity: critical
          receiver: ops-critical-pager
          continue: true

    # 노드 컴포넌트 (Kubelet, Scheduler, Controller Manager) — 높음
    - match:
        round22_category: node
      receiver: ops-high
      group_wait: 15s
      repeat_interval: 2h

    # 리소스 관리 (최적화, GC, 디스크I/O) — 중간
    - match:
        round22_category: resource
      receiver: ops-medium
      group_wait: 30s
      repeat_interval: 4h

    # 안정성 (네트워크, OOM, Init) — 높음 (장애 연관)
    - match:
        round22_category: stability
      receiver: ops-high
      group_wait: 15s
      repeat_interval: 2h
      routes:
        - match:
            severity: critical
          receiver: ops-critical
          continue: true

    # 보안 (이미지풀, SA토큰, Webhook, CRD, 스케줄링, 네임스페이스) — 보안팀
    - match:
        round22_category: security
      receiver: security-team
      group_wait: 20s
      repeat_interval: 3h
      routes:
        - match:
            severity: critical
          receiver: security-critical
          continue: true

# 수신자 목록 (기존 수신자 참조)
receivers:
  - name: ops-critical
    webhook_configs:
      - url: "http://alertmanager-webhook:9095/critical"
        send_resolved: true
  - name: ops-critical-pager
    webhook_configs:
      - url: "http://alertmanager-webhook:9095/pager"
        send_resolved: true
  - name: ops-high
    webhook_configs:
      - url: "http://alertmanager-webhook:9095/high"
        send_resolved: true
  - name: ops-medium
    webhook_configs:
      - url: "http://alertmanager-webhook:9095/medium"
        send_resolved: true
  - name: security-team
    webhook_configs:
      - url: "http://alertmanager-webhook:9095/security"
        send_resolved: true
  - name: security-critical
    webhook_configs:
      - url: "http://alertmanager-webhook:9095/security-critical"
        send_resolved: true

# 억제 규칙 — 중복 알림 방지
inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal:
      - alertname
      - round22_category
  - source_match:
      severity: critical
    target_match:
      severity: info
    equal:
      - alertname
      - round22_category
