# 커스텀 Prometheus 알림 규칙
# Design Ref: MTU-N25 §알림 규칙
# Plan SC: FR-N25.4
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: saas-custom-alerts
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: kube-prometheus-stack
spec:
  groups:
    - name: saas-node-alerts
      rules:
        - alert: HighCPUUsage
          expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
          for: 5m
          labels:
            severity: warning
            team: devops
          annotations:
            summary: "노드 CPU 사용률 80% 초과"
            description: "노드 CPU 사용률이 {{ $value | printf \"%.1f\" }}%입니다. 5분 이상 지속 중."
            csap_ref: "D-06-03"

        - alert: HighMemoryUsage
          expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 > 85
          for: 5m
          labels:
            severity: warning
            team: devops
          annotations:
            summary: "노드 메모리 사용률 85% 초과"
            description: "노드 메모리 사용률이 {{ $value | printf \"%.1f\" }}%입니다."
            csap_ref: "D-06-03"

    - name: saas-pod-alerts
      rules:
        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total[15m]) > 5
          for: 1m
          labels:
            severity: critical
            team: devops
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} CrashLooping"
            description: "15분 내 {{ $value }}회 재시작. 컨테이너: {{ $labels.container }}"
            csap_ref: "D-06-04"

        - alert: PodNotReady
          expr: kube_pod_status_ready{condition="true"} == 0
          for: 5m
          labels:
            severity: warning
            team: devops
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} NotReady"
            description: "Pod가 5분 이상 Ready 상태가 아닙니다."
            csap_ref: "D-06-04"

    # -------------------------------------------------------------------------
    # SQL/DB 알림 — FR-N24.6, CSAP D-12-10
    # G-15/G-16 수정: SlowQueryDetected + HighErrorRate 추가
    # -------------------------------------------------------------------------
    - name: saas-sql-alerts
      rules:
        - alert: SlowQueryDetected
          expr: pg_slow_queries_max_exec_time_seconds > 5
          for: 0m
          labels:
            severity: warning
            team: dba
          annotations:
            summary: "PostgreSQL 슬로우 쿼리 감지 (5초 초과)"
            description: "쿼리 평균 실행 시간 {{ $value | printf \"%.1f\" }}초 초과. queryid={{ $labels.queryid }}"
            csap_ref: "D-12-10"

        - alert: LowIndexUsage
          expr: pg_index_usage_index_usage_ratio < 0.3
          for: 30m
          labels:
            severity: warning
            team: dba
          annotations:
            summary: "PostgreSQL 인덱스 사용률 저하 (30% 미만)"
            description: "테이블 {{ $labels.relname }}의 인덱스 사용률 {{ $value | printf \"%.1f\" }}%. 풀 스캔 발생 가능."
            csap_ref: "D-12-10"

        - alert: PostgreSQLHighConnectionCount
          expr: pg_stat_activity_count > 80
          for: 5m
          labels:
            severity: warning
            team: dba
          annotations:
            summary: "PostgreSQL 연결 수 과다 (80개 초과)"
            description: "현재 연결 수 {{ $value }}개. max_connections 초과 위험."
            csap_ref: "D-06-03"

    # -------------------------------------------------------------------------
    # 서비스 에러율 알림 — FR-N24.6, CSAP D-06-03
    # G-16 수정: HighErrorRate 추가 (Tempo serviceGraph 기반)
    # -------------------------------------------------------------------------
    - name: saas-service-alerts
      rules:
        - alert: HighServiceErrorRate
          expr: |
            sum by (client) (rate(traces_service_graph_request_failed_total[5m]))
            / sum by (client) (rate(traces_service_graph_request_total[5m])) > 0.01
          for: 5m
          labels:
            severity: critical
            team: devops
          annotations:
            summary: "서비스 {{ $labels.client }} 에러율 1% 초과"
            description: "5분간 에러율 {{ $value | printf \"%.2f\" }}%. 트레이스 확인 필요."
            csap_ref: "D-06-03"

        - alert: HighServiceLatencyP99
          expr: |
            histogram_quantile(0.99,
              sum by (client, le) (rate(traces_service_graph_request_duration_seconds_bucket[5m]))
            ) > 3
          for: 5m
          labels:
            severity: warning
            team: devops
          annotations:
            summary: "서비스 {{ $labels.client }} P99 레이턴시 3초 초과"
            description: "P99 레이턴시 {{ $value | printf \"%.2f\" }}초. 성능 병목 확인 필요."
            csap_ref: "D-06-03"

    - name: saas-flux-alerts
      rules:
        - alert: FluxReconcileFailure
          expr: gotk_reconcile_condition{type="Ready",status="False"} == 1
          for: 5m
          labels:
            severity: critical
            team: devops
          annotations:
            summary: "Flux {{ $labels.kind }}/{{ $labels.name }} reconcile 실패"
            description: "Flux 리소스가 5분 이상 Ready=False 상태입니다."
            csap_ref: "D-12-08"
