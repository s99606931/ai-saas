# =============================================================================
# Tempo 분산 추적 성능 — Alert Rules
# Design Ref: MTU-N230 §1.2, §1.6
# Plan SC: FR-N230.2, FR-N230.6
# CSAP: D-06(침해사고 관리 — 트레이스 파이프라인 장애 탐지)
# =============================================================================
groups:
  # =========================================================================
  # Tempo 수집 파이프라인 알림
  # Design Ref: §1.1, §1.6
  # =========================================================================
  - name: tempo-performance-ingestion-alerts
    rules:
      # Tempo 수집 완전 중단
      # Plan SC: FR-N230.1
      - alert: TempoIngestionStopped
        expr: |
          sum(rate(tempo_distributor_spans_received_total[5m])) == 0
        for: 5m
        labels:
          severity: critical
          team: devops
          component: tempo
        annotations:
          summary: "Tempo 트레이스 수집 완전 중단"
          description: "Tempo가 5분간 스팬을 수신하지 않고 있습니다. 분산 추적 파이프라인 장애."
          csap_ref: "D-06-01"
          runbook: "docs/operations/tempo-performance-runbook.md"

      # 스팬 드롭률 > 0.5%
      - alert: TempoSpanDropRateHigh
        expr: |
          tempo:pipeline:span_drop_ratio > 0.005
        for: 5m
        labels:
          severity: warning
          team: devops
          component: tempo
        annotations:
          summary: "Tempo 스팬 드롭률 {{ $value | printf \"%.2f%%\" }}"
          description: "스팬 드롭률이 0.5%를 초과했습니다. 수집 파이프라인 병목 확인 필요."
          csap_ref: "D-06-03"

      # Tempo 파드 미실행
      - alert: TempoNotRunning
        expr: |
          absent(up{job=~".*tempo.*"} == 1)
        for: 2m
        labels:
          severity: critical
          team: devops
          component: tempo
        annotations:
          summary: "Tempo 파드 미실행 — 분산 추적 중단"
          description: "Tempo 파드가 실행되지 않고 있습니다. 전체 분산 추적 기능이 중단됩니다."
          csap_ref: "D-06-01"

      # 활성 트레이스 과다 (메모리 압박)
      - alert: TempoLiveTracesHigh
        expr: |
          tempo:ingester:live_traces > 50000
        for: 10m
        labels:
          severity: warning
          team: devops
          component: tempo
        annotations:
          summary: "Tempo 활성 트레이스 {{ $value }}개 — 과다"
          description: "활성 트레이스가 50,000개를 초과했습니다. 메모리 부족 위험."
          csap_ref: "D-06-04"

  # =========================================================================
  # Tempo 쿼리 성능 알림
  # Design Ref: §1.2
  # =========================================================================
  - name: tempo-performance-query-alerts
    rules:
      # 쿼리 p99 지연 > 5초
      # Plan SC: FR-N230.2
      - alert: TempoQuerySlowP99
        expr: |
          tempo:query:duration_p99 > 5
        for: 5m
        labels:
          severity: warning
          team: devops
          component: tempo
        annotations:
          summary: "Tempo 쿼리 지연 p99 {{ $value | printf \"%.1f\" }}초"
          description: "TraceQL 쿼리 p99 지연이 5초를 초과했습니다. 쿼리 최적화 필요."
          csap_ref: "D-06-04"

      # 쿼리 에러율 > 1%
      - alert: TempoQueryErrors
        expr: |
          sum(rate(tempo_request_duration_seconds_count{status_code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(tempo_request_duration_seconds_count[5m])), 0.001)
          > 0.01
        for: 5m
        labels:
          severity: critical
          team: devops
          component: tempo
        annotations:
          summary: "Tempo 쿼리 에러율 {{ $value | printf \"%.1f%%\" }}"
          description: "Tempo 쿼리 에러율이 1%를 초과했습니다. 서비스 상태 확인 필요."
          csap_ref: "D-06-04"

  # =========================================================================
  # Tempo 스토리지/압축 알림
  # Design Ref: §1.3, §1.4
  # =========================================================================
  - name: tempo-performance-storage-alerts
    rules:
      # 압축 지연 > 30초
      # Plan SC: FR-N230.4
      - alert: TempoCompactionSlow
        expr: |
          tempo:compactor:duration_avg_seconds > 30
        for: 10m
        labels:
          severity: warning
          team: devops
          component: tempo
        annotations:
          summary: "Tempo 압축 지연 {{ $value | printf \"%.1f\" }}초"
          description: "블록 압축 평균 시간이 30초를 초과했습니다. 디스크 I/O 또는 리소스 확인."
          csap_ref: "D-06-04"

      # Tempo 메모리 사용량 > 800MB (limit 1Gi 기준 80%)
      - alert: TempoMemoryHigh
        expr: |
          sum(container_memory_working_set_bytes{container="tempo"}) / 1024 / 1024 > 800
        for: 10m
        labels:
          severity: warning
          team: devops
          component: tempo
        annotations:
          summary: "Tempo 메모리 {{ $value | printf \"%.0f\" }}MB — 상한 근접"
          description: "Tempo 메모리 사용량이 800MB를 초과. 1Gi limit 기준 80% 도달."
          csap_ref: "D-06-04"
