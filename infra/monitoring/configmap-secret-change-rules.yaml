# =============================================================================
# ConfigMap/Secret 변경 감지 모니터링 — Recording + Alerting Rules
# Design Ref: MTU-N188 Design §DS-N188.1~DS-N188.4
# Plan SC: FR-N188.1~FR-N188.5
# CSAP: D-06(감사 로깅), D-09(암호화 관리), D-10(서비스 가용성)
#
# 적용: kubectl apply -f infra/monitoring/configmap-secret-change-rules.yaml
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: configmap-secret-change-rules
  namespace: monitoring
  labels:
    app: kube-prometheus-stack
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: saas-platform
    app.kubernetes.io/component: config-change-monitoring
    mtu: N188
  annotations:
    csap.ref/d06: "침해사고관리 — ConfigMap/Secret 변경 감사 추적"
    csap.ref/d09: "암호화 — Secret 변경 모니터링"
spec:
  groups:
    # =========================================================================
    # 그룹 1: ConfigMap 변경 Recording Rules
    # Design Ref: MTU-N188 Design §DS-N188.1
    # Plan SC: FR-N188.1
    # =========================================================================
    - name: config:configmap_change_rules
      interval: 30s
      rules:
        # ConfigMap 변경 빈도 (5분 윈도우, 네임스페이스별)
        - record: configmap:changes:rate5m
          expr: |
            sum by (namespace) (
              changes(kube_configmap_metadata_resource_version[5m])
            )
          labels:
            mtu: N188
            csap_control: D-06-02

        # ConfigMap 개별 변경 감지
        - record: configmap:change_detected:info
          expr: |
            changes(kube_configmap_metadata_resource_version[5m]) > 0
          labels:
            mtu: N188
            csap_control: D-06-02

        # 네임스페이스별 ConfigMap 총 개수
        - record: configmap:total:count
          expr: |
            count by (namespace) (
              kube_configmap_info
            )
          labels:
            mtu: N188
            csap_control: D-10-03

    # =========================================================================
    # 그룹 2: Secret 변경 Recording Rules
    # Design Ref: MTU-N188 Design §DS-N188.2
    # Plan SC: FR-N188.2
    # =========================================================================
    - name: config:secret_change_rules
      interval: 30s
      rules:
        # Secret 변경 빈도 (5분 윈도우, 네임스페이스별)
        - record: secret:changes:rate5m
          expr: |
            sum by (namespace) (
              changes(kube_secret_metadata_resource_version[5m])
            )
          labels:
            mtu: N188
            csap_control: D-09-01

        # Secret 개별 변경 감지
        - record: secret:change_detected:info
          expr: |
            changes(kube_secret_metadata_resource_version[5m]) > 0
          labels:
            mtu: N188
            csap_control: D-09-01

        # 네임스페이스별 Secret 총 개수
        - record: secret:total:count
          expr: |
            count by (namespace) (
              kube_secret_info
            )
          labels:
            mtu: N188
            csap_control: D-09-01

    # =========================================================================
    # 그룹 3: 총 변경 통계 Recording Rules
    # Design Ref: MTU-N188 Design §DS-N188.5
    # Plan SC: FR-N188.5
    # =========================================================================
    - name: config:total_change_rules
      interval: 60s
      rules:
        # ConfigMap + Secret 합산 변경 빈도
        - record: config:all_changes:rate5m
          expr: |
            (configmap:changes:rate5m or vector(0))
            + (secret:changes:rate5m or vector(0))
          labels:
            mtu: N188
            csap_control: D-06-02

    # =========================================================================
    # 그룹 4: 변경 감지 알림 규칙
    # Design Ref: MTU-N188 Design §DS-N188.3, §DS-N188.4
    # Plan SC: FR-N188.3, FR-N188.4
    # =========================================================================
    - name: config:change_alerts
      rules:
        # Secret 변경 감지 (모든 변경 알림 — 보안 감사용)
        - alert: SecretChanged
          expr: |
            sum by (namespace, secret) (
              changes(kube_secret_metadata_resource_version[5m])
            ) > 0
          for: 0m
          labels:
            severity: info
            csap_control: D-09-01
            team: security
            mtu: N188
          annotations:
            summary: "{{ $labels.namespace }}/{{ $labels.secret }} Secret 변경 감지"
            description: |
              Secret {{ $labels.secret }}이(가) 변경되었습니다.
              CSAP D-09 감사 요건에 따라 변경 내용을 확인하십시오.
            runbook_url: "https://docs.saas.go.kr/operations/security/secret-change-audit"

        # ConfigMap 과다 변경 (5분 내 3건 이상)
        - alert: ConfigMapChangeFlood
          expr: |
            configmap:changes:rate5m > 3
          for: 5m
          labels:
            severity: warning
            csap_control: D-06-02
            team: sre
            mtu: N188
          annotations:
            summary: "{{ $labels.namespace }} ConfigMap 과다 변경"
            description: |
              네임스페이스 {{ $labels.namespace }}에서 5분 내
              {{ $value | printf "%.0f" }}건의 ConfigMap 변경이 감지되었습니다.
              자동화 도구 오작동 또는 비정상 배포 가능성을 확인하십시오.
            runbook_url: "https://docs.saas.go.kr/operations/config/change-flood"

        # Secret 과다 변경 (5분 내 3건 이상)
        - alert: SecretChangeFlood
          expr: |
            secret:changes:rate5m > 3
          for: 5m
          labels:
            severity: critical
            csap_control: D-09-01
            team: security
            mtu: N188
          annotations:
            summary: "{{ $labels.namespace }} Secret 과다 변경"
            description: |
              네임스페이스 {{ $labels.namespace }}에서 5분 내
              {{ $value | printf "%.0f" }}건의 Secret 변경이 감지되었습니다.
              비인가 접근 또는 Secret 로테이션 오류 가능성을 확인하십시오.
            runbook_url: "https://docs.saas.go.kr/operations/security/secret-change-flood"

        # 비정상 시간대 Secret 변경 (KST 18:00~09:00 = UTC 09:00~00:00)
        - alert: SecretChangedOffHours
          expr: |
            (
              sum by (namespace, secret) (
                changes(kube_secret_metadata_resource_version[5m])
              ) > 0
            )
            and on() (hour() >= 9 or hour() < 0)
          for: 0m
          labels:
            severity: warning
            csap_control: D-06-02
            team: security
            mtu: N188
          annotations:
            summary: "비정상 시간대 Secret 변경: {{ $labels.namespace }}/{{ $labels.secret }}"
            description: |
              업무 시간(KST 09:00~18:00) 외에 Secret {{ $labels.secret }}이(가)
              변경되었습니다. 비인가 접근 가능성을 확인하십시오.
            runbook_url: "https://docs.saas.go.kr/operations/security/off-hours-change"

        # 비정상 시간대 ConfigMap 변경
        - alert: ConfigMapChangedOffHours
          expr: |
            (
              sum by (namespace, configmap) (
                changes(kube_configmap_metadata_resource_version[5m])
              ) > 0
            )
            and on() (hour() >= 9 or hour() < 0)
          for: 0m
          labels:
            severity: info
            csap_control: D-06-02
            team: sre
            mtu: N188
          annotations:
            summary: "비정상 시간대 ConfigMap 변경: {{ $labels.namespace }}/{{ $labels.configmap }}"
            description: |
              업무 시간(KST 09:00~18:00) 외에 ConfigMap {{ $labels.configmap }}이(가)
              변경되었습니다.

        # 민감 네임스페이스 변경 (kube-system, monitoring, cert-manager)
        - alert: SensitiveNamespaceConfigChange
          expr: |
            (
              configmap:changes:rate5m{namespace=~"kube-system|monitoring|cert-manager|flux-system"} > 0
            )
            or
            (
              secret:changes:rate5m{namespace=~"kube-system|monitoring|cert-manager|flux-system"} > 0
            )
          for: 0m
          labels:
            severity: warning
            csap_control: D-06-02
            team: security
            mtu: N188
          annotations:
            summary: "민감 네임스페이스 {{ $labels.namespace }} 설정 변경 감지"
            description: |
              민감 네임스페이스 {{ $labels.namespace }}에서
              ConfigMap 또는 Secret 변경이 감지되었습니다.
              인가된 변경인지 확인하십시오.
            runbook_url: "https://docs.saas.go.kr/operations/security/sensitive-namespace-change"
