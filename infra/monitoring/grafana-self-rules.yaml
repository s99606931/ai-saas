# =============================================================================
# Grafana 자체 성능 — Recording Rules
# Design Ref: MTU-N233 §1.1, §1.3
# Plan SC: FR-N233.1, FR-N233.3
# CSAP: D-06(대시보드 서비스 가용성), D-08(인증 실패 모니터링)
# =============================================================================
groups:
  - name: grafana-self-performance
    interval: 15s
    rules:
      # API 응답 지연 p99 (초)
      # Plan SC: FR-N233.1
      - record: grafana:api:request_duration_p99
        expr: |
          histogram_quantile(0.99,
            sum(rate(grafana_http_request_duration_seconds_bucket[5m])) by (le)
          )

      # API 응답 지연 p50 (초)
      - record: grafana:api:request_duration_p50
        expr: |
          histogram_quantile(0.50,
            sum(rate(grafana_http_request_duration_seconds_bucket[5m])) by (le)
          )

      # API 에러율 (5xx)
      - record: grafana:api:error_rate
        expr: |
          sum(rate(grafana_http_request_duration_seconds_count{status_code=~"5.."}[5m]))
          /
          clamp_min(sum(rate(grafana_http_request_duration_seconds_count[5m])), 0.001)

      # API 요청률 (초당)
      - record: grafana:api:request_rate
        expr: |
          sum(rate(grafana_http_request_duration_seconds_count[5m]))

  - name: grafana-self-auth
    interval: 30s
    rules:
      # 로그인 시도 비율
      # Plan SC: FR-N233.3
      - record: grafana:auth:login_attempts_rate
        expr: |
          sum(rate(grafana_api_login_post_total[5m]))

      # 로그인 실패 비율
      - record: grafana:auth:login_failures_rate
        expr: |
          sum(rate(grafana_api_login_post_total{result="failure"}[5m]))

      # 활성 사용자 수
      - record: grafana:users:active_count
        expr: |
          sum(grafana_stat_active_users)
