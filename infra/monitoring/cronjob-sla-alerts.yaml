# CronJob SLA 알림 규칙
# Design Ref: MTU-N197.design.md §2
# Plan SC: FR-N197.2, FR-N197.3, FR-N197.4
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cronjob-sla-alerts
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
    app.kubernetes.io/part-of: saas-platform
    app.kubernetes.io/component: cronjob-sla-monitoring
    mtu: N197
spec:
  groups:
    - name: cronjob.sla.alerts
      rules:
        # FR-N197.2: CronJob 마지막 성공 이후 24시간 초과
        - alert: CronJobConsecutiveFailures
          expr: |
            cronjob_sla:since_last_success_seconds > 86400
            and
            kube_cronjob_spec_suspend == 0
          for: 0m
          labels:
            severity: critical
            team: infra
            csap: D-06
            mtu: N197
          annotations:
            summary: "CronJob 24시간 이상 성공 없음: {{ $labels.cronjob }}"
            description: |
              CronJob {{ $labels.cronjob }} ({{ $labels.namespace }})이
              {{ $value | humanizeDuration }} 동안 성공한 실행이 없습니다.
              연속 실패 가능성이 있습니다. 즉시 점검하십시오.
            runbook_url: "https://docs.saas.local/runbook/cronjob-failure"

        # FR-N197.3: CronJob 실행 지연 (예정 시간 초과)
        - alert: CronJobOverdue
          expr: |
            cronjob_sla:overdue_seconds > 600
            and
            kube_cronjob_spec_suspend == 0
          for: 10m
          labels:
            severity: warning
            team: infra
            csap: D-10
            mtu: N197
          annotations:
            summary: "CronJob 실행 지연: {{ $labels.cronjob }}"
            description: |
              CronJob {{ $labels.cronjob }} ({{ $labels.namespace }})이
              예정 실행 시간을 10분 이상 초과했습니다.
              스케줄러 또는 리소스 부족을 확인하십시오.
            runbook_url: "https://docs.saas.local/runbook/cronjob-overdue"

        # FR-N197.1: 24시간 SLA 위반 (성공률 < 95%)
        - alert: CronJobSLABreach
          expr: |
            cronjob_sla:success_rate_24h < 95
          for: 15m
          labels:
            severity: critical
            team: infra
            csap: D-10
            mtu: N197
          annotations:
            summary: "CronJob SLA 위반: 24h 성공률 {{ $value | printf \"%.1f\" }}%"
            description: |
              CronJob 24시간 성공률이 {{ $value | printf "%.1f" }}%로
              95% SLA 기준 미달입니다.
            runbook_url: "https://docs.saas.local/runbook/cronjob-sla"

        # FR-N197.4: CronJob 실행 시간 이상 (30분 초과)
        - alert: CronJobDurationAnomaly
          expr: |
            cronjob_sla:job_duration_seconds > 1800
          for: 5m
          labels:
            severity: warning
            team: infra
            csap: D-10
            mtu: N197
          annotations:
            summary: "CronJob 실행 시간 이상: {{ $labels.job_name }}"
            description: |
              Job {{ $labels.job_name }} ({{ $labels.namespace }})의
              실행 시간이 {{ $value | humanizeDuration }}입니다.
              30분을 초과하여 비정상적으로 오래 소요되고 있습니다.
            runbook_url: "https://docs.saas.local/runbook/cronjob-duration"

        # 다수 Job 동시 실패
        - alert: MultipleJobFailures
          expr: |
            cronjob_sla:failed_jobs_24h > 5
          for: 10m
          labels:
            severity: critical
            team: infra
            csap: D-06
            mtu: N197
          annotations:
            summary: "24시간 내 Job 실패 다수 발생: {{ $value }}건"
            description: |
              최근 24시간 동안 {{ $value }}건의 Job이 실패했습니다.
              시스템 전반적인 문제를 점검하십시오.

        # 일시중지 CronJob 존재
        - alert: CronJobSuspended
          expr: |
            cronjob_sla:suspended_count > 0
          for: 24h
          labels:
            severity: info
            team: infra
            mtu: N197
          annotations:
            summary: "일시중지 CronJob {{ $value }}개 존재"
            description: |
              {{ $value }}개 CronJob이 24시간 이상 일시중지 상태입니다.
              의도된 중지인지 확인하십시오.
