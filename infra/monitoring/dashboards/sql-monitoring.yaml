# SQL 모니터링 대시보드 ConfigMap
# Design Ref: MTU-N24 §FR-N24.3 — SQL 쿼리 모니터링 대시보드
# Plan SC: FR-N24.3, FR-N24.4
# CSAP 준수: D-06(성능 로그 시각화), D-08(Grafana RBAC — 뷰어 접근 허용)
#
# 포함 패널:
#   - 슬로우쿼리 TOP 20 테이블
#   - 쿼리 TPS 그래프 (초당 트랜잭션)
#   - DB 연결 수 게이지
#   - 캐시 히트율 게이지
#   - Redis 메모리 사용 패널
#   - Redis 히트율 패널
apiVersion: v1
kind: ConfigMap
metadata:
  name: saas-sql-monitoring-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: observability-stack
data:
  saas-sql-monitoring.json: |
    {
      "annotations": {"list": []},
      "description": "PostgreSQL + Redis 성능 모니터링 — 슬로우쿼리, TPS, 연결수, 캐시 히트율",
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "refresh": "30s",
      "schemaVersion": 39,
      "tags": ["database", "postgresql", "redis", "performance", "csap-d12"],
      "time": {"from": "now-1h", "to": "now"},
      "timepicker": {},
      "timezone": "Asia/Seoul",
      "title": "SQL 및 캐시 모니터링",
      "uid": "saas-sql-monitoring",
      "version": 1,
      "panels": [
        {
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 0},
          "id": 1,
          "title": "PostgreSQL 개요",
          "type": "row"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "mappings": [],
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 50},
                  {"color": "red", "value": 80}
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": {"h": 4, "w": 4, "x": 0, "y": 1},
          "id": 2,
          "options": {"colorMode": "background", "graphMode": "none", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {
              "expr": "sum(pg_stat_database_detail_numbackends{namespace=\"default\"})",
              "legendFormat": "전체 연결 수"
            }
          ],
          "title": "DB 연결 수",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "yellow", "value": 80},
                  {"color": "green", "value": 95}
                ]
              },
              "unit": "percent"
            }
          },
          "gridPos": {"h": 4, "w": 4, "x": 4, "y": 1},
          "id": 3,
          "options": {"orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"]}, "showThresholdLabels": true, "showThresholdMarkers": true},
          "targets": [
            {
              "expr": "avg(pg_stat_database_detail_cache_hit_ratio{namespace=\"default\"})",
              "legendFormat": "캐시 히트율"
            }
          ],
          "title": "DB 버퍼 캐시 히트율",
          "type": "gauge"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 1},
                  {"color": "red", "value": 5}
                ]
              },
              "unit": "short"
            }
          },
          "gridPos": {"h": 4, "w": 4, "x": 8, "y": 1},
          "id": 4,
          "options": {"colorMode": "background", "graphMode": "area", "reduceOptions": {"calcs": ["lastNotNull"]}},
          "targets": [
            {
              "expr": "sum(pg_stat_database_detail_deadlocks{namespace=\"default\"})",
              "legendFormat": "데드락"
            }
          ],
          "title": "데드락 발생 수",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "unit": "reqps"
            }
          },
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 1},
          "id": 5,
          "options": {
            "legend": {"calcs": ["mean", "max"], "displayMode": "table", "placement": "bottom"},
            "tooltip": {"mode": "multi"}
          },
          "targets": [
            {
              "expr": "rate(pg_stat_database_detail_transactions_committed{namespace=\"default\"}[1m])",
              "legendFormat": "{{database}} — 커밋 TPS"
            },
            {
              "expr": "rate(pg_stat_database_detail_transactions_rolled_back{namespace=\"default\"}[1m])",
              "legendFormat": "{{database}} — 롤백 TPS"
            }
          ],
          "title": "쿼리 TPS (초당 트랜잭션)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "unit": "short"
            }
          },
          "gridPos": {"h": 4, "w": 12, "x": 0, "y": 5},
          "id": 6,
          "options": {
            "legend": {"calcs": ["mean"], "displayMode": "table", "placement": "bottom"}
          },
          "targets": [
            {
              "expr": "pg_stat_activity_detail_count{namespace=\"default\", state=\"active\"}",
              "legendFormat": "{{database}} — 활성 쿼리"
            },
            {
              "expr": "pg_stat_activity_detail_count{namespace=\"default\", state=\"idle in transaction\"}",
              "legendFormat": "{{database}} — 트랜잭션 중 대기"
            }
          ],
          "title": "DB 연결 상태별 수",
          "type": "timeseries"
        },
        {
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 9},
          "id": 10,
          "title": "슬로우쿼리 분석 (5초 이상) — CSAP D-12",
          "type": "row"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "custom": {
                "align": "left",
                "displayMode": "auto"
              }
            },
            "overrides": [
              {
                "matcher": {"id": "byName", "options": "mean_exec_time_seconds"},
                "properties": [
                  {"id": "displayName", "value": "평균 실행 시간(초)"},
                  {"id": "unit", "value": "s"},
                  {"id": "custom.displayMode", "value": "color-background"},
                  {"id": "thresholds", "value": {
                    "mode": "absolute",
                    "steps": [
                      {"color": "green", "value": null},
                      {"color": "yellow", "value": 5},
                      {"color": "red", "value": 15}
                    ]
                  }}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "max_exec_time_seconds"},
                "properties": [
                  {"id": "displayName", "value": "최대 실행 시간(초)"},
                  {"id": "unit", "value": "s"}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "calls"},
                "properties": [
                  {"id": "displayName", "value": "실행 횟수"},
                  {"id": "unit", "value": "short"}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "cache_hit_ratio"},
                "properties": [
                  {"id": "displayName", "value": "캐시 히트율(%)"},
                  {"id": "unit", "value": "percent"}
                ]
              },
              {
                "matcher": {"id": "byName", "options": "query_text"},
                "properties": [
                  {"id": "displayName", "value": "쿼리 텍스트 (PII 마스킹됨)"},
                  {"id": "custom.width", "value": 400}
                ]
              }
            ]
          },
          "gridPos": {"h": 10, "w": 24, "x": 0, "y": 10},
          "id": 11,
          "options": {
            "showHeader": true,
            "sortBy": [{"displayName": "평균 실행 시간(초)", "desc": true}]
          },
          "targets": [
            {
              "expr": "topk(20, pg_slow_queries_mean_exec_time_seconds{namespace=\"default\"} > 5)",
              "legendFormat": "{{query_text}}",
              "format": "table",
              "instant": true
            }
          ],
          "title": "슬로우쿼리 TOP 20 (평균 5초 이상, 쿼리 본문은 pg_stat_statements에 의해 파라미터 익명화)",
          "transformations": [
            {
              "id": "organize",
              "options": {
                "renameByName": {
                  "query_text": "쿼리 텍스트",
                  "calls": "실행 횟수",
                  "mean_exec_time_seconds": "평균 실행(초)",
                  "max_exec_time_seconds": "최대 실행(초)",
                  "cache_hit_ratio": "캐시 히트율(%)"
                }
              }
            }
          ],
          "type": "table"
        },
        {
          "collapsed": false,
          "gridPos": {"h": 1, "w": 24, "x": 0, "y": 20},
          "id": 20,
          "title": "Redis 메모리 및 캐시 현황 — FR-N24.4",
          "type": "row"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 70},
                  {"color": "red", "value": 90}
                ]
              },
              "unit": "percent"
            }
          },
          "gridPos": {"h": 6, "w": 6, "x": 0, "y": 21},
          "id": 21,
          "options": {"orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"]}, "showThresholdLabels": true, "showThresholdMarkers": true},
          "targets": [
            {
              "expr": "redis_memory_used_bytes / redis_memory_max_bytes * 100",
              "legendFormat": "메모리 사용률"
            }
          ],
          "title": "Redis 메모리 사용률 (90% 초과 시 알림)",
          "type": "gauge"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "max": 100,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "yellow", "value": 50},
                  {"color": "green", "value": 80}
                ]
              },
              "unit": "percent"
            }
          },
          "gridPos": {"h": 6, "w": 6, "x": 6, "y": 21},
          "id": 22,
          "options": {"orientation": "auto", "reduceOptions": {"calcs": ["lastNotNull"]}, "showThresholdLabels": true, "showThresholdMarkers": true},
          "targets": [
            {
              "expr": "rate(redis_keyspace_hits_total[5m]) / (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m])) * 100",
              "legendFormat": "히트율"
            }
          ],
          "title": "Redis 캐시 히트율 (50% 미만 시 경고)",
          "type": "gauge"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "unit": "bytes"
            }
          },
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 21},
          "id": 23,
          "options": {
            "legend": {"calcs": ["mean", "max", "last"], "displayMode": "table", "placement": "bottom"}
          },
          "targets": [
            {
              "expr": "redis_memory_used_bytes",
              "legendFormat": "사용 메모리"
            },
            {
              "expr": "redis_memory_max_bytes",
              "legendFormat": "최대 메모리 (maxmemory)"
            },
            {
              "expr": "redis_memory_rss_bytes",
              "legendFormat": "RSS 메모리"
            }
          ],
          "title": "Redis 메모리 사용 추이",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "unit": "short"
            }
          },
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 27},
          "id": 24,
          "targets": [
            {
              "expr": "redis_connected_clients",
              "legendFormat": "연결 수"
            },
            {
              "expr": "redis_blocked_clients",
              "legendFormat": "블록된 클라이언트"
            }
          ],
          "title": "Redis 연결 수",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "prometheus"},
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "unit": "short"
            }
          },
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 27},
          "id": 25,
          "targets": [
            {
              "expr": "rate(redis_evicted_keys_total[5m])",
              "legendFormat": "Eviction 속도 (5분)"
            }
          ],
          "title": "Redis 키 Eviction 속도",
          "type": "timeseries"
        }
      ]
    }
