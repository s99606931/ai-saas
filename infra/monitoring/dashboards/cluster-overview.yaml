# k3s 클러스터 개요 대시보드 ConfigMap
# Design Ref: MTU-N25 §1
# Plan SC: FR-N25.1
apiVersion: v1
kind: ConfigMap
metadata:
  name: saas-cluster-overview
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/part-of: public-saas
data:
  saas-cluster-overview.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [],
      "panels": [
        {
          "title": "노드 상태",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [{"expr": "kube_node_status_condition{condition=\"Ready\",status=\"true\"}", "legendFormat": "{{node}}"}],
          "fieldConfig": {"defaults": {"mappings": [{"type": "value", "options": {"1": {"text": "Ready", "color": "green"}, "0": {"text": "NotReady", "color": "red"}}}]}}
        },
        {
          "title": "CPU 사용률 (%)",
          "type": "gauge",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "targets": [{"expr": "100 - (avg(rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "legendFormat": "CPU"}],
          "fieldConfig": {"defaults": {"max": 100, "min": 0, "thresholds": {"steps": [{"value": 0, "color": "green"}, {"value": 70, "color": "yellow"}, {"value": 85, "color": "red"}]}}}
        },
        {
          "title": "메모리 사용률 (%)",
          "type": "gauge",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "targets": [{"expr": "(1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100", "legendFormat": "Memory"}],
          "fieldConfig": {"defaults": {"max": 100, "min": 0, "thresholds": {"steps": [{"value": 0, "color": "green"}, {"value": 70, "color": "yellow"}, {"value": 85, "color": "red"}]}}}
        },
        {
          "title": "전체 Pod 수",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "targets": [{"expr": "count(kube_pod_info)", "legendFormat": "Total"}]
        },
        {
          "title": "네임스페이스별 Pod 상태",
          "type": "table",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "targets": [{"expr": "count by (namespace, phase) (kube_pod_status_phase{phase=~\"Running|Pending|Failed\"})", "legendFormat": "{{namespace}} - {{phase}}", "format": "table", "instant": true}],
          "transformations": [{"id": "organize", "options": {"excludeByName": {"Time": true}}}]
        },
        {
          "title": "CPU 사용량 추이",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "targets": [{"expr": "sum(rate(container_cpu_usage_seconds_total{namespace!=\"\"}[5m])) by (namespace)", "legendFormat": "{{namespace}}"}]
        },
        {
          "title": "메모리 사용량 추이",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 12},
          "targets": [{"expr": "sum(container_memory_working_set_bytes{namespace!=\"\"}) by (namespace) / 1024 / 1024", "legendFormat": "{{namespace}} (MB)"}]
        }
      ],
      "schemaVersion": 39,
      "tags": ["k3s", "cluster", "public-saas"],
      "templating": {"list": []},
      "time": {"from": "now-1h", "to": "now"},
      "title": "Public SaaS - 클러스터 개요",
      "uid": "saas-cluster-overview"
    }
