          "options": {
            "mode": "markdown",
            "content": "### CPU 모니터링 가이드\n\n**기준치**\n- 🟢 정상: **0 ~ 70%**\n- 🟡 경고: **70 ~ 85%** → 워크로드 분산 검토\n- 🔴 위험: **85%+** → 즉시 조치\n\n**주요 확인 항목**\n1. `idle` 모드 감소 추이 확인\n2. `user` vs `system` 비율 분석\n3. 특정 시간대 급등 패턴 파악\n\n**조치 방법**\n```\nkubectl top pods -A --sort-by=cpu\n```\n\n**CSAP 기준**: D-06-03"
          }
        },
