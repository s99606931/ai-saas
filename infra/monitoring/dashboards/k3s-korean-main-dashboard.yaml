          "options": {
            "mode": "markdown",
            "content": "## k3s 공공 SaaS 메인 모니터링 대시보드\n\n이 대시보드는 **k3s 단일 노드 클러스터**의 핵심 자원을 실시간으로 모니터링합니다.\n\n| 영역 | 기준치 (경고) | 기준치 (위험) | 측정 주기 |\n|------|-------------|-------------|-------|\n| CPU 사용률 | **70%** 이상 | **85%** 이상 | 15초 |\n| 메모리 사용률 | **80%** 이상 | **90%** 이상 | 15초 |\n| 디스크 사용률 | **75%** 이상 | **85%** 이상 | 1분 |\n| 서비스 가용성 | 1개 이상 다운 | 2개 이상 다운 | 15초 |\n\n> **색상 안내**: 🟢 정상 · 🟡 경고 (조치 권장) · 🔴 위험 (즉시 조치)"
          }
        },
