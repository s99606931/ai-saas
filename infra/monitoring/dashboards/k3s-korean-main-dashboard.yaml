            "content": "### 디스크 모니터링 가이드\n\n**기준치**\n- 🟢 정상: **0 ~ 75%**\n- 🟡 경고: **75 ~ 85%** → 불필요 데이터 정리\n- 🔴 위험: **85%+** → 즉시 조치\n\n**디스크 I/O 기준**\n| 지표 | 경고 기준 |\n|------|----------|\n| 읽기 처리량 | > 200 MB/s |\n| 쓰기 처리량 | > 150 MB/s |\n\n**조치 방법**\n```bash\n# 공간 확보\nkubectl delete pods \\\n  --field-selector status.phase=Failed -A\n\n# PV 사용량 확인\nkubectl get pvc -A\n```\n\n**CSAP 기준**: D-06-03"
