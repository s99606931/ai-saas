            "content": "### 메모리 모니터링 가이드\n\n**기준치**\n- 🟢 정상: **0 ~ 80%**\n- 🟡 경고: **80 ~ 90%** → 메모리 누수 점검\n- 🔴 위험: **90%+** → OOM Killer 발동 위험\n\n**메모리 구성**\n| 항목 | 설명 |\n|------|------|\n| `used` | 실제 사용 중 |\n| `cached` | 파일 캐시 (회수 가능) |\n| `available` | 실제 사용 가능 |\n\n**조치 방법**\n```\nkubectl top pods -A --sort-by=memory\n```\n\n**CSAP 기준**: D-06-03"
