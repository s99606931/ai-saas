# k3s 환경 NetworkPolicy — 공공 SaaS 모니터링 수정
# 변경: CoreDNS 포트 9153 추가 + 호스트 노드 (kubelet/apiserver) egress 허용
# CSAP: D-08 (접근 통제)
---
# Prometheus → 모든 스크랩 대상 허용 (수정됨)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: monitoring
  labels:
    policy-type: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Egress
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: grafana
      ports:
        - port: 9090
          protocol: TCP
  egress:
    # 파드 네트워크 스크랩 (kube-state-metrics, node-exporter, alertmanager 등)
    - to:
        - namespaceSelector: {}
      ports:
        - port: 3000   # Grafana, Gitea
          protocol: TCP
        - port: 8080   # kube-state-metrics
          protocol: TCP
        - port: 9090   # Prometheus
          protocol: TCP
        - port: 9093   # Alertmanager
          protocol: TCP
        - port: 9100   # Node Exporter
          protocol: TCP
        - port: 9153   # CoreDNS 메트릭 (신규 추가)
          protocol: TCP
        - port: 8443   # Operator
          protocol: TCP
        - port: 3100   # Loki
          protocol: TCP
        - port: 3200   # Tempo
          protocol: TCP
        - port: 14268  # Jaeger collector
          protocol: TCP
        - port: 9411   # Zipkin
          protocol: TCP
    # 호스트 노드 직접 스크랩 (kubelet:10250, apiserver:6443, node-exporter:9100)
    - to:
        - ipBlock:
            cidr: 172.18.120.97/32
      ports:
        - port: 9100   # Node Exporter (hostNetwork)
          protocol: TCP
        - port: 10250  # kubelet 메트릭
          protocol: TCP
        - port: 6443   # API server 메트릭
          protocol: TCP
        - port: 3000   # Gitea (호스트)
          protocol: TCP
    # Kubernetes API 서버 ClusterIP 경유 (kubelet 프록시)
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - port: 443    # kubernetes.default.svc
          protocol: TCP
    # DNS 조회 허용
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

---
# Grafana 사이드카 → Kubernetes API 서버 접근 허용
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-grafana-api-server
  namespace: monitoring
  labels:
    policy-type: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: grafana
  policyTypes:
    - Egress
  egress:
    # Kubernetes API 서버 (ConfigMap 감시)
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - port: 443
          protocol: TCP
    # 인트라 네임스페이스 (Prometheus 등)
    - to:
        - podSelector: {}

---
# 전체 모니터링 파드 → Kubernetes API 서버 접근 허용 (사이드카 ConfigMap 감시)
# kubectl patch networkpolicy allow-intra-namespace 으로 패치된 내용
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: monitoring
  labels:
    policy-type: baseline
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
  egress:
    # 인트라 네임스페이스 통신 (파드 간)
    - to:
        - podSelector: {}
    # Kubernetes API 서버 (ConfigMap 감시, sidecar)
    - to:
        - ipBlock:
            cidr: 10.43.0.1/32
      ports:
        - port: 443
          protocol: TCP
    # 호스트 노드 직접 접근 (kubelet, node-exporter)
    - to:
        - ipBlock:
            cidr: 172.18.120.97/32
      ports:
        - port: 6443
          protocol: TCP
        - port: 10250
          protocol: TCP
        - port: 9100
          protocol: TCP
