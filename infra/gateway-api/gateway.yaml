# Gateway API GatewayClass + Gateway
# Design Ref: MTU-N65.design.md §1
# Plan SC: FR-N65.1, FR-N65.2
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: traefik
  labels:
    app.kubernetes.io/part-of: saas-platform
spec:
  controllerName: traefik.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: saas-gateway
  namespace: saas
  labels:
    app.kubernetes.io/part-of: saas-platform
  annotations:
    cert-manager.io/cluster-issuer: saas-ca-issuer
spec:
  gatewayClassName: traefik
  listeners:
    # HTTP → HTTPS 리다이렉트
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    # HTTPS (TLS 종단)
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: api-gateway-tls-secret
            kind: Secret
      allowedRoutes:
        namespaces:
          from: Same
