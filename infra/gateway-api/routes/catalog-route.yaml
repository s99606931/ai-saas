# catalog-service HTTPRoute
# Design Ref: MTU-N65.design.md §1
# Plan SC: FR-N65.3
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: catalog-route
  namespace: saas
  labels:
    app.kubernetes.io/part-of: saas-platform
    app.kubernetes.io/component: catalog-service
spec:
  parentRefs:
    - name: saas-gateway
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/catalog
      backendRefs:
        - name: catalog-service
          port: 8080
      timeouts:
        request: 30s
        backendRequest: 25s
