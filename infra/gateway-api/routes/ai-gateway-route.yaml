# ai-gateway HTTPRoute
# Design Ref: MTU-N65.design.md §1
# Plan SC: FR-N65.3
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-gateway-route
  namespace: saas
  labels:
    app.kubernetes.io/part-of: saas-platform
    app.kubernetes.io/component: ai-gateway
spec:
  parentRefs:
    - name: saas-gateway
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/ai
      backendRefs:
        - name: ai-gateway
          port: 8080
      timeouts:
        request: 120s
        backendRequest: 115s
