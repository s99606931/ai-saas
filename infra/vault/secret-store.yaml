# External Secrets Operator -- Vault SecretStore
# Design Ref: MTU-N103 Design §아키텍처
# Plan SC: FR-N103.2

apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  labels:
    app.kubernetes.io/part-of: secret-rotation
    app.kubernetes.io/component: secret-store
spec:
  provider:
    vault:
      server: "http://vault.vault-system.svc:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets

---
# Vault Kubernetes Auth 설정 Job
apiVersion: batch/v1
kind: Job
metadata:
  name: vault-k8s-auth-config
  namespace: vault-system
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: config
          image: hashicorp/vault:1.17
          command:
            - /bin/sh
            - -c
            - |
              export VAULT_ADDR=http://vault.vault-system.svc:8200
              export VAULT_TOKEN=root

              # Kubernetes Auth 설정
              vault write auth/kubernetes/config \
                kubernetes_host="https://kubernetes.default.svc:443"

              # External Secrets 역할
              vault write auth/kubernetes/role/external-secrets \
                bound_service_account_names=external-secrets \
                bound_service_account_namespaces=external-secrets \
                policies=external-secrets-policy \
                ttl=1h

              # 정책 생성
              vault policy write external-secrets-policy - <<POLICY
              path "secret/data/*" {
                capabilities = ["read", "list"]
              }
              path "secret/metadata/*" {
                capabilities = ["read", "list"]
              }
              POLICY

              echo "Vault Kubernetes Auth 설정 완료"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
