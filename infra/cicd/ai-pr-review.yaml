# Gitea Actions — AI PR 코드 리뷰
# Design Ref: MTU-N77 §1.3
# Plan SC: FR-N77.2
# CSAP: D-12 (시스템 개발 보안)

name: AI PR Code Review

on:
  pull_request:
    types: [opened, synchronize]

env:
  LM_STUDIO_URL: http://host.docker.internal:1234/v1/chat/completions
  MAX_DIFF_LINES: 500

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff
        id: diff
        run: |
          # PR 변경 diff 추출 (마지막 500줄 제한)
          DIFF=$(git diff origin/${{ github.base_ref }}...HEAD -- '*.ts' '*.tsx' '*.js' '*.py' '*.go' '*.yaml' | head -${MAX_DIFF_LINES})
          
          # PII 마스킹
          MASKED_DIFF=$(echo "$DIFF" | bash infra/cicd/ai-security-filter.sh -)
          echo "diff<<ENDDIFF" >> $GITHUB_OUTPUT
          echo "$MASKED_DIFF" >> $GITHUB_OUTPUT
          echo "ENDDIFF" >> $GITHUB_OUTPUT

      - name: AI Code Review
        id: review
        run: |
          RESPONSE=$(curl -s --max-time 60 \
            "${LM_STUDIO_URL}" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "default",
              "messages": [
                {"role": "system", "content": "당신은 보안 및 코드 품질 리뷰 전문가입니다. CSAP 기준으로 한국어로 리뷰하세요.\n\n점검 항목:\n1. 보안 취약점 (OWASP Top 10, CSAP D-09)\n2. 코드 품질 (가독성, 유지보수성)\n3. 모범 사례 (에러 처리, 입력 검증)\n4. 성능 이슈\n\n각 항목별로 발견 사항과 개선 제안을 작성하세요."},
                {"role": "user", "content": "다음 코드 변경을 리뷰하세요:\n${{ steps.diff.outputs.diff }}"}
              ],
              "temperature": 0.3,
              "max_tokens": 2000
            }')
          
          REVIEW=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "AI 리뷰 실패"')
          echo "review<<ENDREVIEW" >> $GITHUB_OUTPUT
          echo "$REVIEW" >> $GITHUB_OUTPUT
          echo "ENDREVIEW" >> $GITHUB_OUTPUT

      - name: Comment PR Review
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## AI 코드 리뷰 (CSAP 기준)
              
              ${{ steps.review.outputs.review }}
              
              ---
              > 로컬 LM Studio 기반 자동 리뷰. N2SF O등급, PII 마스킹 적용.
              > CSAP D-12 시스템 개발 보안 점검.`
            })
