# Gitea Actions — AI 빌드 실패 자동 분석
# Design Ref: MTU-N77 §1
# Plan SC: FR-N77.1
# CSAP: D-06 (침해사고 관리), N2SF N-05 (AI 연동)

name: AI Build Failure Analysis

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]

env:
  LM_STUDIO_URL: http://host.docker.internal:1234/v1/chat/completions
  MAX_LOG_LINES: 200
  TIMEOUT: 30

jobs:
  analyze-failure:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect Build Logs
        id: logs
        run: |
          # 실패한 워크플로우의 로그 수집 (마지막 200줄)
          echo "빌드 로그 수집 중..."
          # Gitea API로 로그 가져오기
          LOGS=$(curl -s "${GITEA_URL}/api/v1/repos/${GITHUB_REPOSITORY}/actions/runs/${{ github.event.workflow_run.id }}/logs" \
            -H "Authorization: token ${GITEA_TOKEN}" | tail -${MAX_LOG_LINES})

          # PII 마스킹 적용
          MASKED_LOGS=$(echo "$LOGS" | bash infra/cicd/ai-security-filter.sh -)
          echo "masked_logs<<ENDLOGS" >> $GITHUB_OUTPUT
          echo "$MASKED_LOGS" >> $GITHUB_OUTPUT
          echo "ENDLOGS" >> $GITHUB_OUTPUT

      - name: AI Analysis
        id: analysis
        run: |
          RESPONSE=$(curl -s --max-time ${TIMEOUT} \
            "${LM_STUDIO_URL}" \
            -H "Content-Type: application/json" \
            -d '{
              "model": "default",
              "messages": [
                {"role": "system", "content": "당신은 CI/CD 빌드 실패 분석 전문가입니다. 한국어로 답변하세요. 원인, 해결 방법, 예방 조치를 제시하세요."},
                {"role": "user", "content": "다음 빌드 로그를 분석하세요:\n${{ steps.logs.outputs.masked_logs }}"}
              ],
              "temperature": 0.3,
              "max_tokens": 1000
            }')

          ANALYSIS=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // "AI 분석 실패"')
          echo "analysis<<ENDANALYSIS" >> $GITHUB_OUTPUT
          echo "$ANALYSIS" >> $GITHUB_OUTPUT
          echo "ENDANALYSIS" >> $GITHUB_OUTPUT

      - name: Comment on PR
        if: github.event.workflow_run.pull_requests[0]
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.payload.workflow_run.pull_requests[0].number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## AI 빌드 실패 분석

              ${{ steps.analysis.outputs.analysis }}

              ---
              > 이 분석은 로컬 LM Studio를 통해 자동 생성되었습니다.
              > N2SF O등급 데이터만 전송, PII 마스킹 적용됨.`
            })
