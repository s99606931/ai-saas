# Design Ref: MTU-N85 §아키텍처
# Plan SC: FR-N85.1, FR-N85.5
apiVersion: batch/v1
kind: CronJob
metadata:
  name: compliance-report-generator
  namespace: compliance-system
  labels:
    app.kubernetes.io/name: compliance-report
    app.kubernetes.io/component: generator
    csap.compliance/control: D-06
spec:
  schedule: "0 6 * * 1"  # 매주 월요일 06:00 UTC
  timeZone: "Asia/Seoul"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 4
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: compliance-report
        spec:
          serviceAccountName: compliance-report-gen
          restartPolicy: Never
          automountServiceAccountToken: true
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: generator
              image: harbor.saas-platform.local/tools/compliance-reporter:latest
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command:
                - /bin/sh
                - -c
                - |
                  set -euo pipefail
                  DATE=$(date +%Y-%m-%d)
                  REPORT_DIR="/reports/${DATE}"
                  mkdir -p "${REPORT_DIR}"

                  echo "=== CSAP 규정 준수 보고서 생성: ${DATE} ==="

                  # 1. Kyverno PolicyReport 수집
                  echo "[1/5] Kyverno 정책 보고서 수집..."
                  POLICY_PASS=$(kubectl get policyreports -A -o json 2>/dev/null | python3 -c "
                  import json, sys
                  data = json.load(sys.stdin)
                  total = sum(r.get('summary',{}).get('pass',0) for r in data.get('items',[]))
                  print(total)
                  " 2>/dev/null || echo "0")
                  POLICY_FAIL=$(kubectl get policyreports -A -o json 2>/dev/null | python3 -c "
                  import json, sys
                  data = json.load(sys.stdin)
                  total = sum(r.get('summary',{}).get('fail',0) for r in data.get('items',[]))
                  print(total)
                  " 2>/dev/null || echo "0")

                  # 2. 취약점 현황
                  echo "[2/5] 취약점 현황 수집..."
                  VULN_CRITICAL=$(kubectl get vulnerabilityreports -A -o json 2>/dev/null | python3 -c "
                  import json, sys
                  data = json.load(sys.stdin)
                  total = sum(r.get('report',{}).get('summary',{}).get('criticalCount',0) for r in data.get('items',[]))
                  print(total)
                  " 2>/dev/null || echo "0")

                  # 3. 증거 수집 현황
                  echo "[3/5] 증거 수집 현황 확인..."
                  EVIDENCE_COUNT=$(find /evidence -maxdepth 2 -name "manifest.json" 2>/dev/null | wc -l)

                  # 4. 드리프트 탐지
                  echo "[4/5] 규정 준수 드리프트 탐지..."
                  # (스냅샷 비교 로직)

                  # 5. 보고서 생성
                  echo "[5/5] 보고서 생성..."
                  cat > "${REPORT_DIR}/compliance-report.json" <<REPORT
                  {
                    "report_date": "${DATE}",
                    "generated_at": "$(date -Iseconds)",
                    "framework": "CSAP 중/상 등급",
                    "total_controls": 79,
                    "policy_compliance": {
                      "pass": ${POLICY_PASS},
                      "fail": ${POLICY_FAIL},
                      "rate": "계산중"
                    },
                    "vulnerabilities": {
                      "critical": ${VULN_CRITICAL}
                    },
                    "evidence_collections": ${EVIDENCE_COUNT},
                    "drift_detected": false,
                    "status": "generated"
                  }
                  REPORT

                  # Pushgateway로 메트릭 전송
                  cat <<METRICS | curl -sS --data-binary @- "${PUSHGATEWAY_URL}/metrics/job/compliance_report" 2>/dev/null || true
                  # HELP csap_compliance_rate CSAP 규정 준수율
                  # TYPE csap_compliance_rate gauge
                  csap_compliance_rate ${POLICY_PASS:-0}
                  # HELP csap_policy_failures CSAP 정책 위반 수
                  # TYPE csap_policy_failures gauge
                  csap_policy_failures ${POLICY_FAIL:-0}
                  # HELP csap_critical_vulnerabilities Critical 취약점 수
                  # TYPE csap_critical_vulnerabilities gauge
                  csap_critical_vulnerabilities ${VULN_CRITICAL:-0}
                  METRICS

                  echo "=== 보고서 생성 완료: ${REPORT_DIR}/compliance-report.json ==="
              env:
                - name: PUSHGATEWAY_URL
                  value: "http://prometheus-pushgateway.monitoring.svc:9091"
              volumeMounts:
                - name: reports
                  mountPath: /reports
                - name: evidence
                  mountPath: /evidence
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
          volumes:
            - name: reports
              persistentVolumeClaim:
                claimName: compliance-reports-storage
            - name: evidence
              persistentVolumeClaim:
                claimName: csap-evidence-storage
            - name: tmp
              emptyDir:
                sizeLimit: 100Mi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: compliance-report-gen
  namespace: compliance-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: compliance-report-gen
rules:
  - apiGroups: ["wgpolicyk8s.io"]
    resources: ["policyreports", "clusterpolicyreports"]
    verbs: ["get", "list"]
  - apiGroups: ["aquasecurity.github.io"]
    resources: ["vulnerabilityreports"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: compliance-report-gen
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: compliance-report-gen
subjects:
  - kind: ServiceAccount
    name: compliance-report-gen
    namespace: compliance-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: compliance-reports-storage
  namespace: compliance-system
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
