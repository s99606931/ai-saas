# =============================================================================
# Kyverno SLSA Provenance 검증 정책
# Design Ref: MTU-N46 Design §아키텍처
# Plan SC: FR-N46.6
#
# 배포 시 SLSA 빌드 증명 존재 및 서명 검증
# CSAP D-08 접근 통제 + D-12 시스템 개발 보안
# =============================================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-slsa-provenance
  labels:
    app.kubernetes.io/part-of: slsa-supply-chain
    csap.compliance/domain: "D-12"
    slsa.dev/level: "3"
  annotations:
    policies.kyverno.io/title: SLSA L3 빌드 증명 검증
    policies.kyverno.io/category: Supply Chain Security
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >
      프로덕션 환경에 배포되는 모든 컨테이너 이미지는
      SLSA Level 3 빌드 증명(Provenance)이 Cosign으로 서명되어 있어야 합니다.
      증명이 없거나 서명이 유효하지 않은 이미지는 배포가 차단됩니다.
spec:
  validationFailureAction: Enforce
  background: true
  webhookTimeoutSeconds: 30
  rules:
    # =========================================================================
    # 규칙 1: SLSA Provenance 증명 검증 (프로덕션)
    # =========================================================================
    - name: verify-slsa-provenance-prod
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - production
                - prod
      verifyImages:
        - imageReferences:
            - "harbor.local/*"
          attestations:
            - type: slsaprovenance
              attestors:
                - entries:
                    - keys:
                        publicKeys: |-
                          -----BEGIN PUBLIC KEY-----
                          # Cosign 공개키 (infra/cosign/cosign.pub)
                          # 실제 배포 시 키 내용으로 대체
                          -----END PUBLIC KEY-----
              conditions:
                - all:
                    # 빌드 타입 확인
                    - key: "{{ buildDefinition.buildType }}"
                      operator: Equals
                      value: "https://gitea-actions/v1"
                    # 빌더 ID 확인 (신뢰할 수 있는 빌드 서비스)
                    - key: "{{ runDetails.builder.id }}"
                      operator: Equals
                      value: "https://gitea.local/actions/runner"

    # =========================================================================
    # 규칙 2: SLSA Provenance 증명 검증 (스테이징 — Audit 모드)
    # =========================================================================
    - name: verify-slsa-provenance-stg
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - staging
                - stg
      verifyImages:
        - imageReferences:
            - "harbor.local/*"
          attestations:
            - type: slsaprovenance
              attestors:
                - entries:
                    - keys:
                        publicKeys: |-
                          -----BEGIN PUBLIC KEY-----
                          # Cosign 공개키
                          -----END PUBLIC KEY-----
          # 스테이징은 Audit 모드 (차단하지 않고 경고만)
          mutateDigest: true
          verifyDigest: true
          required: false

    # =========================================================================
    # 규칙 3: 이미지 소스 리포지토리 확인
    # =========================================================================
    - name: verify-source-repository
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - production
                - prod
      verifyImages:
        - imageReferences:
            - "harbor.local/*"
          attestations:
            - type: slsaprovenance
              attestors:
                - entries:
                    - keys:
                        publicKeys: |-
                          -----BEGIN PUBLIC KEY-----
                          # Cosign 공개키
                          -----END PUBLIC KEY-----
              conditions:
                - all:
                    # 소스가 공식 리포지토리에서 온 것인지 확인
                    - key: "{{ buildDefinition.externalParameters.repository }}"
                      operator: In
                      value:
                        - "saas/ai-saas"
                        - "saas/api-gateway"
                        - "saas/platform-portal"
