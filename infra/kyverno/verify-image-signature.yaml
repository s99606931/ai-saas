# Kyverno ClusterPolicy: Cosign 이미지 서명 검증
# Design Ref: MTU-N27 Design -- Kyverno 정책 설계
# Plan SC: FR-N27.4
# CSAP: D-05-03, D-08, D-12-08
#
# 초기 Audit 모드로 배포 → 검증 완료 후 Enforce 전환
# 적용 대상: saas-platform 네임스페이스의 모든 Pod
# 검증 대상: localhost:8080/public-saas/* 이미지

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signature
  annotations:
    policies.kyverno.io/title: "Cosign 이미지 서명 검증"
    policies.kyverno.io/category: "CSAP Supply Chain Security"
    policies.kyverno.io/severity: high
    policies.kyverno.io/subject: Pod
    policies.kyverno.io/description: >-
      CSAP D-05-03/D-12-08: Harbor 레지스트리에서 가져온 이미지는
      Cosign 서명이 검증된 경우에만 배포를 허용합니다.
      미서명 이미지 배포를 차단하여 공급망 공격을 방지합니다.
    csap.control: "D-05-03,D-12-08"
    n2sf.domain: "N-05"
spec:
  # 초기 Audit 모드: 위반 시 경고만 표시 (차단하지 않음)
  # 검증 완료 후 Enforce로 변경
  validationFailureAction: Audit
  background: true
  webhookTimeoutSeconds: 30
  rules:
    - name: verify-cosign-signature
      match:
        any:
          - resources:
              kinds:
                - Pod
              namespaces:
                - saas-platform
      verifyImages:
        - imageReferences:
            - "localhost:8080/public-saas/*"
          attestors:
            - entries:
                - keys:
                    publicKeys: |-
                      -----BEGIN PUBLIC KEY-----
                      MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEuUWmnKhe1cL9lESqKsqI3B5a2ZB2
                      2ZWQ8HuGYGPoMfUZ93MwVtq+/2PCKCaUYnTxlZGmQVzSrbpKadxiN6EHbA==
                      -----END PUBLIC KEY-----
                    signatureAlgorithm: sha256
          # 서명이 없는 이미지에 대한 메시지
          required: true
