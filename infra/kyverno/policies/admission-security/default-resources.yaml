# 리소스 기본값 자동 주입 정책 (Mutation)
# Design Ref: MTU-N75 §1.3
# Plan SC: FR-N75.3

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: default-resources
  labels:
    app.kubernetes.io/component: admission-security
    csap.compliance/control: D-12
  annotations:
    policies.kyverno.io/title: 리소스 기본값 자동 주입
    policies.kyverno.io/severity: low
spec:
  rules:
    - name: set-default-resources
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
                - monitoring
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - (name): "*"
                resources:
                  requests:
                    +(cpu): "50m"
                    +(memory): "64Mi"
                  limits:
                    +(cpu): "200m"
                    +(memory): "256Mi"
