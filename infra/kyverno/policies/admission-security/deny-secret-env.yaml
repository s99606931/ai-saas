# 시크릿 환경변수 직접 사용 금지 정책
# Design Ref: MTU-N75 §1.4
# Plan SC: FR-N75.4
# CSAP 매핑: D-09

apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: deny-secret-in-env
  labels:
    app.kubernetes.io/component: admission-security
    csap.compliance/control: D-09
  annotations:
    policies.kyverno.io/title: 환경변수에 시크릿 직접 삽입 금지
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      환경변수에 시크릿, 비밀번호, API 키 등을 직접 하드코딩하는 것을 금지합니다.
      Secret 리소스 참조(envFrom.secretRef 또는 valueFrom.secretKeyRef)를 사용해야 합니다.
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: deny-hardcoded-secrets
      match:
        any:
          - resources:
              kinds:
                - Pod
      exclude:
        any:
          - resources:
              namespaces:
                - kube-system
      validate:
        message: >-
          환경변수 이름에 SECRET, PASSWORD, API_KEY, TOKEN, CREDENTIAL이
          포함된 경우 직접 value를 설정할 수 없습니다.
          Secret 리소스의 secretKeyRef를 사용하십시오.
        foreach:
          - list: "request.object.spec.containers[]"
            deny:
              conditions:
                all:
                  - key: "{{ element.env[?contains(name, 'SECRET') || contains(name, 'PASSWORD') || contains(name, 'API_KEY') || contains(name, 'TOKEN') || contains(name, 'CREDENTIAL')].value | length(@) }}"
                    operator: GreaterThan
                    value: 0

---
# 감사 로깅 정책 — 모든 위반 PolicyReport 기록
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: admission-audit-log
  labels:
    app.kubernetes.io/component: admission-security
    csap.compliance/control: D-06
  annotations:
    policies.kyverno.io/title: Admission 정책 위반 감사 로깅
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: Audit
  background: true
  rules:
    - name: audit-all-deployments
      match:
        any:
          - resources:
              kinds:
                - Deployment
                - StatefulSet
                - DaemonSet
                - Pod
      validate:
        message: "Admission 감사 기록 — 배포 이벤트 추적"
        pattern:
          metadata:
            name: "?*"
