# 서비스 카탈로그 메타데이터 드리프트 감지
# Design Ref: MTU-N170.design.md §7
# Plan SC: FR-N170.5
# Backstage 카탈로그와 K8s 실제 배포 상태 비교
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: catalog-drift-detector
  namespace: backstage
  labels:
    app.kubernetes.io/part-of: saas-platform
    app.kubernetes.io/component: catalog-metadata
    mtu: N170
spec:
  schedule: "0 */6 * * *"  # 매 6시간마다 실행
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: catalog-drift-detector
        spec:
          serviceAccountName: catalog-drift-detector
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: detector
              image: bitnami/kubectl:1.30
              command:
                - /bin/sh
                - -c
                - |
                  echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] 카탈로그 드리프트 감지 시작"

                  DRIFT_COUNT=0
                  TOTAL_SERVICES=0
                  DRIFT_DETAILS=""

                  # Backstage 카탈로그에 등록된 서비스 목록 조회
                  # (ConfigMap에서 서비스 목록을 관리)
                  EXPECTED_SERVICES="auth-service api-gateway tenant-service audit-service ai-service catalog-service user-service notification-service file-service billing-service menu-service subscription-service security-monitor-service compliance-service"

                  for SVC in $EXPECTED_SERVICES; do
                    TOTAL_SERVICES=$((TOTAL_SERVICES + 1))

                    # K8s Deployment 존재 확인
                    DEPLOY_EXISTS=$(kubectl get deployment "$SVC" --all-namespaces -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)

                    if [ -z "$DEPLOY_EXISTS" ]; then
                      echo "  드리프트: $SVC — Deployment 미존재"
                      DRIFT_COUNT=$((DRIFT_COUNT + 1))
                      DRIFT_DETAILS="${DRIFT_DETAILS}${SVC}:deployment-missing,"
                      continue
                    fi

                    # 어노테이션 비교
                    NS=$(kubectl get deployment "$SVC" --all-namespaces -o jsonpath='{.items[0].metadata.namespace}' 2>/dev/null)

                    # data-classification 확인
                    K8S_CLASS=$(kubectl get deployment "$SVC" -n "$NS" -o jsonpath='{.metadata.annotations.saas\.local/data-classification}' 2>/dev/null)
                    if [ -z "$K8S_CLASS" ]; then
                      echo "  드리프트: $SVC — data-classification 어노테이션 누락"
                      DRIFT_COUNT=$((DRIFT_COUNT + 1))
                      DRIFT_DETAILS="${DRIFT_DETAILS}${SVC}:annotation-missing,"
                    fi

                    # tier 확인
                    K8S_TIER=$(kubectl get deployment "$SVC" -n "$NS" -o jsonpath='{.metadata.annotations.saas\.local/tier}' 2>/dev/null)
                    if [ -z "$K8S_TIER" ]; then
                      echo "  드리프트: $SVC — tier 어노테이션 누락"
                      DRIFT_COUNT=$((DRIFT_COUNT + 1))
                      DRIFT_DETAILS="${DRIFT_DETAILS}${SVC}:tier-missing,"
                    fi

                    # owner-team 확인
                    K8S_OWNER=$(kubectl get deployment "$SVC" -n "$NS" -o jsonpath='{.metadata.annotations.saas\.local/owner-team}' 2>/dev/null)
                    if [ -z "$K8S_OWNER" ]; then
                      echo "  드리프트: $SVC — owner-team 어노테이션 누락"
                      DRIFT_COUNT=$((DRIFT_COUNT + 1))
                      DRIFT_DETAILS="${DRIFT_DETAILS}${SVC}:owner-missing,"
                    fi
                  done

                  # 결과를 ConfigMap에 저장
                  kubectl create configmap catalog-drift-status \
                    --namespace=monitoring \
                    --from-literal=total-services="$TOTAL_SERVICES" \
                    --from-literal=drift-count="$DRIFT_COUNT" \
                    --from-literal=drift-details="$DRIFT_DETAILS" \
                    --from-literal=last-checked="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                    --from-literal=compliance-rate="$(( (TOTAL_SERVICES - DRIFT_COUNT) * 100 / TOTAL_SERVICES ))%" \
                    --dry-run=client -o yaml | kubectl apply -f -

                  echo ""
                  echo "결과: 전체=$TOTAL_SERVICES, 드리프트=$DRIFT_COUNT"
                  echo "준수율: $(( (TOTAL_SERVICES - DRIFT_COUNT) * 100 / TOTAL_SERVICES ))%"
                  echo "[$(date -u +%Y-%m-%dT%H:%M:%SZ)] 드리프트 감지 완료"

                  # 드리프트 발견 시 종료 코드 1 (알림 트리거)
                  if [ "$DRIFT_COUNT" -gt 0 ]; then
                    echo "경고: $DRIFT_COUNT건의 드리프트 발견"
                    exit 1
                  fi
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 50m
                  memory: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: catalog-drift-detector
  namespace: backstage
  labels:
    app.kubernetes.io/part-of: saas-platform
    mtu: N170

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: catalog-drift-detector
  labels:
    app.kubernetes.io/part-of: saas-platform
    mtu: N170
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "create", "update", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: catalog-drift-detector
  labels:
    app.kubernetes.io/part-of: saas-platform
    mtu: N170
subjects:
  - kind: ServiceAccount
    name: catalog-drift-detector
    namespace: backstage
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: catalog-drift-detector
