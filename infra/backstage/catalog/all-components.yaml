# Backstage Software Catalog -- 전체 컴포넌트 등록
# Design Ref: MTU-N100 Design §Software Catalog
# Plan SC: FR-N100.2

---
# System: 코어 플랫폼
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: core-platform
  description: "공공기관 SaaS 코어 플랫폼"
  annotations:
    backstage.io/techdocs-ref: dir:.
  tags:
    - saas
    - public-sector
spec:
  owner: platform-team

---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: ai-platform
  description: "AI/LLM 연동 플랫폼"
spec:
  owner: ai-team

---
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: compliance-system
  description: "CSAP/N2SF/ISMS-P 준수 시스템"
spec:
  owner: security-team

---
# Components: 마이크로서비스
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: auth-service
  description: "인증/인가 서비스 (JWT + RBAC + MFA)"
  tags:
    - nestjs
    - auth
    - csap-d08
  annotations:
    backstage.io/kubernetes-id: auth-service
    backstage.io/techdocs-ref: dir:.
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: core-platform
  providesApis:
    - auth-api
  dependsOn:
    - resource:auth-postgresql

---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: api-gateway
  description: "API 게이트웨이 (Rate Limit + RBAC + 감사 로그)"
  tags:
    - nestjs
    - gateway
  annotations:
    backstage.io/kubernetes-id: api-gateway
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: core-platform
  providesApis:
    - gateway-api
  consumesApis:
    - auth-api

