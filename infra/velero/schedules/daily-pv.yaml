# Velero Schedule: 일간 PV 데이터 백업
# Design Ref: MTU-N55 Section 3.2
# Plan SC: FR-N55.5
# CSAP: D-09 암호화
apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-pv
  namespace: velero
spec:
  schedule: "0 4 * * *"              # 매일 04:00
  useOwnerReferencesInBackup: false
  template:
    includedNamespaces:
      - saas
    includedResources:
      - persistentvolumeclaims
      - persistentvolumes
    ttl: 336h                         # 14일 보존
    storageLocation: default
    defaultVolumesToFsBackup: true
    snapshotVolumes: false
    metadata:
      labels:
        schedule-type: daily
        backup-scope: pv-data
