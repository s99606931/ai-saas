          echo "  Sign:        ${{ needs.sign-images.result || 'skipped' }}"
          echo "  Deploy:      ${{ needs.deploy.result || 'skipped' }}"
          echo "  Verify:      ${{ needs.verify.result || 'skipped' }}"
          echo "  Time:        $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "================================================================"
