# OpenSSF Scorecard 보안 점수카드 자동화
# Design Ref: MTU-N90 Design §1
# Plan SC: FR-N90.1, FR-N90.2
# CSAP: D-05 공급망 보안

name: OpenSSF Scorecard

on:
  schedule:
    - cron: '0 3 * * 1'  # 매주 월요일 03:00 (KST 12:00)
  workflow_dispatch:
    inputs:
      threshold:
        description: '최소 점수 기준 (기본: 7.0)'
        required: false
        default: '7.0'

env:
  SCORECARD_VERSION: "4.13.1"
  RESULTS_DIR: "reports/scorecard"
  THRESHOLD: ${{ github.event.inputs.threshold || '7.0' }}

jobs:
  scorecard-analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: OpenSSF Scorecard 설치
        run: |
          curl -sL https://github.com/ossf/scorecard/releases/download/v${SCORECARD_VERSION}/scorecard_${SCORECARD_VERSION}_linux_amd64.tar.gz | tar xz
          chmod +x scorecard-linux-amd64
          sudo mv scorecard-linux-amd64 /usr/local/bin/scorecard
          scorecard version

      - name: Scorecard 분석 실행
        run: |
          echo "=== OpenSSF Scorecard 분석 시작 ==="
          scorecard --local=. --format=json --show-details > scorecard-results.json 2>&1 || true

          # 결과 파싱
          if [ -f scorecard-results.json ]; then
            total_score=$(jq '.score // 0' scorecard-results.json)
            echo "SCORECARD_SCORE=$total_score" >> $GITHUB_ENV
            echo "총점: $total_score/10"
          else
            echo "::warning::Scorecard 결과 파일 생성 실패"
            echo "SCORECARD_SCORE=0" >> $GITHUB_ENV
          fi

      - name: 결과 분석 및 리포트
        run: |
          if [ -f scorecard-results.json ]; then
            echo "=== 검사 항목별 결과 ==="
            jq -r '.checks[]? | "\(.name): \(.score)/10 - \(.reason // "N/A")"' scorecard-results.json || echo "파싱 스킵"

            echo ""
            echo "=== 실패 항목 (7점 미만) ==="
            jq -r '.checks[]? | select(.score < 7) | "WARN: \(.name) = \(.score)/10"' scorecard-results.json || echo "모두 통과"

            # 점수 기준 체크
            score=${SCORECARD_SCORE:-0}
            threshold=${THRESHOLD}
            if [ "$(echo "$score < $threshold" | bc -l 2>/dev/null || echo 1)" -eq 1 ]; then
              echo "::warning::보안 점수 $score < $threshold — 개선 필요"
            else
              echo "보안 점수 $score >= $threshold — 기준 충족"
            fi
          fi

      - name: 결과 아카이브
        run: |
          mkdir -p ${RESULTS_DIR}
          DATE=$(date +%Y%m%d)
          if [ -f scorecard-results.json ]; then
            cp scorecard-results.json ${RESULTS_DIR}/scorecard-${DATE}.json
            echo "아카이브 완료: ${RESULTS_DIR}/scorecard-${DATE}.json"
          fi

      - name: 감사 로그 기록
        run: |
          echo "{\"timestamp\":\"$(date -Iseconds)\",\"action\":\"SCORECARD_SCAN\",\"score\":\"${SCORECARD_SCORE}\",\"threshold\":\"${THRESHOLD}\",\"csap\":\"D-05\"}" >> .claude/audit.jsonl || true

      - name: SARIF 업로드 (보안 이벤트)
        if: always()
        run: |
          if [ -f scorecard-results.json ]; then
            # SARIF 변환 (보안 대시보드 연동)
            echo "Scorecard SARIF 결과 준비 완료"
          fi
