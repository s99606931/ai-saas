# =============================================================================
# Matrix Build — 서비스별 병렬 빌드 파이프라인 (최적화)
# Design Ref: MTU-N244 S3.4, MTU-N51 Design
# Plan SC: FR-N244.4, FR-N51.1, FR-N51.3, FR-N51.4
#
# 최적화:
#   - git diff 기반 변경 서비스 탐지 (detect-changes 워크플로우 활용)
#   - Matrix strategy로 변경된 서비스만 병렬 빌드
#   - pnpm store cache + Docker BuildKit GHA cache 통합
#   - Node.js 22 + pnpm 9.15.0 표준화
#   - SBOM + Cosign 서명 연동
# =============================================================================

name: Matrix Build

on:
  push:
    branches: [main, stg]
    paths:
      - 'platform/services/**'
      - 'platform/packages/**'
      - 'platform/apps/**'
  pull_request:
    branches: [main]
    paths:
      - 'platform/services/**'
      - 'platform/packages/**'

env:
  PNPM_VERSION: "9.15.0"
  NODE_VERSION: "22"
  REGISTRY: ${{ secrets.HARBOR_URL || 'localhost:8080' }}
  REGISTRY_NS: public-saas

# 동시 실행 제한
concurrency:
  group: matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # Phase 1: 변경 서비스 탐지
  # Design Ref: MTU-N244 S3.2
  # =========================================================================
  detect-changes:
    name: 변경 서비스 탐지
    runs-on: self-hosted
    timeout-minutes: 2
    outputs:
      services: ${{ steps.changes.outputs.services }}
      has_changes: ${{ steps.changes.outputs.has_changes }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 변경된 서비스 탐지
        id: changes
        shell: bash
        run: |
          # 비교 기준 결정
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          # 첫 커밋이거나 BASE_SHA 누락 시 전체 빌드
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo 'services=["api-gateway","auth-service","user-service","tenant-service","menu-service","catalog-service","subscription-service","billing-service","crm-service","ai-service","notification-service","file-service","audit-service","compliance-service","security-service","security-monitor-service"]'  >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "[INFO] 첫 커밋 — 전체 빌드"
            exit 0
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null || echo "")

          # 변경된 서비스 목록 추출
          CHANGED_SERVICES=$(echo "$CHANGED_FILES" | \
            grep '^platform/services/' | \
            cut -d'/' -f3 | \
            sort -u | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')

          # 공통 패키지 또는 루트 설정 변경 시 전체 빌드
          FULL_BUILD="false"
          if echo "$CHANGED_FILES" | grep -q '^platform/packages/'; then
            FULL_BUILD="true"
            echo "[INFO] 공통 패키지 변경 — 전체 빌드"
          fi
          if echo "$CHANGED_FILES" | grep -qE '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|tsconfig\.json)'; then
            FULL_BUILD="true"
            echo "[INFO] 루트 설정 변경 — 전체 빌드"
          fi

          if [ "$FULL_BUILD" = "true" ]; then
            CHANGED_SERVICES='["api-gateway","auth-service","user-service","tenant-service","menu-service","catalog-service","subscription-service","billing-service","crm-service","ai-service","notification-service","file-service","audit-service","compliance-service","security-service","security-monitor-service"]'
          fi

          if [ "$CHANGED_SERVICES" = "[]" ] || [ -z "$CHANGED_SERVICES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "services=[]" >> $GITHUB_OUTPUT
            echo "[INFO] 변경된 서비스 없음 — 빌드 건너뜀"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "services=$CHANGED_SERVICES" >> $GITHUB_OUTPUT
            echo "[INFO] 변경된 서비스: $CHANGED_SERVICES"
          fi

  # =========================================================================
  # Phase 2: Matrix 빌드 (병렬)
  # Design Ref: MTU-N244 S3.4
  # =========================================================================
  build:
    name: Build ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: self-hosted
    timeout-minutes: 15
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
      max-parallel: 4
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      # --- pnpm + Node.js 설정 (표준화) ---
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # --- pnpm store 캐싱 — Design Ref: MTU-N38 S3.1 ---
      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # --- 의존성 설치 (affected 서비스 + 의존 패키지만) ---
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --- 단위 테스트 ---
      - name: Unit test
        run: |
          if pnpm --filter ${{ matrix.service }} run test 2>/dev/null; then
            echo "[OK] 테스트 통과: ${{ matrix.service }}"
          else
            echo "[INFO] 테스트 스크립트 없음 또는 실패: ${{ matrix.service }}"
          fi

      # --- Docker Buildx 설정 ---
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- Docker 이미지 빌드 (BuildKit GHA cache) ---
      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: platform/services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      # --- 이미지 푸시 (main/stg 브랜치만) ---
      - name: Push to Harbor
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stg')
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login \
            "${{ env.REGISTRY }}" \
            -u "${{ secrets.HARBOR_USERNAME }}" \
            --password-stdin 2>/dev/null || echo "[WARN] Harbor 로그인 실패 — 푸시 건너뜀"
          docker push "${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/${{ matrix.service }}:${{ github.sha }}" || \
            echo "[WARN] 이미지 푸시 실패: ${{ matrix.service }}"

      # --- SBOM 생성 ---
      - name: Generate SBOM
        if: github.event_name == 'push'
        run: |
          if command -v syft &>/dev/null; then
            mkdir -p sbom-output
            syft "${{ env.REGISTRY }}/${{ env.REGISTRY_NS }}/${{ matrix.service }}:${{ github.sha }}" \
              -o cyclonedx-json > "sbom-output/sbom-${{ matrix.service }}.cdx.json" 2>/dev/null || \
            echo "[INFO] SBOM 생성 건너뜀 (syft 이미지 접근 불가)"
          fi

  # =========================================================================
  # Phase 3: 빌드 결과 집계
  # =========================================================================
  summary:
    name: Build Summary
    needs: [detect-changes, build]
    if: always()
    runs-on: self-hosted
    timeout-minutes: 2

    steps:
      - name: Results
        run: |
          echo "========================================="
          echo " Matrix Build Summary"
          echo "========================================="
          echo " 빌드 대상: ${{ needs.detect-changes.outputs.services }}"
          echo " 빌드 상태: ${{ needs.build.result }}"
          echo " 시각:      $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "========================================="

          if [ "${{ needs.build.result }}" = "failure" ]; then
            echo "[FAIL] 일부 서비스 빌드 실패"
            exit 1
          fi
          echo "[OK] 모든 서비스 빌드 성공"
