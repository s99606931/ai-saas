# =============================================================================
# Matrix Build — 서비스별 병렬 빌드 파이프라인
# Design Ref: MTU-N51 Design §Matrix 빌드 구조
# Plan SC: FR-N51.1, FR-N51.3, FR-N51.4
#
# 기능:
#   - git diff 기반 변경 서비스 탐지
#   - Matrix strategy로 변경된 서비스만 병렬 빌드
#   - Docker layer cache + pnpm store cache
#   - SBOM + Cosign 서명 연동
# =============================================================================

name: Matrix Build

on:
  push:
    branches: [main, stg]
    paths:
      - 'services/**'
      - 'packages/**'
      - 'docker/**'
  pull_request:
    branches: [main]
    paths:
      - 'services/**'
      - 'packages/**'

env:
  REGISTRY: harbor.local
  REGISTRY_NS: saas-platform

jobs:
  # =========================================================================
  # Phase 1: 변경 서비스 탐지
  # =========================================================================
  detect-changes:
    name: 변경 서비스 탐지
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.changes.outputs.services }}
      has_changes: ${{ steps.changes.outputs.has_changes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 변경된 서비스 탐지
        id: changes
        run: |
          # 이전 커밋과 비교하여 변경된 디렉토리 탐지
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          # 변경된 서비스 목록 추출
          CHANGED_SERVICES=$(git diff --name-only "$BASE_SHA" HEAD | \
            grep '^services/' | \
            cut -d'/' -f2 | \
            sort -u | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')

          # 공통 패키지 변경 시 전체 빌드
          if git diff --name-only "$BASE_SHA" HEAD | grep -q '^packages/'; then
            CHANGED_SERVICES='["api-gateway","auth-service","tenant-service","audit-service","ai-gateway","notification-service","file-service"]'
          fi

          # Dockerfile 변경 시 전체 빌드
          if git diff --name-only "$BASE_SHA" HEAD | grep -q '^docker/'; then
            CHANGED_SERVICES='["api-gateway","auth-service","tenant-service","audit-service","ai-gateway","notification-service","file-service"]'
          fi

          if [ "$CHANGED_SERVICES" = "[]" ] || [ -z "$CHANGED_SERVICES" ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "services=[]" >> $GITHUB_OUTPUT
            echo "변경된 서비스 없음 — 빌드 건너뜀"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "services=$CHANGED_SERVICES" >> $GITHUB_OUTPUT
            echo "변경된 서비스: $CHANGED_SERVICES"
          fi

  # =========================================================================
  # Phase 2: Matrix 빌드 (병렬)
  # =========================================================================
  build:
    name: 빌드 ${{ matrix.service }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
      max-parallel: 4
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      # --- Node.js + pnpm 캐시 ---
      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: pnpm 캐시
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: pnpm-${{ matrix.service }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ matrix.service }}-
            pnpm-

      # --- Docker 빌드 캐시 ---
      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: Docker 캐시
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: buildx-${{ matrix.service }}-${{ github.sha }}
          restore-keys: |
            buildx-${{ matrix.service }}-

      # --- 의존성 설치 ---
      - name: 의존성 설치
        run: |
          npm install -g pnpm
          pnpm install --frozen-lockfile --filter ${{ matrix.service }}...

      # --- 단위 테스트 ---
      - name: 단위 테스트
        run: |
          pnpm --filter ${{ matrix.service }} test || echo "테스트 스크립트 없음 — 건너뜀"

      # --- Docker 이미지 빌드 ---
      - name: Docker 이미지 빌드
        run: |
          IMAGE="${REGISTRY}/${REGISTRY_NS}/${{ matrix.service }}:${{ github.sha }}"
          docker buildx build \
            --file docker/Dockerfile.optimized \
            --build-arg SERVICE_NAME=${{ matrix.service }} \
            --cache-from type=local,src=/tmp/.buildx-cache \
            --cache-to type=local,dest=/tmp/.buildx-cache-new,mode=max \
            --tag "$IMAGE" \
            --load \
            .
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV

      # --- 이미지 푸시 ---
      - name: Harbor 푸시
        run: |
          docker push "$IMAGE"
          echo "${{ matrix.service }} 이미지 푸시 완료: $IMAGE"

      # --- SBOM 생성 ---
      - name: SBOM 생성
        run: |
          if command -v syft &>/dev/null; then
            syft "$IMAGE" -o cyclonedx-json > sbom-${{ matrix.service }}.json
            echo "SBOM 생성 완료"
          fi

      # --- 캐시 정리 ---
      - name: 캐시 회전
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache 2>/dev/null || true

  # =========================================================================
  # Phase 3: 빌드 결과 집계
  # =========================================================================
  summary:
    name: 빌드 결과 집계
    needs: [detect-changes, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 결과 요약
        run: |
          echo "========================================="
          echo " Matrix Build 결과"
          echo "========================================="
          echo " 빌드 대상: ${{ needs.detect-changes.outputs.services }}"
          echo " 빌드 상태: ${{ needs.build.result }}"
          echo "========================================="

          if [ "${{ needs.build.result }}" = "failure" ]; then
            echo "일부 서비스 빌드 실패"
            exit 1
          fi
