# E2E 릴리스 파이프라인 v2 — SLO 기반 롤백
# Design Ref: MTU-N118
# Plan SC: FR-N118.1
# CSAP: D-05 공급망 보안, D-12 개발 보안
---
name: Release Pipeline v2

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '릴리스 버전 (예: v1.3.0)'
        required: true
      environment:
        description: '배포 환경'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: harbor.saas.local
  IMAGE_PREFIX: saas
  COSIGN_EXPERIMENTAL: "1"

jobs:
  # 단계 1: 빌드 및 테스트
  build-test:
    name: 빌드 및 테스트
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 버전 결정
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: 단위 테스트
        run: npm run test:unit --if-present

      - name: 통합 테스트
        run: npm run test:integration --if-present

      - name: 린트 검사
        run: npm run lint --if-present

      - name: SonarQube 품질 게이트
        run: |
          echo "[INFO] SonarQube 품질 게이트 검증"
          # sonar-scanner 실행 (SonarQube 서버 연동)

  # 단계 2: 보안 스캔
  security-scan:
    name: 보안 스캔
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Trivy 취약점 스캔
        run: |
          trivy fs --severity HIGH,CRITICAL --exit-code 1 .

      - name: Semgrep SAST 스캔
        run: |
          semgrep scan --config auto --error

      - name: OpenSSF Scorecard 확인
        run: |
          bash scripts/scorecard-gate.sh || true

  # 단계 3: 이미지 빌드 및 서명
  image-build-sign:
    name: 이미지 빌드 및 서명
    needs: [build-test, security-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker 이미지 빌드
        run: |
          VERSION="${{ needs.build-test.outputs.version }}"
          docker build -t ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/app:${VERSION} .

      - name: Harbor 레지스트리 푸시
        run: |
          VERSION="${{ needs.build-test.outputs.version }}"
          docker push ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/app:${VERSION}

      - name: Cosign 이미지 서명
        run: |
          VERSION="${{ needs.build-test.outputs.version }}"
          cosign sign --key env://COSIGN_PRIVATE_KEY \
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/app:${VERSION}

      - name: SBOM 생성 (Syft)
        run: |
          VERSION="${{ needs.build-test.outputs.version }}"
          syft packages ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/app:${VERSION} -o spdx-json > sbom.spdx.json

  # 단계 4: 프로덕션 준비 체크리스트
  production-readiness:
    name: 프로덕션 준비 체크리스트
    needs: image-build-sign
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 프로덕션 준비 검증
        run: |
          bash scripts/production-readiness-check.sh

  # 단계 5: 스테이징 배포
  deploy-staging:
    name: 스테이징 배포
    needs: production-readiness
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Flux 이미지 업데이트
        run: |
          VERSION="${{ needs.build-test.outputs.version }}"
          echo "[INFO] Flux ImagePolicy 업데이트: ${VERSION}"

      - name: 스모크 테스트
        run: |
          echo "[INFO] 스테이징 환경 스모크 테스트 실행"

  # 단계 6: SLO 검증 후 프로덕션 배포
  deploy-production:
    name: 프로덕션 배포
    needs: deploy-staging
    if: inputs.environment == 'production' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: SLO 상태 확인
        run: |
          echo "[INFO] 현재 SLO 에러 버짓 확인"
          # SLO 에러 버짓이 충분한지 확인

      - name: Argo Rollouts 프로덕션 배포
        run: |
          VERSION="${{ needs.build-test.outputs.version }}"
          echo "[INFO] Argo Rollouts 카나리 배포 시작: ${VERSION}"

      - name: SLO 기반 롤백 모니터링
        run: |
          echo "[INFO] SLO 위반 감지 시 자동 롤백 트리거 활성화"

  # 단계 7: 릴리스 노트 생성
  release-notes:
    name: 릴리스 노트 생성
    needs: deploy-production
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 릴리스 노트 자동 생성
        run: |
          bash scripts/generate-release-notes.sh "${{ needs.build-test.outputs.version }}"

      - name: 감사 로그 기록
        run: |
          echo "{\"timestamp\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"action\":\"release\",\"version\":\"${{ needs.build-test.outputs.version }}\",\"csap\":\"D-05,D-12\"}" >> .claude/audit.jsonl
