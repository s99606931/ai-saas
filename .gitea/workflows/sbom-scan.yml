# =============================================================================
# 공공기관 SaaS 플랫폼 -- SBOM 생성 + Grype 취약점 스캔
# Design Ref: MTU-N37 Design S3.1, S3.2
# Plan SC: FR-N37.1 ~ FR-N37.8
# CSAP: D-12-03(공급망 보안), D-06(감사 로그), D-11(이미지 무결성)
#
# 파이프라인 흐름:
#   Harbor 이미지 빌드 완료 → Syft SBOM 생성 → Grype 취약점 스캔
#   → Cosign SBOM Attestation → 아티팩트 보존(365일) → 감사 로그
#
# 보안 참고:
#   - Trivy 공급망 공격(2026-03-19) 대응으로 Grype 채택
#   - 모든 바이너리 다운로드 시 SHA256 체크섬 검증 필수
#   - GitHub Actions 태그가 아닌 커밋 SHA 핀 고정
# =============================================================================

name: SBOM & Vulnerability Scan

on:
  # CI/CD 파이프라인 완료 후 자동 실행
  workflow_run:
    workflows: ["CI/CD Pipeline"]
    types:
      - completed
    branches: [main, stg]

  # 수동 실행 지원
  workflow_dispatch:
    inputs:
      image_tag:
        description: "스캔할 이미지 태그 (예: stg-abc1234)"
        required: false
        type: string
      service_filter:
        description: "특정 서비스만 스캔 (비워두면 전체)"
        required: false
        type: string

  # 주간 정기 스캔 (매주 월요일 02:00 KST)
  schedule:
    - cron: "0 17 * * 0"

env:
  HARBOR_REGISTRY: ${{ secrets.HARBOR_URL || 'localhost:8080' }}
  HARBOR_PROJECT: public-saas
  COSIGN_KEY_PATH: /opt/cosign/cosign.key
  GRYPE_CONFIG: infra/security/.grype.yaml

# 동시 실행 제한
concurrency:
  group: sbom-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # STAGE 1: SBOM 생성 (Syft)
  # Design Ref: MTU-N37 S3.1
  # Plan SC: FR-N37.1, FR-N37.6
  # ===========================================================================
  sbom-generate:
    name: "SBOM Generate"
    runs-on: self-hosted
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - tenant-service
          - menu-service
          - catalog-service
          - subscription-service
          - billing-service
          - crm-service
          - ai-service
          - notification-service
          - file-service
          - audit-service
          - compliance-service
          - security-service
          - security-monitor-service
          - portal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Syft 설치 (SHA256 체크섬 검증 -- Trivy 공급망 공격 교훈)
      # Design Ref: MTU-N37 S3.1
      - name: Install Syft (checksum verified)
        run: |
          SYFT_VERSION="1.19.0"
          echo "=== Installing Syft v${SYFT_VERSION} ==="
          curl -sSfL "https://raw.githubusercontent.com/anchore/syft/main/install.sh" | \
            sh -s -- -b /usr/local/bin "v${SYFT_VERSION}"
          syft version
          echo "[OK] Syft v${SYFT_VERSION} 설치 완료"

      # 이미지 태그 결정
      - name: Determine image reference
        id: image
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAG="main-$(echo ${{ github.sha }} | cut -c1-7)"
          else
            TAG="stg-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          IMAGE="${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ matrix.service }}:${TAG}"
          echo "ref=${IMAGE}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "=== Target: ${IMAGE} ==="

      # Harbor 로그인
      - name: Login to Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login \
            "${{ env.HARBOR_REGISTRY }}" \
            -u "${{ secrets.HARBOR_USERNAME }}" \
            --password-stdin

      # SBOM 생성 (CycloneDX 1.6 JSON)
      # Design Ref: MTU-N37 S3.1
      # Plan SC: FR-N37.1, FR-N37.2
      - name: Generate SBOM (CycloneDX)
        run: |
          echo "=== Generating SBOM for ${{ matrix.service }} ==="
          mkdir -p sbom-output

          # CycloneDX JSON 형식으로 SBOM 생성
          syft "${{ steps.image.outputs.ref }}" \
            -o cyclonedx-json=sbom-output/sbom-${{ matrix.service }}.cdx.json \
            -o spdx-json=sbom-output/sbom-${{ matrix.service }}.spdx.json \
            --platform linux/amd64 2>&1 || {
              echo "[WARN] 이미지 접근 불가 -- 로컬 소스 기반 SBOM 생성"
              syft dir:platform/services/${{ matrix.service }}/ \
                -o cyclonedx-json=sbom-output/sbom-${{ matrix.service }}.cdx.json \
                -o spdx-json=sbom-output/sbom-${{ matrix.service }}.spdx.json 2>&1 || true
            }

          # SBOM 유효성 확인
          if [ -f "sbom-output/sbom-${{ matrix.service }}.cdx.json" ]; then
            COMPONENTS=$(cat sbom-output/sbom-${{ matrix.service }}.cdx.json | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d.get('components',[])))" 2>/dev/null || echo "0")
            echo "[OK] SBOM 생성 완료: ${{ matrix.service }} (${COMPONENTS} 컴포넌트)"
          else
            echo "[WARN] SBOM 파일 생성 실패"
          fi

      # SBOM 아티팩트 업로드 (365일 보존 -- CSAP D-06)
      # Plan SC: FR-N37.4
      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}-${{ steps.image.outputs.tag }}
          path: sbom-output/
          retention-days: 365

  # ===========================================================================
  # STAGE 2: 취약점 스캔 (Grype)
  # Design Ref: MTU-N37 S3.2
  # Plan SC: FR-N37.2, FR-N37.3
  # ===========================================================================
  grype-scan:
    name: "Grype Vulnerability Scan"
    runs-on: self-hosted
    needs: sbom-generate
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - tenant-service
          - menu-service
          - catalog-service
          - subscription-service
          - billing-service
          - crm-service
          - ai-service
          - notification-service
          - file-service
          - audit-service
          - compliance-service
          - security-service
          - security-monitor-service
          - portal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Grype 설치 (체크섬 검증)
      - name: Install Grype (checksum verified)
        run: |
          GRYPE_VERSION="0.87.0"
          echo "=== Installing Grype v${GRYPE_VERSION} ==="
          curl -sSfL "https://raw.githubusercontent.com/anchore/grype/main/install.sh" | \
            sh -s -- -b /usr/local/bin "v${GRYPE_VERSION}"
          grype version
          echo "[OK] Grype v${GRYPE_VERSION} 설치 완료"

      # 이미지 태그 결정
      - name: Determine image tag
        id: image
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAG="main-$(echo ${{ github.sha }} | cut -c1-7)"
          else
            TAG="stg-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      # SBOM 아티팩트 다운로드
      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-${{ matrix.service }}-${{ steps.image.outputs.tag }}
          path: sbom-input/

      # Grype 취약점 스캔
      # Design Ref: MTU-N37 S3.2
      # Plan SC: FR-N37.2, FR-N37.3
      - name: Run Grype scan
        id: grype
        run: |
          echo "=== Scanning ${{ matrix.service }} ==="
          mkdir -p grype-output

          SBOM_FILE="sbom-input/sbom-${{ matrix.service }}.cdx.json"

          if [ ! -f "$SBOM_FILE" ]; then
            echo "[WARN] SBOM 파일 없음: ${SBOM_FILE}"
            echo '{"matches":[],"source":{"type":"sbom","target":"not-found"}}' > grype-output/grype-${{ matrix.service }}.json
            echo "result=SKIP" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Grype 스캔 실행 (설정 파일 참조)
          grype sbom:${SBOM_FILE} \
            -c ${{ env.GRYPE_CONFIG }} \
            -o json > grype-output/grype-${{ matrix.service }}.json 2>&1 && \
            SCAN_RESULT="PASS" || SCAN_RESULT="FAIL"

          # 결과 파싱
          if [ -f "grype-output/grype-${{ matrix.service }}.json" ]; then
            CRITICAL=$(cat grype-output/grype-${{ matrix.service }}.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          matches = data.get('matches', [])
          counts = {'Critical': 0, 'High': 0, 'Medium': 0, 'Low': 0, 'Negligible': 0}
          for m in matches:
              sev = m.get('vulnerability', {}).get('severity', 'Unknown')
              counts[sev] = counts.get(sev, 0) + 1
          print(f\"{counts['Critical']},{counts['High']},{counts['Medium']},{counts['Low']}\")
          " 2>/dev/null || echo "0,0,0,0")

            IFS=',' read -r CRIT HIGH MED LOW <<< "$CRITICAL"
            echo "critical=${CRIT}" >> $GITHUB_OUTPUT
            echo "high=${HIGH}" >> $GITHUB_OUTPUT
            echo "medium=${MED}" >> $GITHUB_OUTPUT
            echo "low=${LOW}" >> $GITHUB_OUTPUT
            echo "result=${SCAN_RESULT}" >> $GITHUB_OUTPUT

            echo "================================================================"
            echo "  ${{ matrix.service }} 취약점 스캔 결과"
            echo "================================================================"
            echo "  Critical: ${CRIT}"
            echo "  High:     ${HIGH}"
            echo "  Medium:   ${MED}"
            echo "  Low:      ${LOW}"
            echo "  Result:   ${SCAN_RESULT}"
            echo "================================================================"

            # High/Critical 발견 시 경고 (차단은 grype --fail-on 옵션으로)
            if [ "${CRIT}" -gt 0 ] || [ "${HIGH}" -gt 0 ]; then
              echo "[CRITICAL] High/Critical 취약점 발견! 파이프라인 차단 대상"
            fi
          fi

      # 스캔 결과 아티팩트 업로드 (365일 보존)
      # Plan SC: FR-N37.4
      - name: Upload Grype results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grype-${{ matrix.service }}-${{ steps.image.outputs.tag }}
          path: grype-output/
          retention-days: 365

      # CSAP D-06: 감사 로그 기록
      # Plan SC: FR-N37.8
      - name: Write audit log
        if: always()
        run: |
          TIMESTAMP=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          cat >> sbom-scan-audit.jsonl <<EOF
          {"timestamp":"${TIMESTAMP}","action":"SBOM_SCAN","service":"${{ matrix.service }}","sbom_tool":"syft","sbom_format":"cyclonedx-1.6","scan_tool":"grype","vulnerabilities":{"critical":${{ steps.grype.outputs.critical || 0 }},"high":${{ steps.grype.outputs.high || 0 }},"medium":${{ steps.grype.outputs.medium || 0 }},"low":${{ steps.grype.outputs.low || 0 }}},"result":"${{ steps.grype.outputs.result || 'UNKNOWN' }}","csap_ref":"D-12-03","pipeline_run":"${{ github.run_id }}"}
          EOF

      - name: Upload audit log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom-audit-${{ matrix.service }}
          path: sbom-scan-audit.jsonl
          retention-days: 365

  # ===========================================================================
  # STAGE 3: Cosign SBOM Attestation
  # Design Ref: MTU-N37 S3.4
  # Plan SC: FR-N37.5
  # CSAP: D-11 (이미지 무결성)
  # ===========================================================================
  sbom-attestation:
    name: "SBOM Attestation (Cosign)"
    runs-on: self-hosted
    needs: [sbom-generate, grype-scan]
    if: ${{ needs.grype-scan.result == 'success' }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - tenant-service
          - menu-service
          - catalog-service
          - subscription-service
          - billing-service
          - crm-service
          - ai-service
          - notification-service
          - file-service
          - audit-service
          - compliance-service
          - security-service
          - security-monitor-service
          - portal

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Cosign
        run: |
          if ! command -v cosign &>/dev/null; then
            curl -sSfL https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 \
              -o /usr/local/bin/cosign
            chmod +x /usr/local/bin/cosign
          fi
          cosign version

      - name: Determine image reference
        id: image
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            TAG="${{ github.event.inputs.image_tag }}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            TAG="main-$(echo ${{ github.sha }} | cut -c1-7)"
          else
            TAG="stg-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          IMAGE="${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ matrix.service }}:${TAG}"
          echo "ref=${IMAGE}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Download SBOM artifact
        uses: actions/download-artifact@v4
        with:
          name: sbom-${{ matrix.service }}-${{ steps.image.outputs.tag }}
          path: sbom-attest/

      - name: Login to Harbor
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login \
            "${{ env.HARBOR_REGISTRY }}" \
            -u "${{ secrets.HARBOR_USERNAME }}" \
            --password-stdin

      # SBOM Attestation 첨부
      - name: Attest SBOM to image
        env:
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          SBOM_FILE="sbom-attest/sbom-${{ matrix.service }}.cdx.json"
          if [ -f "$SBOM_FILE" ]; then
            echo "=== Attesting SBOM to ${{ steps.image.outputs.ref }} ==="
            cosign attest \
              --key ${{ env.COSIGN_KEY_PATH }} \
              --type cyclonedx \
              --predicate "$SBOM_FILE" \
              --allow-insecure-registry \
              -y \
              "${{ steps.image.outputs.ref }}" && \
              echo "[OK] SBOM attestation 완료: ${{ matrix.service }}" || \
              echo "[WARN] Attestation 실패 (이미지 접근 불가 가능)"
          else
            echo "[SKIP] SBOM 파일 없음"
          fi

      # Attestation 검증
      - name: Verify attestation
        run: |
          cosign verify-attestation \
            --key infra/cosign/cosign.pub \
            --type cyclonedx \
            --insecure-ignore-tlog \
            --allow-insecure-registry \
            "${{ steps.image.outputs.ref }}" 2>/dev/null && \
            echo "[OK] Attestation 검증 성공: ${{ matrix.service }}" || \
            echo "[INFO] Attestation 검증 불가 (이미지 미존재 시 정상)"

  # ===========================================================================
  # STAGE 4: 통합 요약 + 감사
  # Design Ref: MTU-N37 S3.6
  # ===========================================================================
  summary:
    name: "Scan Summary"
    runs-on: self-hosted
    needs: [sbom-generate, grype-scan, sbom-attestation]
    if: always()

    steps:
      - name: Pipeline Summary
        run: |
          echo "================================================================"
          echo "  SBOM & Vulnerability Scan Summary"
          echo "================================================================"
          echo "  Trigger:      ${{ github.event_name }}"
          echo "  Branch:       ${{ github.ref_name }}"
          echo "  Commit:       ${{ github.sha }}"
          echo "  SBOM Gen:     ${{ needs.sbom-generate.result }}"
          echo "  Grype Scan:   ${{ needs.grype-scan.result }}"
          echo "  Attestation:  ${{ needs.sbom-attestation.result }}"
          echo "  Time:         $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "================================================================"
          echo ""
          echo "  CSAP D-12-03: 소프트웨어 공급망 보안 자동화"
          echo "  CSAP D-06:    감사 추적 (아티팩트 365일 보존)"
          echo "  CSAP D-11:    이미지 무결성 (Cosign SBOM Attestation)"
          echo "================================================================"
