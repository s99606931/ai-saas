# 공공기관 SaaS 플랫폼 — 배포 파이프라인
# Design Ref: DESIGN-MTU-DEP3
# Plan SC: FR-DEP3.3
# CSAP: D-11 가상화 보안, D-12 시스템 개발 보안

name: Deploy

on:
  push:
    branches: [main, stg]
    tags: ["v*"]

env:
  REGISTRY: ${{ secrets.HARBOR_URL || 'localhost:8080' }}
  IMAGE_PREFIX: public-saas

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: self-hosted
    timeout-minutes: 30

    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - user-service
          - tenant-service
          - menu-service
          - catalog-service
          - subscription-service
          - billing-service
          - crm-service
          - ai-service
          - notification-service
          - file-service
          - audit-service
          - compliance-service
          - security-service
          - security-monitor-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}" >> $GITHUB_OUTPUT

      # Harbor 레지스트리 로그인 (Design Ref: MTU-N12 | Plan SC: FR-N12.2)
      - name: Login to Harbor registry
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login \
            "${{ env.REGISTRY }}" \
            -u "${{ secrets.HARBOR_USERNAME }}" \
            --password-stdin

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: platform/services/${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test container health
        run: |
          docker run -d --name test-${{ matrix.service }} \
            -e NODE_ENV=test \
            -e DATABASE_URL=postgresql://test:test@localhost:5432/test \
            -e REDIS_URL=redis://localhost:6379 \
            -e JWT_SECRET=test-secret \
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}

          # 컨테이너 시작 대기 (최대 30초)
          for i in $(seq 1 30); do
            if docker inspect --format='{{.State.Running}}' test-${{ matrix.service }} 2>/dev/null | grep -q true; then
              echo "Container is running"
              break
            fi
            sleep 1
          done

          docker stop test-${{ matrix.service }} || true
          docker rm test-${{ matrix.service }} || true

      # Harbor 레지스트리 푸시 (Design Ref: MTU-N12 | Plan SC: FR-N12.1)
      - name: Push to Harbor registry
        run: |
          docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"
          docker push "${{ steps.meta.outputs.image }}:latest"
          echo "Pushed: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}"

  build-portal:
    name: Build & Push Portal
    runs-on: self-hosted
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Harbor 로그인 (Design Ref: MTU-N12)
      - name: Login to Harbor registry
        run: |
          echo "${{ secrets.HARBOR_PASSWORD }}" | docker login \
            "${{ env.REGISTRY }}" \
            -u "${{ secrets.HARBOR_USERNAME }}" \
            --password-stdin

      - name: Extract metadata
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
          else
            VERSION="sha-$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build portal image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: platform/apps/portal/Dockerfile
          push: false
          load: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/portal:${{ steps.meta.outputs.version }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/portal:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Portal Harbor push (Design Ref: MTU-N12)
      - name: Push portal to Harbor
        run: |
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/portal:${{ steps.meta.outputs.version }}"
          docker push "${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/portal:latest"

  # Helm 배포 (Design Ref: DESIGN-MTU-N05 | Plan SC: FR-N05.4)
  helm-deploy:
    name: Helm Deploy
    runs-on: self-hosted
    needs: [build-and-push, build-portal]
    if: success()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.0

      - name: Configure kubectl
        uses: azure/k8s-set-context@v4
        with:
          kubeconfig: ${{ secrets.KUBECONFIG }}

      - name: Determine values file
        id: values
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "file=helm/saas-platform/values-prod.yaml" >> $GITHUB_OUTPUT
            echo "release=saas-prod" >> $GITHUB_OUTPUT
          else
            echo "file=helm/saas-platform/values-stg.yaml" >> $GITHUB_OUTPUT
            echo "release=saas-stg" >> $GITHUB_OUTPUT
          fi

      - name: Helm upgrade
        run: |
          helm upgrade --install ${{ steps.values.outputs.release }} \
            ./helm/saas-platform/ \
            -f ${{ steps.values.outputs.file }} \
            --namespace saas-platform \
            --create-namespace \
            --set global.imageRegistry=${{ env.REGISTRY }} \
            --wait \
            --timeout 10m

  deploy-notification:
    name: Deployment Notification
    runs-on: self-hosted
    needs: [build-and-push, build-portal, helm-deploy]
    if: success()

    steps:
      - name: Log deployment
        run: |
          echo "================================================================"
          echo " Deployment Summary"
          echo "================================================================"
          echo " Branch: ${{ github.ref_name }}"
          echo " Commit: ${{ github.sha }}"
          echo " Author: ${{ github.actor }}"
          echo " Time:   $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo " Status: SUCCESS"
          echo "================================================================"

      # CSAP D-06: 감사 로그 기록
      - name: Audit log
        run: |
          echo "{\"timestamp\":\"$(date -u '+%Y-%m-%dT%H:%M:%SZ')\",\"action\":\"DEPLOY\",\"actor\":\"${{ github.actor }}\",\"ref\":\"${{ github.ref_name }}\",\"sha\":\"${{ github.sha }}\",\"status\":\"success\"}" >> deploy-audit.jsonl

      - name: Upload audit log
        uses: actions/upload-artifact@v4
        with:
          name: deploy-audit
          path: deploy-audit.jsonl
          retention-days: 365
