# 공공기관 SaaS 플랫폼 -- k8s ConfigMap
# 비민감 설정값. CSAP D-08: 시크릿 분리 원칙 준수.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: saas-config
  namespace: saas-platform
  labels:
    app.kubernetes.io/name: saas-platform
data:
  # 공통 환경
  NODE_ENV: "production"
  LOG_LEVEL: "info"
  TZ: "Asia/Seoul"

  # 서비스 디스커버리 (k8s 내부 DNS)
  AUTH_SERVICE_URL: "http://auth-service:3001"
  USER_SERVICE_URL: "http://user-service:3002"
  TENANT_SERVICE_URL: "http://tenant-service:3003"
  MENU_SERVICE_URL: "http://menu-service:3004"
  CATALOG_SERVICE_URL: "http://catalog-service:3005"
  SUBSCRIPTION_SERVICE_URL: "http://subscription-service:3006"
  BILLING_SERVICE_URL: "http://billing-service:3007"
  CRM_SERVICE_URL: "http://crm-service:3008"
  AI_SERVICE_URL: "http://ai-service:3009"
  NOTIFICATION_SERVICE_URL: "http://notification-service:3010"
  FILE_SERVICE_URL: "http://file-service:3011"
  AUDIT_SERVICE_URL: "http://audit-service:3012"
  COMPLIANCE_SERVICE_URL: "http://compliance-service:3013"
  SECURITY_MONITOR_URL: "http://security-monitor-service:3014"
  API_GATEWAY_URL: "http://api-gateway:3000"

  # 인프라 엔드포인트 (비민감)
  POSTGRES_HOST: "postgres-svc"
  POSTGRES_PORT: "5432"
  REDIS_HOST: "redis-svc"
  REDIS_PORT: "6379"
  MINIO_ENDPOINT: "minio-svc"
  MINIO_PORT: "9000"

  # CSAP/N2SF 설정
  CSAP_GRADE: "standard"
  N2SF_DATA_GRADE: "O"
  AUDIT_RETENTION_DAYS: "365"
  SESSION_MAX_CONCURRENT: "3"
  JWT_ACCESS_EXPIRY: "15m"
  JWT_REFRESH_EXPIRY: "7d"
