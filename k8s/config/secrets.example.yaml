# 공공기관 SaaS 플랫폼 -- k8s Secret 템플릿
# CSAP D-09: 시크릿은 반드시 환경별로 생성. 이 파일은 구조 참조용 예제.
# 실제 시크릿은 k8s/config/secrets.yaml에 base64 인코딩하여 작성 (gitignore 대상)
#
# 사용법:
#   1. 이 파일을 secrets.yaml로 복사
#   2. 각 값을 base64 인코딩하여 교체: echo -n "값" | base64
#   3. kubectl apply -f k8s/config/secrets.yaml
---
apiVersion: v1
kind: Secret
metadata:
  name: saas-secrets
  namespace: saas-platform
data:
  DATABASE_URL: <base64-encoded>    # postgresql://user:pass@postgres-svc:5432/saas_platform
  DB_NAME: <base64-encoded>         # saas_platform
  DB_USER: <base64-encoded>         # saas
  DB_PASSWORD: <base64-encoded>     # (운영 환경별 고유 값)
  JWT_SECRET: <base64-encoded>      # (32자 이상 랜덤 문자열)
  JWT_PRIVATE_KEY: <base64-encoded> # (RSA 2048+ 개인 키)
  JWT_PUBLIC_KEY: <base64-encoded>  # (RSA 2048+ 공개 키)
  REDIS_URL: <base64-encoded>       # redis://default:pass@redis-svc:6379
  REDIS_PASSWORD: <base64-encoded>  # (운영 환경별 고유 값)
  MINIO_USER: <base64-encoded>      # (MinIO 관리자 계정)
  MINIO_PASSWORD: <base64-encoded>  # (MinIO 관리자 비밀번호)
