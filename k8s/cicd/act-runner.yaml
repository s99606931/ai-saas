# Act Runner Deployment -- k3s 배포용
# Design Ref: MTU-N28 SS4 | Plan SC: FR-N28.9
# CSAP: D-08 (접근통제)
#
# [주의] RUNNER_REGISTRATION_TOKEN은 Gitea 배포 후 발급하여 Secret에 추가 필수
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: act-runner-data
  namespace: cicd
  labels:
    app.kubernetes.io/name: act-runner
    app.kubernetes.io/part-of: saas-platform
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: act-runner
  namespace: cicd
  labels:
    app.kubernetes.io/name: act-runner
    app.kubernetes.io/part-of: saas-platform
    app.kubernetes.io/component: ci-runner
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: act-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: act-runner
        app.kubernetes.io/part-of: saas-platform
    spec:
      containers:
      - name: act-runner
        # latest 태그 제거 (인프라 안티패턴 수정): 버전 고정으로 예측 가능한 배포 보장
        # 업그레이드 시 버전 명시 변경 후 kubectl rollout restart
        image: gitea/act_runner:0.2.6
        env:
        - name: GITEA_INSTANCE_URL
          value: "http://gitea-http.cicd.svc.cluster.local:3000"
        - name: GITEA_RUNNER_REGISTRATION_TOKEN
          valueFrom:
            secretKeyRef:
              name: cicd-secrets
              key: RUNNER_REGISTRATION_TOKEN
        - name: GITEA_RUNNER_NAME
          value: "k3s-runner"
        - name: GITEA_RUNNER_LABELS
          value: "self-hosted,ubuntu-latest:host"
        resources:
          limits:
            memory: 512Mi
            cpu: "1"
          requests:
            memory: 256Mi
            cpu: 100m
        volumeMounts:
        - name: runner-data
          mountPath: /data
      volumes:
      - name: runner-data
        persistentVolumeClaim:
          claimName: act-runner-data
