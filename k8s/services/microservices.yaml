# 공공기관 SaaS 플랫폼 — 마이크로서비스 15종 k8s 매니페스트
# Design Ref: DESIGN-MTU-DEP2 | CSAP: D-11
# CSAP D-10: NetworkPolicy 적용 (k8s/config/network-policy.yaml)
# 보안 강화: securityContext (non-root, readOnlyRootFilesystem), livenessProbe 추가
# CSAP D-07: terminationGracePeriodSeconds 30초 (graceful shutdown 연동)
---
# auth-service (3001)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: saas-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: auth-service
        image: saas/auth-service:dev
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3001
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        envFrom:
        - secretRef:
            name: saas-secrets
        env:
        - name: AUTH_SERVICE_PORT
          value: "3001"
        - name: NODE_ENV
          value: "production"
        readinessProbe:
          httpGet:
            path: /ready
            port: 3001
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 30
          failureThreshold: 3
        resources:
          limits:
            memory: 256Mi
            cpu: 500m
          requests:
            memory: 128Mi
            cpu: 100m
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: saas-platform
spec:
  selector:
    app: auth-service
  ports:
  - port: 3001
    targetPort: 3001
---
