# 공공기관 SaaS 플랫폼 -- MinIO (S3 호환 오브젝트 스토리지)
# Design Ref: DESIGN-MTU-DEP2 | CSAP: D-09 (파일 암호화 저장)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: saas-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
      - name: minio
        image: minio/minio:RELEASE.2024-06-13T22-53-53Z
        command:
        - minio
        - server
        - /data
        - --console-address
        - ":9001"
        ports:
        - containerPort: 9000
          name: api
        - containerPort: 9001
          name: console
        env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              name: saas-secrets
              key: MINIO_USER
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: saas-secrets
              key: MINIO_PASSWORD
        readinessProbe:
          httpGet:
            path: /minio/health/ready
            port: 9000
          initialDelaySeconds: 10
          periodSeconds: 10
        volumeMounts:
        - name: minio-data
          mountPath: /data
        resources:
          limits:
            memory: 512Mi
      volumes:
      - name: minio-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio-svc
  namespace: saas-platform
spec:
  selector:
    app: minio
  ports:
  - port: 9000
    targetPort: 9000
    name: api
  - port: 9001
    targetPort: 9001
    name: console
