apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: saas-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        command:
        - sh
        - -c
        - redis-server --requirepass $(REDIS_PASSWORD)
        ports:
        - containerPort: 6379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: saas-secrets
              key: REDIS_PASSWORD
        readinessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a $REDIS_PASSWORD ping
          initialDelaySeconds: 5
          periodSeconds: 5
        # 인프라 안티패턴 수정: livenessProbe 추가 (행 감지)
        livenessProbe:
          exec:
            command:
            - sh
            - -c
            - redis-cli -a $REDIS_PASSWORD ping
          initialDelaySeconds: 30
          periodSeconds: 20
          failureThreshold: 3
        # 인프라 안티패턴 수정: 리소스 제한 추가
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis-svc
  namespace: saas-platform
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
